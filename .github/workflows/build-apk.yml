name: Build Final Stable APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android Project & Clean Icon Handling
      run: |
        mkdir -p app/src/main/assets app/src/main/java/com/mh/farmer app/src/main/res/values app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable
        
        # Copy index.html for instant local load and offline fallback
        cp index.html app/src/main/assets/index.html

        # Smart detection of your custom PNG logo in repository
        FOUND_PNG=""
        for img in 192.png 512.png logo.png icon.png; do
          if [ -f "$img" ]; then
            FOUND_PNG="$img"
            break
          fi
        done
        
        if [ -z "$FOUND_PNG" ]; then
          FOUND_PNG=$(ls *.png 2>/dev/null | head -n 1)
        fi

        # If custom PNG exists, use it. Otherwise, create a clean modern vector background XML so Android default robot logo NEVER appears.
        if [ -n "$FOUND_PNG" ] && [ -f "$FOUND_PNG" ]; then
          echo "Using custom user logo: $FOUND_PNG"
          cp "$FOUND_PNG" app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp "$FOUND_PNG" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        else
          echo "Generating clean modern fallback icon (No Android Robot)"
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#047857"/>
              <corners android:radius="24dp"/>
          </shape>
EOF
          cp app/src/main/res/drawable/ic_launcher_background.xml app/src/main/res/mipmap-hdpi/ic_launcher.xml
          cp app/src/main/res/drawable/ic_launcher_background.xml app/src/main/res/mipmap-xxxhdpi/ic_launcher.xml
        fi

        # Create strings.xml
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">The MH Farmer</string>
        </resources>
        EOF
        
        # Create AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Create MainActivity.java with Live OTA GitHub Sync + Full IndexedDB Storage
        cat << 'EOF' > app/src/main/java/com/mh/farmer/MainActivity.java
        package com.mh.farmer;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.net.ConnectivityManager;
        import android.net.NetworkInfo;

        public class MainActivity extends Activity {
            private WebView webView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                setContentView(webView);
                
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setAllowContentAccess(true);
                settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                
                webView.setWebViewClient(new WebViewClient());
                
                if (isNetworkAvailable()) {
                    webView.loadUrl("https://raw.githubusercontent.com/sarveshkathmale40/Cattle-tracker/main/index.html");
                } else {
                    webView.loadUrl("file:///android_asset/index.html");
                }
            }
            
            private boolean isNetworkAvailable() {
                ConnectivityManager cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                NetworkInfo netInfo = cm.getActiveNetworkInfo();
                return netInfo != null && netInfo.isConnected();
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

        # Create app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.mh.farmer'
            compileSdk 34
            defaultConfig {
                applicationId "com.mh.farmer"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # Create root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # Create settings.gradle
        echo "include ':app'" > settings.gradle

        # Create gradle.properties
        echo "android.useAndroidX=true" > gradle.properties

        # Setup Stable Gradle Wrapper 8.5
        gradle wrapper --gradle-version 8.5

    - name: Build Final APK
      run: ./gradlew assembleDebug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MH_Farmer_Final_App
        path: app/build/outputs/apk/debug/app-debug.apk
