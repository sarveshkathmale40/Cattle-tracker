name: Build Final Stable Live-Sync APK v21

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Android App with Permanent Session and Live Sync
      run: |
        mkdir -p app/src/main/assets app/src/main/java/com/mh/tracker app/src/main/res/values app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xxxhdpi
        
        # Offline fallback asset
        cp index.html app/src/main/assets/index.html
        echo '<resources><string name="app_name">The MH Farmer</string></resources>' > app/src/main/res/values/strings.xml
        
        # Custom cow icon setup
        ICON_IMG=""
        for img in cow.png logo.png icon.png; do
          if [ -f "$img" ]; then
            ICON_IMG="$img"
            break
          fi
        done

        if [ -n "$ICON_IMG" ]; then
          cp "$ICON_IMG" app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp "$ICON_IMG" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        else
          echo 'R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7' | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          echo 'R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7' | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        fi

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
            
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # MainActivity with robust online fetching and permanent session handling
        cat << 'EOF' > app/src/main/java/com/mh/tracker/MainActivity.java
        package com.mh.tracker;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.webkit.WebChromeClient;
        import android.webkit.ValueCallback;
        import android.webkit.PermissionRequest;
        import android.net.Uri;
        import android.content.Intent;
        import android.net.ConnectivityManager;
        import android.net.NetworkInfo;
        import android.webkit.CookieManager;
        import android.webkit.WebStorage;
        import java.io.BufferedReader;
        import java.io.InputStreamReader;
        import java.net.HttpURLConnection;
        import java.net.URL;

        public class MainActivity extends Activity {
            private WebView webView;
            private ValueCallback<Uri[]> uploadMessage;
            private final static int FILE_CHOOSER_RESULT_CODE = 1;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                setContentView(webView);
                
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setAllowContentAccess(true);
                settings.setAllowUniversalAccessFromFileURLs(true);
                settings.setAllowFileAccessFromFileURLs(true);
                settings.setCacheMode(WebSettings.LOAD_NO_CACHE);
                settings.setLoadsImagesAutomatically(true);
                settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                
                CookieManager.getInstance().setAcceptCookie(true);
                CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
                
                webView.setWebViewClient(new WebViewClient() {
                    @Override
                    public boolean shouldOverrideUrlLoading(WebView view, String url) {
                        view.loadUrl(url);
                        return true;
                    }
                });

                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                        if (uploadMessage != null) {
                            uploadMessage.onReceiveValue(null);
                        }
                        uploadMessage = filePathCallback;
                        
                        Intent contentSelectionIntent = new Intent(Intent.ACTION_GET_CONTENT);
                        contentSelectionIntent.addCategory(Intent.CATEGORY_OPENABLE);
                        contentSelectionIntent.setType("image/*");
                        
                        Intent chooserIntent = new Intent(Intent.ACTION_CHOOSER);
                        chooserIntent.putExtra(Intent.EXTRA_INTENT, contentSelectionIntent);
                        chooserIntent.putExtra(Intent.EXTRA_TITLE, "Select Animal Image");
                        
                        startActivityForResult(chooserIntent, FILE_CHOOSER_RESULT_CODE);
                        return true;
                    }

                    @Override
                    public void onPermissionRequest(final PermissionRequest request) {
                        request.grant(request.getResources());
                    }
                });
                
                loadLiveContent();
            }

            public void loadLiveContent() {
                if (isNetworkAvailable()) {
                    new Thread(new Runnable() {
                        @Override
                        public void run() {
                            try {
                                long timestamp = System.currentTimeMillis();
                                URL url = new URL("https://raw.githubusercontent.com/sarveshkathmale40/Cattle-tracker/main/index.html?v=" + timestamp);
                                HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                                conn.setConnectTimeout(8000);
                                conn.setReadTimeout(8000);
                                BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                                StringBuilder html = new StringBuilder();
                                String line;
                                while ((line = reader.readLine()) != null) {
                                    html.append(line);
                                }
                                reader.close();
                                
                                final String finalHtml = html.toString();
                                if (finalHtml.length() > 50) {
                                    runOnUiThread(new Runnable() {
                                        @Override
                                        public void run() {
                                            webView.loadDataWithBaseURL("https://raw.githubusercontent.com/sarveshkathmale40/Cattle-tracker/main/", finalHtml, "text/html", "UTF-8", null);
                                        }
                                    });
                                    return;
                                }
                            } catch (Exception e) {}
                            
                            runOnUiThread(new Runnable() {
                                @Override
                                public void run() {
                                    webView.loadUrl("file:///android_asset/index.html");
                                }
                            });
                        }
                    }).start();
                } else {
                    webView.loadUrl("file:///android_asset/index.html");
                }
            }

            private boolean isNetworkAvailable() {
                ConnectivityManager cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                NetworkInfo netInfo = cm.getActiveNetworkInfo();
                return netInfo != null && netInfo.isConnected();
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent intent) {
                if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                    if (uploadMessage == null) return;
                    Uri[] results = null;
                    if (resultCode == RESULT_OK) {
                        if (intent != null) {
                            String dataString = intent.getDataString();
                            if (dataString != null) {
                                results = new Uri[]{Uri.parse(dataString)};
                            }
                        }
                    }
                    uploadMessage.onReceiveValue(results);
                    uploadMessage = null;
                }
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.mh.tracker'
            compileSdk 34
            defaultConfig {
                applicationId "com.mh.tracker"
                minSdk 21
                targetSdk 34
                versionCode 21
                versionName "21.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        echo "include ':app'" > settings.gradle
        echo "android.useAndroidX=true" > gradle.properties

        gradle wrapper --gradle-version 8.5
        ./gradlew assembleDebug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MH_Farmer_Final_Stable_v21
        path: app/build/outputs/apk/debug/app-debug.apk
