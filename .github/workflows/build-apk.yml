name: Build Native APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Basic Android Project Structure with Custom Icon
      run: |
        mkdir -p app/src/main/assets app/src/main/java/com/mh/farmer app/src/main/res/values app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xxxhdpi
        
        # Copy index.html into Android Assets
        cp index.html app/src/main/assets/index.html
        
        # Check and copy existing PNG icons from repository if available
        if [ -f "192.png" ]; then
          cp 192.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp 192.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        elif [ -f "512.png" ]; then
          cp 512.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp 512.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        fi

        # Create strings.xml for app name
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">The MH Farmer</string>
        </resources>
        EOF
        
        # Create AndroidManifest.xml with custom launcher icon
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Create MainActivity.java
        cat << 'EOF' > app/src/main/java/com/mh/farmer/MainActivity.java
        package com.mh.farmer;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            private WebView webView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                setContentView(webView);
                
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setAllowContentAccess(true);
                
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
            }
            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

        # Create app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.mh.farmer'
            compileSdk 34
            defaultConfig {
                applicationId "com.mh.farmer"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # Create root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # Create settings.gradle
        echo "include ':app'" > settings.gradle

        # Create gradle.properties
        echo "android.useAndroidX=true" > gradle.properties

        # Setup Gradle Wrapper with stable version 8.5
        gradle wrapper --gradle-version 8.5

    - name: Build Debug APK with Stable Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MH_Farmer_Native_App
        path: app/build/outputs/apk/debug/app-debug.apk
