<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The MH Farmer">

<link rel="manifest" href="manifest.json">
<title>The MH Farmer - Cattle Tracker</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:#f1f5f9;
  min-height:100vh;
  padding:10px;
  color:#0f172a;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.wrap{
  width:100%;
  max-width:420px;
}

.app-header{
  background:linear-gradient(135deg,#166534,#15803d);
  color:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:12px;
  box-shadow:0 10px 25px rgba(22,101,52,0.2);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-title{
  font-size:20px;
  font-weight:800;
  letter-spacing:0.5px;
}

.card{
  background:white;
  border-radius:20px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.04);
  border:1px solid #e2e8f0;
}

.card h3{
  font-size:16px;
  font-weight:700;
  margin-bottom:12px;
  color:#166534;
  display:flex;
  align-items:center;
  gap:6px;
}

input,select,textarea{
  width:100%;
  padding:12px 14px;
  border:2px solid #e2e8f0;
  border-radius:14px;
  font-size:15px;
  outline:none;
  background:#f8fafc;
  margin-bottom:12px;
  font-weight:600;
  font-family:inherit;
  transition:all 0.3s;
}

input:focus,select:focus,textarea:focus{
  border-color:#16a34a;
  background:white;
  box-shadow:0 0 0 4px rgba(22,163,74,0.1);
}

.btn{
  width:100%;
  background:linear-gradient(135deg,#16a34a,#15803d);
  color:white;
  border:none;
  padding:14px;
  border-radius:14px;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 6px 15px rgba(22,163,74,0.3);
  transition:transform 0.1s;
}

.btn:active{
  transform:scale(0.98);
}

.animal-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:12px;
}

.animal-btn{
  border:2px solid #e2e8f0;
  background:#f8fafc;
  padding:12px 5px;
  border-radius:14px;
  cursor:pointer;
  font-weight:700;
  color:#475569;
  text-align:center;
  transition:all 0.2s;
}

.animal-btn.active{
  border-color:#16a34a;
  background:#f0fdf4;
  color:#166534;
  box-shadow:0 4px 12px rgba(22,163,74,0.15);
}

.photo-preview{
  width:70px;
  height:70px;
  border-radius:14px;
  object-fit:cover;
  display:none;
  margin:0 auto 12px;
  border:2px solid #16a34a;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}

.stat{
  background:white;
  padding:12px 4px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 4px 12px rgba(0,0,0,.03);
  border:1px solid #e2e8f0;
}

.stat-number{
  font-size:22px;
  font-weight:800;
  color:#166534;
}

.stat-label{
  font-size:11px;
  color:#64748b;
  font-weight:600;
}

.item{
  background:white;
  border-radius:16px;
  padding:14px;
  border:1px solid #e2e8f0;
  margin-bottom:12px;
  display:flex;
  gap:12px;
  align-items:flex-start;
  box-shadow:0 4px 15px rgba(0,0,0,.02);
}

.cow-img{
  width:64px;
  height:64px;
  border-radius:14px;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
  flex-shrink:0;
  overflow:hidden;
  border:2px solid #e2e8f0;
}

.cow-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.item-info{
  flex-grow:1;
  min-width:0;
}

.item-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-weight:700;
  font-size:14px;
  border-bottom:1px solid #f1f5f9;
  padding-bottom:6px;
  margin-bottom:6px;
  color:#1e293b;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
  padding:4px 0;
  color:#475569;
}

.due{
  background:#f0fdf4;
  padding:8px;
  border-radius:10px;
  color:#166534;
  font-weight:700;
  margin-top:6px;
  border:1px solid #dcfce7;
}

.alert-box{
  background:#fef2f2;
  border:1px solid #fee2e2;
  border-radius:10px;
  padding:8px;
  font-size:11px;
  color:#b91c1c;
  margin-top:6px;
  font-weight:700;
}

.note-box{
  background:#fffbeb;
  border:1px solid #fef3c7;
  border-radius:10px;
  padding:8px;
  font-size:11px;
  color:#92400e;
  margin-top:6px;
}

.action-btns{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.btn-repeat{
  flex:1;
  background:#eff6ff;
  color:#1d4ed8;
  border:1px solid #bfdbfe;
  padding:8px;
  border-radius:10px;
  font-weight:700;
  font-size:11px;
  cursor:pointer;
  text-align:center;
}

.btn-del{
  flex:1;
  background:#fee2e2;
  color:#b91c1c;
  border:none;
  padding:8px;
  border-radius:10px;
  font-weight:700;
  font-size:11px;
  cursor:pointer;
  text-align:center;
}

.empty{
  text-align:center;
  color:#94a3b8;
  font-size:14px;
  padding:20px;
  font-weight:600;
}
</style>
</head>

</div>


<div class="card">

<div id="list"></div>

</div>

</div>

function getLang(){

let lang = "mr";

try{

const saved = localStorage.getItem("cattle_lang");

if(saved === "mr" || saved === "hi" || saved === "en"){
lang = saved;
}

}catch(error){}

return lang;

}


function changeLanguage(){

const select = document.getElementById("langSelect");

if(!select) return;

const lang = select.value;

const t = langData[lang] || langData.mr;


try{
localStorage.setItem("cattle_lang",lang);
}catch(error){}


document.getElementById("mainHeaderTitle").innerText = t.headerTitle;
document.getElementById("mainHeaderSub").innerText = t.headerSub;

document.getElementById("lblTotal").innerText = t.tot;
document.getElementById("lblCow").innerText = t.cow;
document.getElementById("lblBuf").innerText = t.buf;

document.getElementById("formTitle").innerHTML =
"<span>➕</span> " + t.formT;

document.getElementById("btnCowTxt").innerText = t.bCow;
document.getElementById("btnBufTxt").innerText = t.bBuf;

document.getElementById("cName").placeholder = t.namePh;
document.getElementById("lblDate").innerText = t.dtLbl;
document.getElementById("cNote").placeholder = t.notePh;

document.getElementById("btnSave").innerText = t.saveBtn;

document.getElementById("listTitle").innerHTML =
"<span>📋</span> " + t.listT;

draw();

}


function selectAnimal(type){

cur = type;

document.getElementById("cowBtn").classList.remove("active");
document.getElementById("buffaloBtn").classList.remove("active");

if(type === "cow"){
document.getElementById("cowBtn").classList.add("active");
}

if(type === "buffalo"){
document.getElementById("buffaloBtn").classList.add("active");
}

}


function getDB(){

try{

const data = localStorage.getItem("cattle_tracker_db");

if(!data) return [];

const parsed = JSON.parse(data);

return Array.isArray(parsed) ? parsed : [];

}catch(error){

return [];

}

}


function compressImage(file,callback){

const reader = new FileReader();

reader.onload = function(e){

const img = new Image();

img.onload = function(){

const canvas = document.createElement("canvas");

const MAX_WIDTH = 400;
const MAX_HEIGHT = 400;

let width = img.width;
let height = img.height;

if(width > height){

if(width > MAX_WIDTH){

height = height * MAX_WIDTH / width;
width = MAX_WIDTH;

}

}else{

if(height > MAX_HEIGHT){

width = width * MAX_HEIGHT / height;
height = MAX_HEIGHT;

}

}

canvas.width = width;
canvas.height = height;

const ctx = canvas.getContext("2d");

ctx.drawImage(img,0,0,width,height);

callback(canvas.toDataURL("image/jpeg",0.7));

};

img.onerror = function(){
alert("फोटो लोड होऊ शकला नाही.");
};

img.src = e.target.result;

};

reader.onerror = function(){
alert("फोटो वाचता आला नाही.");
};

reader.readAsDataURL(file);

}


function previewPhoto(){

const input = document.getElementById("cPhoto");
const preview = document.getElementById("photoPreview");

if(input.files && input.files[0]){

compressImage(input.files[0],function(data){

preview.src = data;
preview.style.display = "block";

});

}else{

preview.src = "";
preview.style.display = "none";

}

}


function saveData(){

const dt = document.getElementById("cDate").value;

const lang = getLang();
const t = langData[lang] || langData.mr;

if(!dt){

alert(t.dateRequired);
return;

}


const inputDate = new Date(dt + "T00:00:00");

const today = new Date();
today.setHours(0,0,0,0);

if(inputDate > today){

alert(t.futureDateError);
return;

}


const nm =
document.getElementById("cName").value.trim() ||
(cur === "cow" ? t.bCow : t.bBuf);

const nt =
document.getElementById("cNote").value.trim();

const previewImg =
document.getElementById("photoPreview");

const photoData =
previewImg.style.display === "block"
? previewImg.src
: "";


pushToDB(nm,cur,dt,nt,photoData);

}


function pushToDB(nm,type,dt,nt,photo){

const lang = getLang();
const t = langData[lang] || langData.mr;

const db = getDB();

db.unshift({
id:Date.now(),
name:nm,
type:type,
date:dt,
note:nt,
photo:photo
});


try{

localStorage.setItem(
"cattle_tracker_db",
JSON.stringify(db)
);

}catch(error){

alert(t.storageError);
return;

}


document.getElementById("cName").value = "";
document.getElementById("cNote").value = "";
document.getElementById("cPhoto").value = "";

document.getElementById("photoPreview").style.display = "none";
document.getElementById("photoPreview").src = "";

draw();

}


function delData(id){

const lang = getLang();
const t = langData[lang] || langData.mr;

if(!confirm(t.confirmDel)) return;


try{

const db = getDB().filter(item => item.id !== id);

localStorage.setItem(
"cattle_tracker_db",
JSON.stringify(db)
);

draw();

}catch(error){

alert(t.storageError);

}

}


function updateDate(id){

const lang = getLang();
const t = langData[lang] || langData.mr;

const todayStr = getTodayDate();

let newDt = prompt(
t.promptNewDate,
todayStr
);

if(!newDt) return;


const inputDate = new Date(newDt + "T00:00:00");

const today = new Date();
today.setHours(0,0,0,0);

if(inputDate > today){

alert(t.futureDateError);
return;

}


try{

let db = getDB();

db.forEach(item => {

if(item.id === id){
item.date = newDt;
}

});

localStorage.setItem(
"cattle_tracker_db",
JSON.stringify(db)
);

draw();

}catch(error){

alert(t.storageError);

}

}


function getTodayDate(){

const d = new Date();

const year = d.getFullYear();
const month = String(d.getMonth()+1).padStart(2,"0");
const day = String(d.getDate()).padStart(2,"0");

return year + "-" + month + "-" + day;

}


function addD(str,days){

const d = new Date(str + "T00:00:00");

d.setDate(d.getDate()+days);

return String(d.getDate()).padStart(2,"0")
+
"/"
+
String(d.getMonth()+1).padStart(2,"0")
+
"/"
+
d.getFullYear();

}


function getFormattedDuration(startDateStr,lang){

const start =
new Date(startDateStr + "T00:00:00");

const today = new Date();

today.setHours(0,0,0,0);

let diffTime = today - start;

let totalDays =
Math.floor(
diffTime /
(1000*60*60*24)
);

if(totalDays < 0) totalDays = 0;


let months = 0;

let tempDate = new Date(start);

while(true){

let nextMonthDate = new Date(tempDate);

nextMonthDate.setMonth(
nextMonthDate.getMonth()+1
);

if(nextMonthDate <= today){

months++;
tempDate = nextMonthDate;

}else{

break;

}

}


let days =
Math.floor(
(today-tempDate) /
(1000*60*60*24)
);

if(days < 0) days = 0;


if(lang === "en"){

if(months === 0)
return totalDays + " days completed";

if(days === 0)
return months +
(months === 1
? " month completed"
: " months completed");

return months +
(months === 1
? " month "
: " months ")
+
days +
(days === 1
? " day"
: " days");

}


if(lang === "hi"){

if(months === 0)
return totalDays + " दिन पूर्ण";

if(days === 0)
return months + " महीने पूर्ण";

return months +
" महीने " +
days +
" दिन पूर्ण";

}


if(months === 0)
return totalDays + " दिवस पूर्ण";
