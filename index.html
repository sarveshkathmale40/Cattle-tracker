<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#15803d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cattle Tracker">

<link rel="manifest" href="manifest.json">
<title>The MH Farmer</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:linear-gradient(135deg,#f0fdf4 0%,#f8fafc 100%);
  min-height:100vh;
  padding:12px;
  color:#0f172a;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.wrap{
  width:100%;
  max-width:420px;
}

/* Lock Screen */
#lockScreen{
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:90vh;
}

.lock-card{
  background:white;
  border-radius:24px;
  padding:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  border:1px solid #e2e8f0;
  text-align:center;
}

.lock-title{
  font-size:22px;
  font-weight:900;
  color:#15803d;
  margin-bottom:6px;
}

.lock-sub{
  font-size:12px;
  color:#64748b;
  margin-bottom:20px;
  font-weight:600;
  line-height:1.4;
}

/* Header */
.app-header{
  background:linear-gradient(135deg,#15803d 0%,#16a34a 100%);
  border-radius:20px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 10px 25px -5px rgba(22,163,74,.3);
  text-align:center;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:white;
}

.header-title{
  font-size:20px;
  font-weight:900;
  letter-spacing:.5px;
  text-shadow:0 2px 4px rgba(0,0,0,.1);
}

.header-sub{
  font-size:11.5px;
  color:#bbf7d0;
  margin-top:3px;
  font-weight:700;
  letter-spacing:.5px;
}

/* Language */
#langSelect{
  background:rgba(255,255,255,.2);
  color:white;
  border:1px solid rgba(255,255,255,.4);
  border-radius:10px;
  padding:6px 10px;
  font-size:12px;
  font-weight:bold;
  outline:none;
  cursor:pointer;
}

#langSelect option{
  background:#15803d;
  color:white;
}

/* Notifications */
.notification-banner{
  background:linear-gradient(135deg,#fff7ed 0%,#ffedd5 100%);
  border:2px solid #fdba74;
  border-radius:18px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 6px 20px rgba(194,65,12,.15);
}

.notif-title{
  font-size:14px;
  font-weight:900;
  color:#c2410c;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:6px;
}

.notif-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.notif-item{
  background:white;
  border-radius:12px;
  padding:10px 12px;
  font-size:12px;
  color:#7c2d12;
  font-weight:600;
  border:1.5px solid #fed7aa;
  line-height:1.4;
  box-shadow:0 2px 6px rgba(0,0,0,.04);
  border-left:5px solid #ea580c;
}

/* Stats */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:14px;
}

.stat{
  background:white;
  padding:12px 8px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.04);
  border:1px solid #e2e8f0;
}

.stat-number{
  font-size:20px;
  font-weight:900;
  color:#15803d;
}

.stat-label{
  font-size:11px;
  color:#64748b;
  font-weight:600;
  margin-top:2px;
}

/* Cards */
.card{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 8px 25px rgba(0,0,0,.04);
  border:1px solid #e2e8f0;
}

.card h3{
  font-size:16px;
  margin-bottom:14px;
  color:#15803d;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:6px;
}

/* Inputs */
label{
  display:block;
  text-align:left;
  font-size:11px;
  font-weight:700;
  color:#475569;
  margin-bottom:6px;
  margin-left:2px;
}

input,select,textarea{
  width:100%;
  padding:13px 14px;
  border:2px solid #e2e8f0;
  border-radius:14px;
  font-size:15px;
  outline:none;
  background:#f8fafc;
  margin-bottom:12px;
  font-weight:600;
  font-family:inherit;
  transition:all .3s;
}

input:focus,select:focus,textarea:focus{
  border-color:#16a34a;
  background:white;
  box-shadow:0 0 0 4px rgba(22,163,74,.1);
}

/* Animal Buttons */
.animal-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:14px;
}

.animal-btn{
  border:2px solid #e2e8f0;
  background:#f8fafc;
  padding:12px 8px;
  border-radius:14px;
  cursor:pointer;
  font-weight:bold;
  color:#64748b;
  text-align:center;
  font-size:14px;
  transition:all .2s;
}

.animal-btn.active{
  border-color:#16a34a;
  background:#dcfce7;
  color:#15803d;
  box-shadow:0 4px 12px rgba(22,163,74,.15);
}

/* Button */
.btn{
  width:100%;
  background:linear-gradient(135deg,#15803d 0%,#16a34a 100%);
  color:white;
  border:none;
  padding:15px;
  border-radius:14px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  margin-top:6px;
  box-shadow:0 6px 20px rgba(22,163,74,.3);
  transition:transform .2s;
}

.btn:active{
  transform:scale(.98);
}

/* Photo */
.photo-preview{
  width:75px;
  height:75px;
  border-radius:14px;
  object-fit:cover;
  display:none;
  margin:8px auto 12px;
  border:2px solid #16a34a;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}

/* Records */
.item{
  background:#f8fafc;
  border-radius:16px;
  padding:14px;
  border:1px solid #e2e8f0;
  margin-bottom:12px;
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.cow-img{
  width:76px;
  height:76px;
  border-radius:14px;
  background:#e2e8f0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:34px;
  flex-shrink:0;
  overflow:hidden;
  border:2px solid #cbd5e1;
  box-shadow:0 4px 10px rgba(0,0,0,.06);
}

.cow-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.item-info{
  flex-grow:1;
  min-width:0;
}

.item-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  font-weight:bold;
  font-size:13px;
  border-bottom:1px solid #e2e8f0;
  padding-bottom:6px;
  margin-bottom:6px;
  color:#1e293b;
}

.duration-badge{
  background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);
  color:#1d4ed8;
  font-weight:900;
  font-size:12px;
  padding:4px 9px;
  border-radius:8px;
  border:1.5px solid #93c5fd;
  box-shadow:0 2px 6px rgba(29,78,216,.15);
  white-space:nowrap;
}

/* Rows */
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  font-size:11.5px;
  padding:6px 0;
  color:#334155;
  font-weight:600;
  border-bottom:1px dashed #e2e8f0;
}

.row span:first-child{
  flex:1;
  line-height:1.3;
}

/* Date Badge */
.date-badge{
  background:#fef08a;
  color:#78350f;
  padding:3px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:900;
  border:1.5px solid #fde047;
  text-align:right;
  width:95px;
  flex-shrink:0;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  letter-spacing:.3px;
}

/* Delivery */
.due{
  background:linear-gradient(135deg,#dcfce7 0%,#bbf7d0 100%);
  padding:8px 10px;
  border-radius:10px;
  color:#14532d;
  font-weight:900;
  margin-top:8px;
  font-size:12px;
  border:1.5px solid #86efac;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 6px rgba(22,163,74,.15);
}

.due span:first-child{
  flex:1;
}

.due-badge{
  background:#15803d;
  color:white;
  padding:3px 8px;
  border-radius:6px;
  font-size:11.5px;
  font-weight:900;
  text-align:right;
  width:95px;
  flex-shrink:0;
  border:1.5px solid #166534;
  box-shadow:0 1px 3px rgba(0,0,0,.1);
  letter-spacing:.3px;
}

.note-box{
  background:#fef3c7;
  border:1px solid #fde68a;
  border-radius:8px;
  padding:6px 8px;
  font-size:11.5px;
  color:#92400e;
  margin-top:6px;
  font-weight:500;
}

/* Action Buttons */
.action-btns{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.btn-repeat{
  flex:1;
  background:#eff6ff;
  color:#1d4ed8;
  border:1px solid #bfdbfe;
  padding:7px;
  border-radius:10px;
  font-weight:bold;
  font-size:11px;
  cursor:pointer;
}

.btn-del{
  flex:1;
  background:#ffeeef;
  color:#b91c1c;
  border:1px solid #fecaca;
  padding:7px;
  border-radius:10px;
  font-weight:bold;
  font-size:11px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#94a3b8;
  font-size:13px;
  padding:24px;
  font-weight:500;
}
</style>
</head>

<body>

<div class="wrap">

  <!-- LOCK SCREEN -->
  <div id="lockScreen" style="display:none;">

    <div class="lock-card">

      <div class="lock-title">
        🔐 The MH Farmer
      </div>

      <div class="lock-sub">
        ॲप वापरण्यासाठी तुमचा मोबाईल नंबर आणि पिन प्रविष्ट करा
      </div>

      <label>
        मोबाईल नंबर (१० अंकी)
      </label>

      <input
        type="tel"
        id="loginMob"
        placeholder=""
        maxlength="10"
        inputmode="numeric"
        autocomplete="tel"
      >

      <label>
        सिक्रेट पिन (PIN)
      </label>

      <input
        type="password"
        id="loginPin"
        placeholder=""
        maxlength="4"
        inputmode="numeric"
        autocomplete="off"
      >

      <button
        class="btn"
        type="button"
        onclick="verifyLogin()"
      >
        ॲप सुरू करा 🚀
      </button>

    </div>

  </div>


  <!-- MAIN APP -->
  <div id="appScreen" style="display:none;">

    <!-- Header -->
    <div class="app-header">

      <div style="text-align:left;">

        <div
          class="header-title"
          id="mainHeaderTitle"
        >
          The MH Farmer
        </div>

        <div
          class="header-sub"
          id="mainHeaderSub"
        >
          Cattle Pregnancy Tracker
        </div>

      </div>

      <div>

        <select
          id="langSelect"
          onchange="changeLanguage()"
        >
          <option value="mr">मराठी</option>
          <option value="hi">हिंदी</option>
          <option value="en">English</option>
        </select>

      </div>

    </div>


    <!-- Notifications -->
    <div
      id="notifBannerBox"
      class="notification-banner"
      style="display:none;"
    >

      <div
        class="notif-title"
        id="notifTitleText"
      >
        🔔 महत्त्वाचे अलर्ट्स
      </div>

      <div
        id="notifListContainer"
        class="notif-list"
      ></div>

    </div>


    <!-- Stats -->
    <div class="stats">

      <div class="stat">

        <div
          class="stat-number"
          id="totalCount"
        >
          0
        </div>

        <div
          class="stat-label"
          id="lblTotal"
        >
          एकूण नोंदी
        </div>

      </div>


      <div class="stat">

        <div
          class="stat-number"
          id="cowCount"
        >
          0
        </div>

        <div
          class="stat-label"
          id="lblCow"
        >
          गाय
        </div>

      </div>


      <div class="stat">

        <div
          class="stat-number"
          id="buffaloCount"
        >
          0
        </div>

        <div
          class="stat-label"
          id="lblBuf"
        >
          म्हैस
        </div>

      </div>

    </div>


    <!-- Form -->
    <div class="card">

      <h3 id="formTitle">
        ➕ नवीन पशु नोंद
      </h3>


      <div class="animal-buttons">

        <button
          class="animal-btn active"
          id="cowBtn"
          type="button"
          onclick="selectAnimal('cow')"
        >
          🐄
          <span id="btnCowTxt">
            गाय
          </span>
        </button>


        <button
          class="animal-btn"
          id="buffaloBtn"
          type="button"
          onclick="selectAnimal('buffalo')"
        >
          🐃
          <span id="btnBufTxt">
            म्हैस
          </span>
        </button>

      </div>


      <label id="lblNameLbl">
        पशुचे नाव / ओळख
      </label>

      <input
        type="text"
        id="cName"
        placeholder="उदा. कावेरी"
      >


      <label id="lblDate">
        गाय गाभण राहिल्याची तारीख
      </label>

      <input
        type="date"
        id="cDate"
      >


      <label id="lblNoteLbl">
        डॉक्टर / सिमेन तपशील
      </label>

      <textarea
        id="cNote"
        placeholder="उदा. डॉक्टरचे नाव, सिमेन ब्रँड"
      ></textarea>


      <label id="lblPhotoLbl">
        पशुचा फोटो (पर्यायी)
      </label>

      <input
        type="file"
        id="cPhoto"
        accept="image/*"
        onchange="previewPhoto()"
      >


      <img
        id="photoPreview"
        class="photo-preview"
        alt="Preview"
      >


      <button
        class="btn"
        id="btnSave"
        type="button"
        onclick="saveData()"
      >
        💾 नोंद जतन करा
      </button>

    </div>


    <!-- Records -->
    <div class="card">

      <h3 id="listTitle">
        📋 माझ्या पशुंच्या नोंदी
      </h3>

      <div id="list"></div>

    </div>

  </div>

</div>

/* =====================================================
   LOGIN / PIN
   PIN = first 2 digits + last digit + last digit
   Example: 9876543210 -> 9800
   ===================================================== */

function verifyLogin(){

  const mob=
    document
      .getElementById('loginMob')
      .value
      .trim();

  const pin=
    document
      .getElementById('loginPin')
      .value
      .trim();


  /* Mobile must be exactly 10 digits */
  if(!/^\d{10}$/.test(mob)){

    alert(
      'कृपया बरोबर १० अंकी मोबाईल नंबर टाका!'
    );

    return;

  }


  /* PIN must be exactly 4 digits */
  if(!/^\d{4}$/.test(pin)){

    alert(
      'कृपया ४ अंकी PIN टाका!'
    );

    return;

  }


  /* Create expected PIN */
  const first2=
    mob.substring(0,2);

  const lastChar=
    mob.substring(mob.length-1);

  const expectedPin=
    first2+
    lastChar+
    lastChar;


  /* Verify */
  if(pin===expectedPin){

    try{

      localStorage.setItem(
        'cattle_unlocked',
        'true'
      );

      localStorage.setItem(
        'cattle_user_mob',
        mob
      );

    }catch(error){

      console.log(
        'Login storage failed:',
        error
      );

    }


    document
      .getElementById('lockScreen')
      .style.display='none';

    document
      .getElementById('appScreen')
      .style.display='block';


    /* Set today's maximum date */
    setTodayMaxDate();

    draw();


  }else{

    alert(
      'चुकीचा PIN! कृपया तुमचा योग्य PIN तपासून टाका.'
    );

  }

}

/* Compress Photo */
function compressImage(file,callback){

  if(
    !file ||
    !file.type ||
    file.type.indexOf('image/')!==0
  ){

    callback('');

    return;

  }


  const reader=
    new FileReader();


  reader.onload=
    function(e){

      const img=
        new Image();


      img.onload=
        function(){

          const canvas=
            document.createElement(
              'canvas'
            );


          const maxWidth=400;
          const maxHeight=400;


          let width=
            img.width;

          let height=
            img.height;


          if(width>maxWidth){

            height=
              height*
              (maxWidth/width);

            width=
              maxWidth;

          }


          if(height>maxHeight){

            width=
              width*
              (maxHeight/height);

            height=
              maxHeight;

          }


          canvas.width=
            Math.max(
              1,
              Math.round(width)
            );


          canvas.height=
            Math.max(
              1,
              Math.round(height)
            );


          const ctx=
            canvas.getContext('2d');


          if(!ctx){

            callback('');

            return;

          }


          ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
          );


          callback(
            canvas.toDataURL(
              'image/jpeg',
              0.7
            )
          );

        };


      img.onerror=
        function(){

          callback('');

        };


      img.src=
        e.target.result;

    };


  reader.onerror=
    function(){

      callback('');

    };


  reader.readAsDataURL(file);

}

}


/* Safe ISO Date Parser */
function parseISODate(str){

  if(
    typeof str!=='string' ||
    !/^\d{4}-\d{2}-\d{2}$/.test(str)
  ){

    return null;

  }


  const parts=
    str
      .split('-')
      .map(Number);


  const year=
    parts[0];

  const month=
    parts[1];

  const day=
    parts[2];


  const d=
    new Date(
      year,
      month-1,
      day
    );


  if(
    d.getFullYear()!==year ||
    d.getMonth()!==month-1 ||
    d.getDate()!==day
  ){

    return null;

  }


  d.setHours(
    0,0,0,0
  );


  return d;

}


/* Today */
function getTodayDate(){

  const d=
    new Date();

  d.setHours(
    0,0,0,0
  );

  return d;

}


/* Day Difference */
function getDayDifference(
  startDate,
  endDate
){

  const msPerDay=
    86400000;


  return Math.round(
    (endDate-startDate)/
    msPerDay
  );

}


/* Format Date */
function formatDate(date){

  const day=
    String(
      date.getDate()
    ).padStart(2,'0');


  const month=
    String(
      date.getMonth()+1
    ).padStart(2,'0');


  return(
    day+
    '-' +
    month+
    '-' +
    date.getFullYear()
  );

}


/* Add Days */
function addD(str,days){

  const d=
    parseISODate(str);


  if(!d){

    return '---';

  }


  d.setDate(
    d.getDate()+
    Number(days||0)
  );


  return formatDate(d);

}


/* Pregnancy Duration */
function getFormattedDuration(
  str,
  lang
){

  const start=
    parseISODate(str);


  if(!start){

    return lang==='en'
      ? '0 days'
      : (
        lang==='hi'
          ? '0 दिन'
          : '० दिवस'
      );

  }


  const now=
    getTodayDate();


  if(now<start){

    return lang==='en'
      ? '0 days'
      : (
        lang==='hi'
          ? '0 दिन'
          : '० दिवस'
      );

  }


  const years=
    now.getFullYear()-
    start.getFullYear();


  let months=
    now.getMonth()-
    start.getMonth()+
    (years*12);


  let days=
    now.getDate()-
    start.getDate();


  if(days<0){

    months--;


    const prevMonth=
      new Date(
        now.getFullYear(),
        now.getMonth(),
        0
      );


    days+=
      prevMonth.getDate();

  }


  if(months<0){

    months=0;
    days=0;

  }


  if(lang==='en'){

    const res=[];


    if(months>0){

      res.push(
        months+
        ' '+
        (
          months===1
            ? 'month'
            : 'months'
        )
      );

    }


    if(
      days>0 ||
      res.length===0
    ){

      res.push(
        days+
        ' '+
        (
          days===1
            ? 'day'
            : 'days'
        )
      );

    }


    return res.join(' ');

  }


  if(lang==='hi'){

    const res=[];


    if(months>0){

      res.push(
        months+
        ' '+
        (
          months===1
            ? 'महीना'
            : 'महीने'
        )
      );

    }


    if(
      days>0 ||
      res.length===0
    ){

      res.push(
        days+
        ' दिन'
      );

    }


    return res.join(' ');

  }


  const res=[];


  if(months>0){

    res.push(
      months+
      ' '+
      (
        months===1
          ? 'महिना'
          : 'महिने'
      )
    );

  }


  if(
    days>0 ||
    res.length===0
  ){

    res.push(
      days+
      ' दिवस'
    );

  }


  return res.join(' ');

}


/* HTML Safety */
function escapeHtml(value){

  return String(
    value==null
      ? ''
      : value
  ).replace(
    /[&<>'"]/g,
    function(ch){

      return {

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        "'":'&#39;',
        '"':'&quot;'

      }[ch];

    }
  );

}

/* =====================================================
   SMART NOTIFICATIONS
   ===================================================== */

function checkSmartNotifications(){

  const banner=
    document.getElementById(
      'notifBannerBox'
    );


  const title=
    document.getElementById(
      'notifTitleText'
    );


  const list=
    document.getElementById(
      'notifListContainer'
    );


  if(
    !banner ||
    !title ||
    !list
  ){

    return;

  }


  const selectedLang=
    document.getElementById(
      'langSelect'
    ).value;


  const lang=
    langData[selectedLang]
      ? selectedLang
      : 'mr';


  const t=
    langData[lang];


  title.innerText=
    t.notifTitle;


  const db=
    getDB();


  const today=
    getTodayDate();


  const alerts=[];


  for(
    let i=0;
    i<db.length;
    i++
  ){

    const it=
      db[i];


    const start=
      parseISODate(it.date);


    if(
      !start ||
      start>today
    ){

      continue;

    }


    const pregnancyDay=
      getDayDifference(
        start,
        today
      );


    const totalDays=
      it.type==='buffalo'
        ? 310
        : 282;


    const dryDays=
      it.type==='buffalo'
        ? 235
        : 210;


    /* Delivery Date */
    const deliveryDate=
      new Date(
        start.getTime()
      );


    deliveryDate.setDate(
      deliveryDate.getDate()+
      totalDays
    );


    /* Dry Date */
    const dryDate=
      new Date(
        start.getTime()
      );


    dryDate.setDate(
      dryDate.getDate()+
      dryDays
    );


    const animalName=
      escapeHtml(
        it.name ||
        (
          it.type==='buffalo'
            ? t.bBuf
            : t.bCow
        )
      );


    const animalIcon=
      it.type==='buffalo'
        ? '🐃'
        : '🐄';


    /* 1. HEAT — ONLY DAY 19, 20, 21 */
    if(
      pregnancyDay===19 ||
      pregnancyDay===20 ||
      pregnancyDay===21
    ){

      alerts.push({

        priority:1,

        text:
          t.heatNotif.replace(
            '{day}',
            String(pregnancyDay)
          ),

        name:
          animalIcon+
          ' '+
          animalName,

        date:
          today.getTime()

      });

    }


    /* 2. DRY-OFF */
    const dryDiff=
      getDayDifference(
        today,
        dryDate
      );


    if(
      dryDiff>=0 &&
      dryDiff<=3
    ){

      alerts.push({

        priority:2,

        text:
          t.dryNotif.replace(
            '{days}',
            String(dryDiff)
          ),

        name:
          animalIcon+
          ' '+
          animalName,

        date:
          dryDate.getTime()

      });

    }


    /* 3. DELIVERY */
    const deliveryDiff=
      getDayDifference(
        today,
        deliveryDate
      );


    if(
      deliveryDiff>=0 &&
      deliveryDiff<=3
    ){

      alerts.push({

        priority:3,

        text:
          t.deliveryNotif.replace(
            '{days}',
            String(deliveryDiff)
          ),

        name:
          animalIcon+
          ' '+
          animalName,

        date:
          deliveryDate.getTime()

      });

    }

  }


  /* No Alerts */
  if(alerts.length===0){

    banner.style.display=
      'none';

    list.innerHTML=
      '';

    return;

  }


  /* Sort */
  alerts.sort(
    function(a,b){

      return(
        a.priority-b.priority ||
        a.date-b.date
      );

    }
  );


  let html='';


  for(
    let i=0;
    i<alerts.length;
    i++
  ){

    html+=
      '<div class="notif-item">'+

      '<div style="font-size:13.5px; font-weight:900; color:#991b1b; margin-bottom:3px;">'+
      alerts[i].name+
      '</div>'+

      '<div style="color:#c2410c; font-weight:700;">'+
      alerts[i].text+
      '</div>'+

      '</div>';

  }


  list.innerHTML=
    html;


  banner.style.display=
    'block';

}


/* Save */
function saveData(){

  const dt=
    document.getElementById(
      'cDate'
    ).value;


  const selectedLang=
    document.getElementById(
      'langSelect'
    ).value;


  const lang=
    langData[selectedLang]
      ? selectedLang
      : 'mr';


  const t=
    langData[lang];


  const inputDate=
    parseISODate(dt);


  if(!inputDate){

    alert(
      t.dateRequired
    );

    return;

  }


  if(
    inputDate>
    getTodayDate()
  ){

    alert(
      t.futureDateError
    );

    return;

  }


  const nm=
    document.getElementById(
      'cName'
    ).value.trim() ||
    (
      cur==='cow'
        ? t.bCow
        : t.bBuf
    );


  const nt=
    document.getElementById(
      'cNote'
    ).value.trim();


  const previewImg=
    document.getElementById(
      'photoPreview'
    );


  const photoData=
    previewImg.style.display==='block'
      ? previewImg.src
      : '';


  pushToDB(
    nm,
    cur,
    dt,
    nt,
    photoData
  );

}


/* Save to LocalStorage */
function pushToDB(
  nm,
  type,
  dt,
  nt,
  photo
){

  const selectedLang=
    document.getElementById(
      'langSelect'
    ).value;


  const lang=
    langData[selectedLang]
      ? selectedLang
      : 'mr';


  const t=
    langData[lang];


  const db=
    getDB();


  db.unshift({

    id:
      Date.now(),

    name:
      nm,

    type:
      type,

    date:
      dt,

    note:
      nt,

    photo:
      photo||''

  });


  try{

    localStorage.setItem(
      'cattle_tracker_db',
      JSON.stringify(db)
    );

  }catch(error){

    alert(
      t.storageError
    );

    return;

  }


  document.getElementById(
    'cName'
  ).value='';


  document.getElementById(
    'cNote'
  ).value='';


  document.getElementById(
    'cPhoto'
  ).value='';


  document.getElementById(
    'photoPreview'
  ).style.display=
    'none';


  document.getElementById(
    'photoPreview'
  ).removeAttribute(
    'src'
  );


  draw();

}


/* Delete */
function delData(id){

  const selectedLang=
    document.getElementById(
      'langSelect'
    ).value;


  const lang=
    langData[selectedLang]
      ? selectedLang
      : 'mr';


  const t=
    langData[lang];


  if(!confirm(t.confirmDel)){

    return;

  }


  try{

    const db=
      getDB().filter(
        function(item){

          return(
            Number(item.id)!==
            Number(id)
          );

        }
      );


    localStorage.setItem(
      'cattle_tracker_db',
      JSON.stringify(db)
    );


    draw();


  }catch(error){

    alert(
      t.storageError
    );

  }

}


/* Update Pregnancy Date */
function updateDate(id){

  const selectedLang=
    document.getElementById(
      'langSelect'
    ).value;


  const lang=
    langData[selectedLang]
      ? selectedLang
      : 'mr';


  const t=
    langData[lang];


  const now=
    new Date();


  const defaultDate=
    now.getFullYear()+
    '-' +
    String(
      now.getMonth()+1
    ).padStart(2,'0')+
    '-' +
    String(
      now.getDate()
    ).padStart(2,'0');


  const newDt=
    prompt(
      t.promptNewDate,
      defaultDate
    );


  if(!newDt){

    return;

  }


  const cleanDate=
    newDt.trim();


  const inputDate=
    parseISODate(
      cleanDate
    );


  if(!inputDate){

    if(lang==='en'){

      alert(
        'Please enter a valid date in YYYY-MM-DD format.'
      );

    }else if(lang==='hi'){

      alert(
        'कृपया YYYY-MM-DD प्रारूप में सही तारीख दर्ज करें।'
      );

    }else{

      alert(
        'कृपया YYYY-MM-DD किंवा योग्य तारीख प्रविष्ट करा.'
      );

    }

    return;

  }


  if(
    inputDate>
    getTodayDate()
  ){

    alert(
      t.futureDateError
    );

    return;

  }


  try{

    const db=
      getDB();


    let found=
      false;


    for(
      let i=0;
      i<db.length;
      i++
    ){

      if(
        Number(db[i].id)===
        Number(id)
      ){

        db[i].date=
          cleanDate;

        found=
          true;

        break;

      }

    }


    if(!found){

      return;

    }


    localStorage.setItem(
      'cattle_tracker_db',
      JSON.stringify(db)
    );


    draw();


  }catch(error){

    alert(
      t.storageError
    );

  }

}


/* App Initialization */
function initApp(){

  let isUnlocked=
    false;


  try{

    isUnlocked=
      localStorage.getItem(
        'cattle_unlocked'
      )==='true';

  }catch(error){

    isUnlocked=
      false;

  }


  /* Locked */
  if(!isUnlocked){

    document.getElementById(
      'lockScreen'
    ).style.display=
      'flex';


    document.getElementById(
      'appScreen'
    ).style.display=
      'none';


    return;

  }


  /* Already unlocked */
  document.getElementById(
    'lockScreen'
  ).style.display=
    'none';


  document.getElementById(
    'appScreen'
  ).style.display=
    'block';


  /* Saved Language */
  let savedLang=
    'mr';


  try{

    savedLang=
      localStorage.getItem(
        'cattle_lang'
      ) || 'mr';

  }catch(error){}


  if(!langData[savedLang]){

    savedLang=
      'mr';

  }


  document.getElementById(
    'langSelect'
  ).value=
    savedLang;


  /* Today's maximum date */
  setTodayMaxDate();


  /* Apply language + draw */
  changeLanguage();

}


/* Start App */
if(
  document.readyState===
  'loading'
){

  document.addEventListener(
    'DOMContentLoaded',
    initApp
  );

}else{

  initApp();

}
</script>
