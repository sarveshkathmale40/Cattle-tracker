<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#047857">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The MH Farmer">

<link rel="manifest" href="manifest.json">
<title>The MH Farmer - Smart Dairy Suite</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:radial-gradient(circle at top,#f0fdf4 0%,#dcfce7 40%,#cbd5e1 100%);min-height:100vh;padding:12px 10px 40px;color:#0f172a;display:flex;justify-content:center;align-items:flex-start;}
.wrap{width:100%;max-width:430px;margin:0 auto;}

/* Lock Screen */
#lockScreen{display:flex;flex-direction:column;justify-content:center;min-height:90vh;}
.lock-card{background:rgba(255,255,255,0.96);border-radius:30px;padding:30px 22px;box-shadow:0 25px 50px -10px rgba(4,120,87,0.25), 0 0 0 2px rgba(52,211,153,0.3);text-align:center;}
.lock-logo-badge{width:68px;height:68px;margin:0 auto 14px;background:linear-gradient(135deg, #10b981 0%, #047857 100%);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 12px 24px -6px rgba(16,185,129,0.5);border:2px solid #ffffff;}
.lock-title{font-size:24px;font-weight:900;color:#064e3b;letter-spacing:-0.4px;margin-bottom:6px;}
.lock-sub{font-size:12.5px;color:#475569;margin-bottom:24px;font-weight:700;line-height:1.5;}

/* Header Card */
.app-header{background:linear-gradient(135deg,#022c22 0%,#064e3b 45%,#047857 100%);border-radius:26px;padding:18px 16px;margin-bottom:14px;box-shadow:0 18px 36px -8px rgba(4,120,87,.55),inset 0 2px 6px rgba(255,255,255,.35);display:flex;justify-content:space-between;align-items:center;color:white;border:2px solid #34d399;position:relative;overflow:hidden;}
.brand-box{display:flex;align-items:center;gap:10px;text-align:left;}
.brand-icon{font-size:30px;}
.header-title{font-size:20px;font-weight:900;letter-spacing:-0.3px;color:#ffffff;text-shadow:0 2px 4px rgba(0,0,0,0.3);}
.header-sub{font-size:9.5px;color:#a7f3d0;margin-top:2px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;background:rgba(255,255,255,0.15);padding:2px 8px;border-radius:20px;display:inline-block;border:1px solid rgba(255,255,255,0.25);}

/* Language Selector */
#langSelect{background:#022c22;color:#ffffff;border:2px solid #34d399;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:900;outline:none;cursor:pointer;box-shadow:0 6px 15px rgba(0,0,0,0.25);}
#langSelect option{background:#064e3b;color:white;font-weight:bold;}

/* Install Button */
.install-bar{display:none;background:linear-gradient(135deg,#059669 0%,#10b981 100%);color:white;padding:12px 16px;border-radius:16px;margin-bottom:14px;text-align:center;box-shadow:0 8px 20px rgba(16,185,129,.35);font-size:13.5px;font-weight:800;border:none;width:100%;cursor:pointer;justify-content:center;align-items:center;gap:8px;}

/* Notification Banner */
.notification-banner{background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%);border:2px solid #f59e0b;border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 10px 25px rgba(217,119,6,.18);}
.notif-title{font-size:13.5px;font-weight:900;color:#b45309;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.notif-list{display:flex;flex-direction:column;gap:8px;}
.notif-item{background:white;border-radius:12px;padding:10px 12px;font-size:12px;color:#78350f;font-weight:700;border:1.5px solid #fde68a;line-height:1.45;border-left:5px solid #d97706;}

/* Stats Cards */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.stat{background:linear-gradient(135deg,#ffffff 0%,#f8fafc 100%);padding:12px 6px;border-radius:18px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.06),inset 0 2px 4px rgba(255,255,255,.9);border:2px solid #e2e8f0;}
.stat-number{font-size:21px;font-weight:900;color:#047857;}
.stat-label{font-size:10.5px;color:#475569;font-weight:800;margin-top:2px;text-transform:uppercase;}

/* Form Card */
.card{background:rgba(255,255,255,0.98);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.06);border:2px solid #e2e8f0;}
.card h3{font-size:15px;margin-bottom:12px;color:#047857;font-weight:900;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.4px;}

label{display:block;text-align:left;font-size:11px;font-weight:800;color:#334155;margin-bottom:5px;margin-left:3px;}
input,select,textarea{width:100%;padding:11px 14px;border:2px solid #cbd5e1;border-radius:14px;font-size:14px;outline:none;background:#f8fafc;margin-bottom:10px;font-weight:700;font-family:inherit;transition:all .2s;}
input:focus,select:focus,textarea:focus{border-color:#059669;background:white;box-shadow:0 0 0 4px rgba(5,150,105,.18);}

.split-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}

.animal-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
.animal-btn{border:2px solid #cbd5e1;background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%);padding:12px 8px;border-radius:14px;cursor:pointer;font-weight:900;color:#475569;text-align:center;font-size:14px;box-shadow:0 6px 15px rgba(0,0,0,.05),inset 0 1px 3px rgba(255,255,255,.9);transition:all .15s;}
.animal-btn.active{border-color:#059669;background:linear-gradient(135deg,#d1fae5 0%,#a7f3d0 100%);color:#064e3b;box-shadow:0 8px 20px rgba(5,150,105,.3),inset 0 2px 5px rgba(255,255,255,.7);}

.btn{width:100%;background:linear-gradient(135deg,#059669 0%,#047857 50%,#064e3b 100%);color:white;border:2px solid #065f46;padding:14px;border-radius:14px;font-weight:900;font-size:15px;cursor:pointer;margin-top:6px;box-shadow:0 8px 22px rgba(5,150,105,.4),inset 0 2px 5px rgba(255,255,255,.35);letter-spacing:.4px;transition:all .15s ease;}
.btn:active{transform:scale(.97);box-shadow:0 3px 8px rgba(5,150,105,.3);}

.photo-preview{width:70px;height:70px;border-radius:16px;object-fit:cover;display:none;margin:6px auto 10px;box-shadow:0 6px 15px rgba(0,0,0,.1);cursor:pointer;border:2px solid #059669;}

/* Records Item */
.item{background:linear-gradient(135deg,#ffffff 0%,#f8fafc 100%);border-radius:20px;padding:14px;border:2px solid #e2e8f0;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 6px 20px rgba(0,0,0,.04);}
.cow-img{width:76px;height:76px;border-radius:16px;background:#e2e8f0;display:flex;justify-content:center;align-items:center;font-size:34px;flex-shrink:0;overflow:hidden;box-shadow:0 6px 15px rgba(0,0,0,.08);cursor:pointer;border:2px solid #cbd5e1;}
.cow-img img{width:100%;height:100%;object-fit:cover;}
.item-info{flex-grow:1;min-width:0;}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:900;font-size:13px;border-bottom:2px solid #f1f5f9;padding-bottom:6px;margin-bottom:6px;color:#1e293b;}
.duration-badge{background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);color:#1d4ed8;font-weight:900;font-size:11px;padding:4px 8px;border-radius:10px;border:1.5px solid #93c5fd;white-space:nowrap;}

.row{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;padding:6px 0;color:#334155;font-weight:700;border-bottom:1px dashed #cbd5e1;}
.row span:first-child{flex:1;line-height:1.35;}
.date-badge{background:linear-gradient(135deg,#fefce8 0%,#fef9c3 100%);color:#854d0e;padding:3px 8px;border-radius:7px;font-size:11px;font-weight:900;border:1.5px solid #fef08a;text-align:right;width:95px;flex-shrink:0;}

.due{background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 100%);padding:7px 10px;border-radius:12px;color:#14532d;font-weight:900;margin-top:8px;font-size:12px;border:1.5px solid #86efac;display:flex;justify-content:space-between;align-items:center;}
.due span:first-child{flex:1;}
.due-badge{background:#16a34a;color:white;padding:3px 8px;border-radius:7px;font-size:11.5px;font-weight:900;text-align:right;width:95px;flex-shrink:0;}

.note-box{background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%);border:1.5px solid #fcd34d;border-radius:10px;padding:8px 10px;font-size:11.5px;color:#78350f;margin-top:6px;font-weight:700;display:flex;flex-direction:column;gap:3px;}
.small-assumption-note{font-size:11px;color:#475569;font-weight:700;margin-top:8px;line-height:1.45;background:#f8fafc;padding:8px 10px;border-radius:12px;border:1.5px solid #cbd5e1;}

/* Compact Buttons Grid */
.action-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:10px;align-items:center;}
.action-grid-calved{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:10px;align-items:center;}

.btn-action{padding:9px 4px;border-radius:11px;font-weight:900;font-size:11px;cursor:pointer;text-align:center;white-space:nowrap;border:none;display:flex;justify-content:center;align-items:center;gap:3px;}
.btn-repeat{background:linear-gradient(135deg,#d1fae5 0%,#a7f3d0 100%);color:#064e3b;border:1px solid #10b981;box-shadow:0 3px 0 #059669;}
.btn-calved{background:linear-gradient(135deg,#bae6fd 0%,#7dd3fc 100%);color:#0c4a6e;border:1px solid #0284c7;box-shadow:0 3px 0 #0284c7;}
.btn-del{background:linear-gradient(135deg,#fee2e2 0%,#fecdd3 100%);color:#991b1b;border:1px solid #fb7185;padding:9px 10px;box-shadow:0 3px 0 #e11d48;}

.empty{text-align:center;color:#64748b;font-size:13px;padding:24px;font-weight:800;}

/* Modals */
.date-modal{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.65);z-index:99999;justify-content:center;align-items:center;padding:16px;}
.date-modal-card{background:white;padding:22px;border-radius:24px;width:100%;max-width:330px;box-shadow:0 20px 40px rgba(0,0,0,0.3);text-align:center;border:2px solid #047857;}
.date-modal-card h4{font-size:15px;color:#047857;margin-bottom:14px;font-weight:900;}

/* Zoom */
#imageZoomModal{display:none;position:fixed;z-index:99999;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.94);justify-content:center;align-items:center;flex-direction:column;padding:16px;}
#zoomedImage{max-width:96%;max-height:82%;object-fit:contain;border-radius:16px;}
.modal-close-btn{position:absolute;top:22px;right:22px;color:white;font-size:34px;font-weight:bold;background:rgba(255,255,255,0.22);width:46px;height:46px;border-radius:50%;display:flex;justify-content:center;align-items:center;cursor:pointer;}
</style>
</head>

<body>

<div class="wrap">

          <div class="header-title">The MH Farmer</div>

    <div class="stats">

      <label id="lblPhotoLbl">पशुचा फोटो (पर्यायी)</label>

<!-- Modal For Dates -->
<div id="customDateModal" class="date-modal">

    <label style="text-align:left; font-size:11.5px; font-weight:800; color:#334155; margin-bottom:4px;" id="modalDateLbl">तारीख निवडा</label>
    <input type="date" id="modalDateInput" style="margin-bottom:12px;">

    <div id="modalDoctorSemenContainer" style="display:none;">
      <label style="text-align:left; font-size:11.5px; font-weight:800; color:#334155; margin-bottom:4px;" id="lblDocName">डॉक्टरचे नाव</label>

      <label style="text-align:left; font-size:11.5px; font-weight:800; color:#334155; margin-bottom:4px;" id="lblSemenName">सिमेन ब्रँड / नाव</label>

<!-- Zoom Modal -->
<div id="imageZoomModal" onclick="closeImageModal()">
  <div class="modal-close-btn" onclick="closeImageModal()">&times;</div>
  <img id="zoomedImage" src="" alt="Zoomed Photo" onclick="event.stopPropagation()">
</div>

<script>
'use strict';

/* FAST IN-MEMORY STATE */
let memoryRecords = [];

/* --- 1. PERSISTENT STORAGE LOCK & SERVICE WORKER --- */
async function requestPersistentStorage() {
  if (navigator.storage && navigator.storage.persist) {
    try {
      await navigator.storage.persist();
    } catch (e) {}
  }
}
requestPersistentStorage();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration error:', err));
  });
}

/* --- 2. INDEXEDDB ENGINE --- */
const DB_NAME = 'MHFarmerDB';
const DB_VERSION = 1;
let dbInstance = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (dbInstance) return resolve(dbInstance);
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings');
      if (!db.objectStoreNames.contains('records')) db.createObjectStore('records', { keyPath: 'id' });
    };
    req.onsuccess = (e) => {
      dbInstance = e.target.result;
      resolve(dbInstance);
    };
    req.onerror = (e) => reject(e);
  });
}

async function getSetting(key) {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction('settings', 'readonly');
    const req = tx.objectStore('settings').get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}

async function setSetting(key, val) {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction('settings', 'readwrite');
    tx.objectStore('settings').put(val, key);
    tx.oncomplete = () => resolve(true);
  });
}

async function loadAllRecordsFromDB() {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction('records', 'readonly');
    const req = tx.objectStore('records').getAll();
    req.onsuccess = () => {
      memoryRecords = req.result || [];
      resolve(memoryRecords);
    };
    req.onerror = () => {
      memoryRecords = [];
      resolve([]);
    };
  });
}

async function saveRecordToDB(record) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('records', 'readwrite');
    tx.objectStore('records').put(record);
    tx.oncomplete = () => {
      const idx = memoryRecords.findIndex(r => r.id === record.id);
      if (idx >= 0) memoryRecords[idx] = record;
      else memoryRecords.push(record);
      resolve(true);
    };
    tx.onerror = (e) => reject(e);
  });
}

async function deleteRecordFromDB(id) {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction('records', 'readwrite');
    tx.objectStore('records').delete(Number(id));
    tx.oncomplete = () => {
      memoryRecords = memoryRecords.filter(r => Number(r.id) !== Number(id));
      resolve(true);
    };
  });
}

/* --- 3. APP LOGIC --- */
let deferredPrompt = null;
const pwaBtn = document.getElementById('pwaInstallBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (pwaBtn && !window.matchMedia('(display-mode: standalone)').matches) {
    pwaBtn.style.display = 'flex';
  }
});

function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      if (pwaBtn) pwaBtn.style.display = 'none';
    });
  }
}

function openImageModal(src) {
  if (!src) return;
  document.getElementById('zoomedImage').src = src;
  document.getElementById('imageZoomModal').style.display = 'flex';
}

function closeImageModal() {
  document.getElementById('imageZoomModal').style.display = 'none';
}

let cur = 'cow';
let activeActionId = null;
let activeActionType = null;

function selectAnimal(type) {
  cur = type === 'buffalo' ? 'buffalo' : 'cow';
  document.getElementById('cowBtn').classList.toggle('active', cur === 'cow');
  document.getElementById('buffaloBtn').classList.toggle('active', cur === 'buffalo');

  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  document.getElementById('lblDate').innerText = cur === 'buffalo' ? t.dtLblBuf : t.dtLblCow;
}

function openDateModal(type, id) {
  activeActionType = type;
  activeActionId = id;
  const modal = document.getElementById('customDateModal');
  const input = document.getElementById('modalDateInput');
  const title = document.getElementById('modalTitleText');
  const docSemenContainer = document.getElementById('modalDoctorSemenContainer');
  
  const now = new Date();
  input.value = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  input.max = input.value;

  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  let animalType = t.cow;
  for (let i = 0; i < memoryRecords.length; i++) {
    if (Number(memoryRecords[i].id) === Number(id)) {
      animalType = (memoryRecords[i].type === 'buffalo') ? t.buf : t.cow;
      break;
    }
  }

  if (type === 'repeat' || type === 'newPregnancy') {
    docSemenContainer.style.display = 'block';
    document.getElementById('modalDoctorInput').value = '';
    document.getElementById('modalSemenInput').value = '';

async function submitModalDate() {
  const val = document.getElementById('modalDateInput').value;
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  
  if (!val) { alert(t.dateRequired); return; }
  const parsed = parseISODate(val);
  if (!parsed || parsed > getTodayDate()) { alert(t.futureDateError); return; }

  const docName = document.getElementById('modalDoctorInput').value.trim();
  const semenName = document.getElementById('modalSemenInput').value.trim();

  for (let i = 0; i < memoryRecords.length; i++) {
    if (Number(memoryRecords[i].id) === Number(activeActionId)) {
      if (activeActionType === 'repeat' || activeActionType === 'newPregnancy') {
        memoryRecords[i].date = val;
        memoryRecords[i].isCalved = false;
        memoryRecords[i].isAssumedCalved = false;
        memoryRecords[i].calvedDate = '';
        if (docName) memoryRecords[i].doctor = docName;
        if (semenName) memoryRecords[i].semen = semenName;
      } else if (activeActionType === 'calved' || activeActionType === 'changeCalve') {
        memoryRecords[i].isCalved = true;
        memoryRecords[i].isAssumedCalved = false;
        memoryRecords[i].calvedDate = val;
      }
      await saveRecordToDB(memoryRecords[i]);
      break;
    }
  }

  closeDateModal();
  draw();
}

function compressImage(file, callback) {
  if (!file || !file.type || file.type.indexOf('image/')!==0) { callback(''); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > 500) { h = h * (500 / w); w = 500; }
      if (h > 500) { w = w * (500 / h); h = 500; }
      canvas.width = Math.round(w); canvas.height = Math.round(h);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => callback('');
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function previewPhoto() {
  const input = document.getElementById('cPhoto');

    });
  }
}

function parseISODate(str) {
  if (typeof str!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(str)) return null;
  const p = str.split('-').map(Number);
  const d = new Date(p[0], p[1]-1, p[2]);
  if (d.getFullYear()!==p[0] || d.getMonth()!==p[1]-1 || d.getDate()!==p[2]) return null;
  d.setHours(0,0,0,0);
  return d;
}

function getTodayDate() {
  const d = new Date(); d.setHours(0,0,0,0); return d;
}

function getDayDifference(start, end) {
  return Math.round((end - start)/86400000);
}

function formatDate(d) {
  return String(d.getDate()).padStart(2,'0') + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + d.getFullYear();
}

function addD(str, days) {
  const d = parseISODate(str);
  if (!d) return '---';
  d.setDate(d.getDate() + Number(days||0));
  return formatDate(d);
}

function getFormattedDuration(str, lang) {
  const start = parseISODate(str);
  if (!start) return lang==='en'?'0 days':'० दिवस';
  const now = getTodayDate();
  if (now < start) return lang==='en'?'0 days':'० दिवस';
  const yrs = now.getFullYear() - start.getFullYear();
  let m = now.getMonth() - start.getMonth() + (yrs*12);
  let d = now.getDate() - start.getDate();
  if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (m < 0) { m = 0; d = 0; }

  if (lang==='en') return m + ' M, ' + d + ' D';
  return m + ' महिना ' + d + ' दिवस';
}

function escapeHtml(val) {
  return String(val==null ? '' : val).replace(/[&<>'"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c]));
}

function draw() {
  const box = document.getElementById('list');
  if (!box) return;
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;

  let cows = 0, buffaloes = 0;
  const today = getTodayDate();

  for (let i = 0; i < memoryRecords.length; i++) {
    const it = memoryRecords[i];
    const start = parseISODate(it.date);
    if (start && !it.isCalved) {
      const pDays = getDayDifference(start, today);
      const tot = it.type==='buffalo' ? 310 : 282;
      if (pDays >= tot && !it.calvedDate) {
        it.isCalved = true;
        it.isAssumedCalved = true;
        const assumedCalveDate = new Date(start.getTime());
        assumedCalveDate.setDate(assumedCalveDate.getDate() + tot);
        it.calvedDate = assumedCalveDate.getFullYear() + '-' + String(assumedCalveDate.getMonth()+1).padStart(2,'0') + '-' + String(assumedCalveDate.getDate()).padStart(2,'0');
        saveRecordToDB(it);
      }
    }

    if (it.type==='cow') cows++;
    if (it.type==='buffalo') buffaloes++;
  }

  document.getElementById('totalCount').innerText = memoryRecords.length;
  document.getElementById('cowCount').innerText = cows;
  document.getElementById('buffaloCount').innerText = buffaloes;

  if (memoryRecords.length === 0) {
    box.innerHTML = '<div class="empty">' + escapeHtml(t.empty) + '</div>';
    checkSmartNotifications(memoryRecords);
    return;
  }

  const sorted = [...memoryRecords].sort((a, b) => Number(b.id) - Number(a.id));

  let html = '';

  for (let i = 0; i < sorted.length; i++) {
    const it = sorted[i];
    const isBuffalo = it.type==='buffalo';
    const tot = isBuffalo ? 310 : 282;
    const start = parseISODate(it.date);

    const imgHtml = it.photo ? '<img src="'+escapeHtml(it.photo)+'" onclick="openImageModal(\''+escapeHtml(it.photo)+'\')">' : (isBuffalo ? '🐃' : '🐄');
    const safeName = escapeHtml(it.name);
    const docName = escapeHtml(it.doctor || '').trim();
    const semenName = escapeHtml(it.semen || '').trim();
    const animalLabel = isBuffalo ? '🐃 ' + t.buf : '🐄 ' + t.cow;
    const safeId = Number(it.id);

    html += '<div class="item">';
    html += '<div class="cow-img">'+imgHtml+'</div>';
    html += '<div class="item-info">';

    if (!it.isCalved) {
      const pDays = start ? getDayDifference(start, today) : 0;
      const dry = isBuffalo ? 220 : 210;
      const dewormDay = tot - 30;

      const check21 = addD(it.date, 21);
      const dryDate = addD(it.date, dry);
      const dewormDate = addD(it.date, dewormDay);
      const transDate = addD(it.date, tot-21);
      const deliveryDate = addD(it.date, tot);

      html += '<div class="item-top"><span>'+ animalLabel +' &nbsp; <b>'+safeName+'</b></span>';
      html += '<span class="duration-badge">⏱️ '+escapeHtml(getFormattedDuration(it.date, lang))+'</span></div>';

      html += '<div class="row"><span>📅 '+(isBuffalo?t.dtLblBuf:t.dtLblCow)+'</span><span class="date-badge">'+escapeHtml(start ? formatDate(start) : '---')+'</span></div>';
      html += '<div class="row"><span>'+t.chk21+'</span><span class="date-badge">'+escapeHtml(check21)+'</span></div>';
      html += '<div class="row"><span>'+t.milkDry+'</span><span class="date-badge">'+escapeHtml(dryDate)+'</span></div>';
      html += '<div class="row"><span>'+t.deworm+'</span><span class="date-badge">'+escapeHtml(dewormDate)+'</span></div>';
      html += '<div class="row"><span>'+t.trans+'</span><span class="date-badge">'+escapeHtml(transDate)+'</span></div>';

      html += '<div class="due"><span>'+t.delivery+'</span><span class="due-badge">'+escapeHtml(deliveryDate)+'</span></div>';

      if (docName || semenName) {
        html += '<div class="note-box">';
        if (docName) html += '<div>💉 <b>'+t.lblDocField+':</b> ' + docName + '</div>';
        if (semenName) html += '<div>🧬 <b>'+t.lblSemenField+':</b> ' + semenName + '</div>';
        html += '</div>';
      }

      /* COMPACT BUTTONS GRID */
      const calveThreshold = isBuffalo ? 295 : 265;
      html += '<div class="action-grid">';
      if (pDays >= calveThreshold) {
        html += '<button class="btn-action btn-calved" type="button" onclick="openDateModal(\'calved\','+safeId+')">'+escapeHtml(t.calvedBtn)+'</button>';
      } else {
        html += '<div></div>';
      }
      html += '<button class="btn-action btn-repeat" type="button" onclick="openDateModal(\'repeat\','+safeId+')">'+escapeHtml(t.repeatBtn)+'</button>';
      html += '<button class="btn-action btn-del" type="button" onclick="delData('+safeId+')">'+escapeHtml(t.delBtn)+'</button>';
      html += '</div>';

    } else {
      const calvedDate = parseISODate(it.calvedDate);
      const cDays = calvedDate ? getDayDifference(calvedDate, today) : 0;
      const restDays = 90;
      
      const heatStart = new Date(calvedDate.getTime());
      heatStart.setDate(heatStart.getDate() + restDays);

      const calvedTitleTxt = 'Calved (विली)';
      const daysCountLbl = 'विण्यापासून दिवस:';
      const daysUnitTxt = ' दिवस';

      html += '<div class="item-top"><span>'+ animalLabel +' &nbsp; <b>'+safeName+'</b></span>';
      html += '<span class="duration-badge" style="background:#dcfce7; color:#15803d; border-color:#86efac;">🐄 '+calvedTitleTxt+'</span></div>';

      html += '<div class="row"><span>📅 '+daysCountLbl+'</span><span class="date-badge" style="background:#dbeafe; color:#1e40af; border-color:#93c5fd;">'+cDays+daysUnitTxt+'</span></div>';
      html += '<div class="row"><span>'+t.calvedDateLbl+'</span><span class="date-badge">'+escapeHtml(calvedDate ? formatDate(calvedDate) : '---')+'</span></div>';
      html += '<div class="row"><span>'+t.heatWindowText+'</span><span class="date-badge">'+formatDate(heatStart)+'</span></div>';

      if (it.isAssumedCalved) {
        html += '<div class="small-assumption-note">'+t.assumedNote+'</div>';
      } else {
        html += '<div class="small-assumption-note">'+t.guidanceNote+'</div>';
      }

      html += '<div class="action-grid-calved">';
      html += '<button class="btn-action btn-calved" type="button" onclick="openDateModal(\'changeCalve\','+safeId+')">'+escapeHtml(t.changeCalveDateBtn)+'</button>';
      html += '<button class="btn-action btn-repeat" type="button" onclick="openDateModal(\'newPregnancy\','+safeId+')">'+escapeHtml(t.setNewDateBtn)+'</button>';
      html += '<button class="btn-action btn-del" type="button" onclick="delData('+safeId+')">'+escapeHtml(t.delBtn)+'</button>';
      html += '</div>';
    }

    html += '</div></div>';
  }

  box.innerHTML = html;
  checkSmartNotifications(sorted);
}

/* 100% PRECISE NOTIFICATIONS LOGIC */
function checkSmartNotifications(db) {
  const banner = document.getElementById('notifBannerBox');
  const title = document.getElementById('notifTitleText');
  const list = document.getElementById('notifListContainer');
  if (!banner || !title || !list) return;

  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  title.innerText = t.notifTitle;

  const today = getTodayDate();
  const alerts = [];

  for (let i = 0; i < db.length; i++) {
    const it = db[i];
    const isBuff = it.type === 'buffalo';
    const animalName = (isBuff ? '🐃' : '🐄') + ' ' + escapeHtml(it.name);
    const animalWord = isBuff ? (lang==='en'?'Buffalo':(lang==='hi'?'भैंस':'म्हैस')) : (lang==='en'?'Cow':(lang==='hi'?'गाय':'गाय'));

    // 1. Post-Calving 90 Days Heat Check Alert (88 to 92 days)
    if (it.isCalved) {
      const calvedDate = parseISODate(it.calvedDate);
      if (calvedDate) {
        const cDay = getDayDifference(calvedDate, today);
        if (cDay >= 88 && cDay <= 93) {
          let heatMsg = lang==='en' ? ('💡 90 days rest completed ('+cDay+' days). Check '+animalWord+' for next Heat & breed.') : (lang==='hi' ? ('💡 ब्याने के 90 दिन पूर्ण ('+cDay+' दिन)। '+animalWord+' की हीट जाँच कर दोबारा गर्भधारण कराएं।') : ('💡 विण्यापासून ९० दिवस पूर्ण झाले आहेत ('+cDay+' दिवस). '+animalWord+' माजावर (Heat) आली असल्यास तपासून AI / गर्भधारणा करा.'));
          alerts.push({name: animalName, text: heatMsg});
        }
      }
      continue;
    }

    const start = parseISODate(it.date);
    if (!start || start > today) continue;

    const pDay = getDayDifference(start, today);
    const tot = isBuff ? 310 : 282;

    // 2. Repeat Check Alert (18th to 22nd Day)
    if (pDay >= 18 && pDay <= 22) {
      const rem = 21 - pDay;
      let msg = '';
      if (rem > 0) msg = `🔴 उलट तपासणी (Repeat Check) चे दिवस जवळ आहेत (${rem} दिवस बाकी). माज/स्त्राव तपासा.`;
      else if (rem === 0) msg = `🔴 आज उलट तपासणी (२१ वा दिवस) चा मुख्य दिवस आहे! व्यवस्थित निरीक्षण करा.`;
      else msg = `🔴 उलट तपासणी (२२ वा दिवस) - पशु माजावर आले नाही ना याची खात्री करा.`;
      alerts.push({ name: animalName, text: msg });
    }

    // 3. Dry Off Period Alert (Cow 210-218 days, Buffalo 220-228 days)
    const dryStart = isBuff ? 220 : 210;
    const dryEnd = isBuff ? 228 : 218;
    if (pDay >= dryStart && pDay <= dryEnd) {
      let dryMsg = `🥛 दूध आटवण्याची (Dry Off Period) योग्य वेळ झाली आहे. पुढील निरोगी वासरू व दुधासाठी दूध हळूहळू बंद करा.`;
      alerts.push({ name: animalName, text: dryMsg });
    }

    // 4. Deworming Dose Alert (35 to 30 days prior)
    const dewormStart = tot - 35;
    const dewormEnd = tot - 30;
    if (pDay >= dewormStart && pDay <= dewormEnd) {
      const daysLeft = tot - pDay;
      let dewormMsg = `💊 विण्यापूर्वी जंतनाशक औषध (Deworming) देण्याची वेळ झाली आहे (${daysLeft} दिवस बाकी). डॉक्टरांचा सल्ला घ्या.`;
      alerts.push({ name: animalName, text: dewormMsg });
    }

    // 5. Transition Diet Alert (23 to 21 days prior)
    const transStart = tot - 23;
    const transEnd = tot - 21;
    if (pDay >= transStart && pDay <= transEnd) {
      let transMsg = `🌾 ट्रान्झिशन आहार (Transition Diet) सुरू करा, जेणेकरून विल्यानंतर मिल्क फिव्हर होणार नाही व ऊर्जा टिकून राहील.`;
      alerts.push({ name: animalName, text: transMsg });
    }

    // 6. Delivery Alert (Cow: 265 days = 8 months 25 days; Buffalo: 295 days)
    const notificationStartDays = isBuff ? 295 : 265;
    if (pDay >= notificationStartDays && pDay <= tot + 9) {
      const deliveryDate = new Date(start.getTime()); deliveryDate.setDate(deliveryDate.getDate() + tot);
      const daysToDelivery = Math.round((deliveryDate - today) / 86400000);
      let dayCountText = '';
      if (daysToDelivery > 0) dayCountText = '(' + daysToDelivery + ' दिवस बाकी आहेत)';
      else if (daysToDelivery === 0) dayCountText = '(आज विण्याची अंदाजे वेळ आहे)';
      else dayCountText = '(नुकतीच विण्याची वेळ झाली आहे)';

      let delNotifTxt = '🍼 ' + animalWord + ' विण्याची वेळ जवळ आली आहे ' + dayCountText + '. जर पशु विले असेल, तर लगेच "Calved (विली)" हे बटण दाबा!';
      alerts.push({ name: animalName, text: delNotifTxt });
    }
  }

  if (alerts.length === 0) {
    banner.style.display = 'none';
    list.innerHTML = '';
    return;
  }

  let html = '';
  for (let i = 0; i < alerts.length; i++) {
    html += '<div class="notif-item"><div style="font-weight:900; color:#991b1b;">'+alerts[i].name+'</div><div style="color:#c2410c;">'+alerts[i].text+'</div></div>';
  }
  list.innerHTML = html;
  banner.style.display = 'block';
}

async function saveData() {
  const dt = document.getElementById('cDate').value;
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  const inputDate = parseISODate(dt);

  if (!inputDate) { alert(t.dateRequired); return; }
  if (inputDate > getTodayDate()) { alert(t.futureDateError); return; }

  const nm = document.getElementById('cName').value.trim() || (cur==='cow' ? 'Cow' : 'Buffalo');
  const doc = document.getElementById('cDoc').value.trim();
  const semen = document.getElementById('cSemen').value.trim();
  const previewImg = document.getElementById('photoPreview');
  const photo = previewImg.style.display==='block' ? previewImg.src : '';

  const newRecord = { 
    id: Date.now(), 
    name: nm, 
    type: cur, 
    date: dt, 
    doctor: doc,
    semen: semen,
    photo: photo,
    isCalved: false,
    calvedDate: '',
    isAssumedCalved: false
  };

  try {
    await saveRecordToDB(newRecord);
  } catch (e) {
    alert(t.storageError);
    return;
  }

  document.getElementById('cName').value = '';
  document.getElementById('cDoc').value = '';
  document.getElementById('cSemen').value = '';
  document.getElementById('cPhoto').value = '';
  previewImg.style.display = 'none';
  setTodayMaxDate();
  draw();
}

async function delData(id) {
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  if (!confirm(t.confirmDel)) return;
  await deleteRecordFromDB(id);
  draw();
}

async function initApp() {
  let unlocked = false;
  try {
    unlocked = (await getSetting('cattle_unlocked')) === 'true';
  } catch (e) {}

  if (!unlocked) {
    document.getElementById('lockScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display = 'none';
    return;
  }
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';

  let savedLang = 'mr';
  try {
    savedLang = (await getSetting('cattle_lang')) || 'mr';
  } catch (e) {}
  document.getElementById('langSelect').value = savedLang;
  setTodayMaxDate();
  await loadAllRecordsFromDB();
  changeLanguage();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
