<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#15803d">

<title>Cattle Tracker</title>

<link rel="manifest" href="manifest.json">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#f0fdf4 0%,#f8fafc 100%);
  color:#1f2937;
}

#appScreen{
  max-width:600px;
  margin:auto;
  padding:8px;
}

/* BRAND */
.brand-title{
  text-align:center;
  font-size:14px;
  font-weight:bold;
  color:#15803d;
  margin-bottom:4px;
}

/* HEADER */
.app-header{
  background:linear-gradient(135deg,#15803d,#16a34a);
  color:white;
  padding:10px;
  border-radius:11px;
  text-align:center;
  margin-bottom:7px;
  box-shadow:0 3px 9px rgba(21,128,61,0.16);
}

.app-header h1{
  margin:0;
  font-size:22px;
}

.app-header p{
  margin:2px 0 0;
  font-size:11px;
  opacity:0.95;
}

/* SMALL LANGUAGE */
.language-box{
  display:flex;
  justify-content:flex-end;
  margin-bottom:7px;
}

#language{
  width:auto;
  min-width:105px;
  padding:5px 7px;
  margin:0;
  font-size:12px;
  border-radius:6px;
  background:white;
}

/* CARD */
.card{
  background:white;
  padding:9px;
  border-radius:10px;
  margin-bottom:8px;
  box-shadow:0 2px 7px rgba(0,0,0,0.05);
  border:1px solid #ecfdf5;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:3px;
  font-size:12px;
}

input,
select,
textarea{
  width:100%;
  padding:8px;
  border:1px solid #d1d5db;
  border-radius:7px;
  margin-bottom:7px;
  font-size:13px;
  background:#fff;
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:#22c55e;
  box-shadow:0 0 0 2px rgba(34,197,94,0.10);
}

textarea{
  resize:vertical;
}

/* BUTTONS */
button{
  border:none;
  border-radius:7px;
  padding:8px 11px;
  font-size:12px;
  cursor:pointer;
}

.animal-buttons{
  display:flex;
  gap:6px;
  margin-bottom:9px;
}

.animal-buttons button{
  flex:1;
  background:#dcfce7;
  color:#166534;
  font-weight:bold;
  border:1px solid #bbf7d0;
}

.animal-buttons button.active{
  background:#15803d;
  color:white;
  border-color:#15803d;
}

.save-btn{
  width:100%;
  background:linear-gradient(135deg,#15803d,#16a34a);
  color:white;
  font-weight:bold;
  font-size:14px;
  padding:9px;
}

.delete-btn{
  background:#fee2e2;
  color:#b91c1c;
  margin-top:5px;
}

.repeat-btn{
  background:#dcfce7;
  color:#166534;
  margin-top:5px;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:8px;
}

.stat{
  background:white;
  padding:6px 3px;
  border-radius:8px;
  text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.04);
  border-top:3px solid #22c55e;
}

.stat:nth-child(2){
  border-top-color:#f59e0b;
}

.stat:nth-child(3){
  border-top-color:#3b82f6;
}

.stat strong{
  display:block;
  font-size:17px;
  color:#15803d;
  margin-bottom:1px;
}

.stat span{
  font-size:11px;
}

/* REMINDERS */
#reminderCard{
  padding:6px 8px;
}

#reminderCard h2{
  margin:0 0 5px;
  font-size:13px;
}

.reminder{
  display:flex;
  align-items:center;
  gap:6px;
  background:#fff7ed;
  border-left:3px solid #f97316;
  padding:5px 6px;
  border-radius:6px;
  margin-bottom:3px;
}

.reminder:last-child{
  margin-bottom:0;
}

.reminder.today{
  background:#fef2f2;
  border-left-color:#dc2626;
}

.reminder.tomorrow{
  background:#eff6ff;
  border-left-color:#3b82f6;
}

.reminder-icon{
  font-size:16px;
  flex:none;
}

.reminder-content{
  min-width:0;
  flex:1;
}

.reminder-title{
  font-weight:bold;
  font-size:11px;
  line-height:1.25;
}

.reminder-animal{
  font-size:11px;
  font-weight:600;
  margin-top:1px;
}

.reminder-date{
  font-size:10px;
  color:#4b5563;
  margin-top:1px;
}

/* RECORD */
.record{
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:8px;
  margin-bottom:7px;
  background:#ffffff;
}

.record h3{
  margin:0 0 4px;
  font-size:15px;
  color:#166534;
}

.record p{
  margin:3px 0;
  font-size:12px;
}

.record img{
  width:100%;
  max-height:180px;
  object-fit:cover;
  border-radius:7px;
  margin-top:5px;
}

.photo-preview{
  width:100%;
  max-height:180px;
  object-fit:cover;
  border-radius:7px;
  display:none;
  margin-bottom:7px;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:10px;
  font-size:12px;
}

.editing-note{
  background:#eff6ff;
  color:#1d4ed8;
  border-radius:6px;
  padding:5px 7px;
  margin-bottom:7px;
  font-size:11px;
  font-weight:bold;
}

/* RECORD BUTTONS */
.record-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.record-actions button{
  flex:1;
  min-width:120px;
}

/* MOBILE */
@media(max-width:400px){

  #appScreen{
    padding:7px;
  }

  .app-header h1{

  }

  .card{

  }

  .stat strong{
    font-size:16px;
  }

  .stat span{
    font-size:10px;
  }

  .reminder-title{
    font-size:10px;
  }

  .reminder-animal{
    font-size:10px;
  }

  .reminder-date{
    font-size:9px;
  }

}
</style>

function getLang(){

  return document.getElementById("language").value || "mr";

}


/* LANGUAGE CHANGE */

function changeLanguage(){

  const lang = getLang();
  const t = langData[lang];

  localStorage.setItem(
    "cattle_tracker_lang",
    lang
  );

  document.getElementById("appTitle").textContent =
    t.title;

  document.getElementById("appSubtitle").textContent =
    t.subtitle;

  document.getElementById("animalLabel").textContent =
    t.animalLabel;

  document.getElementById("cowBtn").textContent =
    t.cow;

  document.getElementById("buffaloBtn").textContent =
    t.buffalo;

  document.getElementById("nameLabel").textContent =
    t.nameLabel;

  document.getElementById("animalName").placeholder =
    t.namePlaceholder;

  document.getElementById("dateLabel").textContent =
    t.dateLabel;

  document.getElementById("noteLabel").textContent =
    t.noteLabel;

  document.getElementById("note").placeholder =
    t.notePlaceholder;

  document.getElementById("photoLabel").textContent =
    t.photoLabel;

  document.getElementById("saveBtn").textContent =
    editingId !== null ? t.update : t.save;

  document.getElementById("recordsTitle").textContent =
    t.records;

  document.getElementById("totalText").textContent =
    t.total;

  document.getElementById("cowText").textContent =
    t.cowText;

    t.buffaloText;

  document.getElementById("reminderTitle").textContent =
    t.reminderTitle;

  document.getElementById("editingNote").textContent =
    t.editing;

  draw();
  drawReminders();

}


/* ANIMAL */

function selectAnimal(type){

  cur = type;

  document
    .getElementById("cowBtn")
    .classList
    .toggle(
      "active",
      type === "cow"
    );

  document
    .getElementById("buffaloBtn")
    .classList
    .toggle(
      "active",
      type === "buffalo"
    );

}


/* DATABASE */

function getDB(){

  try{

    return JSON.parse(
      localStorage.getItem("cattle_tracker_db")
    ) || [];

  }
  catch(e){

    return [];

  }

}


function setDB(data){

  localStorage.setItem(
    "cattle_tracker_db",
    JSON.stringify(data)
  );

}


/* TODAY */

function todayISO(){

  const d = new Date();

  const y =
    d.getFullYear();

  const m =
    String(
      d.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      d.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${day}`;

}


/* IMAGE COMPRESSION */

function compressImage(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload =
      function(e){

        const img =
          new Image();

        img.onload =
          function(){

            const canvas =
              document.createElement(
                "canvas"
              );

            let width =
              img.width;

            let height =
              img.height;

            const max = 400;

            if(
              width > max ||
              height > max
            ){

              if(width > height){

                height =
                  Math.round(
                    height * max / width
                  );

                width = max;

              }
              else{

                width =
                  Math.round(
                    width * max / height
                  );

                height = max;

              }

            }

            canvas.width = width;
            canvas.height = height;

            const ctx =
              canvas.getContext("2d");

            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );

            resolve(
              canvas.toDataURL(
                "image/jpeg",
                0.7
              )
            );

          };

        img.onerror = reject;

        img.src = e.target.result;

      };

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}


/* PHOTO PREVIEW */

async function previewPhoto(){

  const input =
    document.getElementById("photo");

  const preview =
    document.getElementById(
      "photoPreview"
    );

  if(!input.files.length){

    return;

  }

  try{

    const compressed =
      await compressImage(
        input.files[0]
      );

    preview.src = compressed;

    preview.style.display = "block";

  }
  catch(e){

    console.log(
      "Photo error",
      e
    );

  }

}


/* SAVE / UPDATE */

async function saveData(){

  const name =
    document
      .getElementById("animalName")
      .value
      .trim();

  const pregDate =
    document
      .getElementById("pregDate")
      .value;

  const note =
    document
      .getElementById("note")
      .value
      .trim();

  const t =
    langData[getLang()];

  if(!pregDate){

    alert(t.dateRequired);

    return;

  }

  const db = getDB();

  /* NEW RECORD */

  if(editingId === null){

    let photo = "";

    const photoInput =
      document.getElementById("photo");

    if(photoInput.files.length){

      try{

        photo =
          await compressImage(
            photoInput.files[0]
          );

      }
      catch(e){

        console.log(
          "Photo compression failed",
          e
        );

      }

    }

    db.push({

      id:Date.now(),

      type:cur,

      name:name,

      pregDate:pregDate,

      note:note,

      photo:photo

    });

  }

  /* UPDATE EXISTING RECORD */

  else{

    const index =
      db.findIndex(
        x => x.id === editingId
      );

    if(index === -1){

      editingId = null;

      return;

    }

    const old =
      db[index];

    let photo =
      old.photo || "";

    const photoInput =
      document.getElementById("photo");

    if(photoInput.files.length){

      try{

        photo =
          await compressImage(
            photoInput.files[0]
          );

      }
      catch(e){

        console.log(
          "Photo compression failed",
          e
        );

      }

    }

    db[index] = {

      ...old,

      type:cur,

      name:name,

      pregDate:pregDate,

      note:note,

      photo:photo

    };

  }

  setDB(db);

  clearForm();

  draw();
  drawReminders();

}


/* CLEAR FORM */

function clearForm(){

  editingId = null;

  document.getElementById(
    "animalName"
  ).value = "";

  document.getElementById(
    "pregDate"
  ).value = "";

  document.getElementById(
    "note"
  ).value = "";

  document.getElementById(
    "photo"
  ).value = "";

  const preview =
    document.getElementById(
      "photoPreview"
    );

  preview.src = "";

  preview.style.display = "none";

  document.getElementById(
    "editingNote"
  ).style.display = "none";

  document.getElementById(
    "saveBtn"
  ).textContent =
    langData[getLang()].save;

}


/* DELETE */

function delData(id){

  const t =
    langData[getLang()];

  if(
    !confirm(
      t.confirmDelete
    )
  ){

    return;

  }

  const db =
    getDB().filter(
      x => x.id !== id
    );

  setDB(db);

  if(editingId === id){

    clearForm();

  }

  draw();
  drawReminders();

}


/*
  REPEAT

  Repeat केल्यावर:
  - जुना record delete होत नाही
  - नवीन duplicate तयार होत नाही
  - त्याच record ची AI date आजची होते
  - जुने नाव/photo/note कायम राहतात
  - Save केल्यावर त्याच record वर update होते
*/

function repeatData(id){

  const db = getDB();

  const item =
    db.find(
      x => x.id === id
    );

  if(!item){

    return;

  }

  editingId = item.id;

  cur = item.type;

  selectAnimal(item.type);

  document.getElementById(
    "animalName"
  ).value =
    item.name || "";

  /*
    सर्वात महत्त्वाचा बदल:
    Repeat = आजची तारीख
  */

  document.getElementById(
    "pregDate"
  ).value =
    todayISO();

  document.getElementById(
    "note"
  ).value =
    item.note || "";

  /*
    जुना photo preview मध्ये दाखवा
  */

  const preview =
    document.getElementById(
      "photoPreview"
    );

  if(item.photo){

    preview.src = item.photo;

    preview.style.display =
      "block";

  }
  else{

    preview.src = "";

    preview.style.display =
      "none";

  }

  /*
    Editing message
  */

  document.getElementById(
    "editingNote"
  ).style.display =
    "block";

  document.getElementById(
    "saveBtn"
  ).textContent =
    langData[getLang()].update;

  /*
    Form वर scroll
  */

  document
    .querySelector(".animal-buttons")
    .scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

}
