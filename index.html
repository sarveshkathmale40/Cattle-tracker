<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#047857">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The MH Farmer">

<link rel="manifest" href="manifest.json">
<title>The MH Farmer</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:linear-gradient(135deg,#f0fdf4 0%,#ecfdf5 50%,#f8fafc 100%);min-height:100vh;padding:10px;color:#0f172a;display:flex;justify-content:center;align-items:center;}
.wrap{width:100%;max-width:420px;margin:0 auto;}

/* Lock Screen */
#lockScreen{display:flex;flex-direction:column;justify-content:center;min-height:90vh;}
.lock-card{background:white;border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08);border:1px solid #e2e8f0;text-align:center;}
.lock-title{font-size:22px;font-weight:900;color:#047857;margin-bottom:6px;}
.lock-sub{font-size:12px;color:#64748b;margin-bottom:20px;font-weight:600;line-height:1.4;}

/* Premium Glass & Golden Wheat Glow Header */
.app-header{background:linear-gradient(135deg,#022c22 0%,#064e3b 50%,#047857 100%);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 12px 30px -5px rgba(4,120,87,.45),inset 0 2px 6px rgba(255,255,255,.25);text-align:center;display:flex;justify-content:space-between;align-items:center;color:white;border:2px solid #065f46;position:relative;overflow:hidden;}
.app-header::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle, rgba(252,211,77,0.18) 0%, transparent 70%);pointer-events:none;}
.header-title{font-size:22px;font-weight:900;letter-spacing:.5px;text-shadow:0 2px 5px rgba(0,0,0,0.3);background:linear-gradient(to right, #ffffff, #fef08a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header-sub{font-size:10.5px;color:#a7f3d0;margin-top:2px;font-weight:800;letter-spacing:1px;text-transform:uppercase;}

/* Install PWA Button */
.install-bar{display:none;background:linear-gradient(135deg,#059669 0%,#10b981 100%);color:white;padding:10px 14px;border-radius:14px;margin-bottom:12px;text-align:center;box-shadow:0 6px 15px rgba(16,185,129,.3);font-size:13px;font-weight:800;border:none;width:100%;cursor:pointer;justify-content:center;align-items:center;gap:8px;}

/* Language */
#langSelect{background:rgba(255,255,255,.2);color:white;border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:bold;outline:none;cursor:pointer;backdrop-filter:blur(4px);}
#langSelect option{background:#064e3b;color:white;}

/* Notifications */
.notification-banner{background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%);border:2px solid #f59e0b;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 6px 20px rgba(217,119,6,.15);}
.notif-title{font-size:13px;font-weight:900;color:#b45309;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.notif-list{display:flex;flex-direction:column;gap:6px;}
.notif-item{background:white;border-radius:10px;padding:8px 10px;font-size:11.5px;color:#78350f;font-weight:600;border:1.5px solid #fde68a;line-height:1.4;border-left:4px solid #d97706;}

/* Stats Cards */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat{background:linear-gradient(135deg,#ffffff 0%,#f8fafc 100%);padding:10px 6px;border-radius:16px;text-align:center;box-shadow:0 6px 15px rgba(0,0,0,.05),inset 0 2px 3px rgba(255,255,255,.8);border:2px solid #e2e8f0;}
.stat-number{font-size:18px;font-weight:900;color:#047857;}
.stat-label{font-size:10.5px;color:#64748b;font-weight:800;margin-top:1px;}

/* Main Card */
.card{background:white;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 8px 25px rgba(0,0,0,.05);border:2px solid #e2e8f0;}
.card h3{font-size:15px;margin-bottom:10px;color:#047857;font-weight:900;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.3px;}

/* Inputs */
label{display:block;text-align:left;font-size:10.5px;font-weight:800;color:#475569;margin-bottom:4px;margin-left:2px;}
input,select,textarea{width:100%;padding:10px 12px;border:2px solid #cbd5e1;border-radius:12px;font-size:14px;outline:none;background:#f8fafc;margin-bottom:8px;font-weight:700;font-family:inherit;transition:all .2s;}
input:focus,select:focus,textarea:focus{border-color:#059669;background:white;box-shadow:0 0 0 3px rgba(5,150,105,.15);}

/* Split Inputs Container */
.split-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}

/* 3D Animal Buttons */
.animal-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px;}
.animal-btn{border:2px solid #cbd5e1;background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%);padding:10px 6px;border-radius:12px;cursor:pointer;font-weight:900;color:#64748b;text-align:center;font-size:13px;box-shadow:0 4px 10px rgba(0,0,0,.04),inset 0 1px 2px rgba(255,255,255,.8);transition:all .15s;}
.animal-btn:active{transform:scale(.96);}
.animal-btn.active{border-color:#059669;background:linear-gradient(135deg,#d1fae5 0%,#a7f3d0 100%);color:#064e3b;box-shadow:0 6px 15px rgba(5,150,105,.25),inset 0 2px 4px rgba(255,255,255,.6);}

/* 3D Main Button */
.btn{width:100%;background:linear-gradient(135deg,#059669 0%,#047857 50%,#064e3b 100%);color:white;border:2px solid #064e3b;padding:12px;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer;margin-top:4px;box-shadow:0 6px 18px rgba(5,150,105,.35),inset 0 2px 4px rgba(255,255,255,.3);letter-spacing:.3px;transition:all .15s ease;}
.btn:active{transform:scale(.96);box-shadow:0 2px 6px rgba(5,150,105,.3);}

/* Photo Preview */
.photo-preview{width:65px;height:65px;border-radius:14px;object-fit:cover;display:none;margin:4px auto 8px;box-shadow:0 4px 10px rgba(0,0,0,.08);cursor:pointer;}

/* Records Item */
.item{background:linear-gradient(135deg,#ffffff 0%,#f8fafc 100%);border-radius:16px;padding:12px;border:2px solid #e2e8f0;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 4px 15px rgba(0,0,0,.03);}
.cow-img{width:72px;height:72px;border-radius:14px;background:#e2e8f0;display:flex;justify-content:center;align-items:center;font-size:32px;flex-shrink:0;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.06);cursor:pointer;}
.cow-img img{width:100%;height:100%;object-fit:cover;}
.item-info{flex-grow:1;min-width:0;}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:4px;font-weight:900;font-size:12.5px;border-bottom:2px solid #f1f5f9;padding-bottom:5px;margin-bottom:5px;color:#1e293b;}
.duration-badge{background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);color:#1d4ed8;font-weight:900;font-size:11px;padding:3px 8px;border-radius:8px;border:1.5px solid #93c5fd;white-space:nowrap;}

.row{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:11px;padding:5px 0;color:#334155;font-weight:700;border-bottom:1px dashed #e2e8f0;}
.row span:first-child{flex:1;line-height:1.3;}
.date-badge{background:linear-gradient(135deg,#fefce8 0%,#fef9c3 100%);color:#854d0e;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:900;border:1.5px solid #fef08a;text-align:right;width:90px;flex-shrink:0;}

.due{background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 100%);padding:6px 8px;border-radius:10px;color:#14532d;font-weight:900;margin-top:6px;font-size:11.5px;border:1.5px solid #86efac;display:flex;justify-content:space-between;align-items:center;}
.due span:first-child{flex:1;}
.due-badge{background:#16a34a;color:white;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:900;text-align:right;width:90px;flex-shrink:0;}

.note-box{background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%);border:1.5px solid #fcd34d;border-radius:8px;padding:6px 8px;font-size:11px;color:#78350f;margin-top:5px;font-weight:700;display:flex;flex-direction:column;gap:2px;}

/* Guidance Note */
.small-assumption-note{font-size:11px;color:#334155;font-weight:700;margin-top:6px;line-height:1.4;background:#f8fafc;padding:8px 10px;border-radius:10px;border:1.5px solid #cbd5e1;box-shadow:0 2px 6px rgba(0,0,0,.03);}

/* SUPER FAINT & CLASSY PASTEL 3D ACTION BUTTONS (~20-25% Intensity) */
.action-btns{display:flex;gap:6px;margin-top:8px;}

/* Faint Soft Mint Green (वेवल्याची तारीख बदला) */
.btn-repeat{flex:1;background:linear-gradient(135deg,#a7f3d0 0%,#6ee7b7 50%,#34d399 100%);color:#064e3b;border:1px solid #10b981;padding:10px 4px;border-radius:10px;font-weight:900;font-size:11px;cursor:pointer;text-align:center;box-shadow:0 4px 0 #059669, 0 6px 12px rgba(52,211,153,.2);transition:all .1s ease;}
.btn-repeat:active{transform:translateY(3px);box-shadow:0 1px 0 #059669, 0 2px 4px rgba(52,211,153,.15);}

/* Faint Soft Sky Blue (नवीन लावल्याची तारीख टाका) */
.btn-calved{flex:1;background:linear-gradient(135deg,#bae6fd 0%,#7dd3fc 50%,#38bdf8 100%);color:#0c4a6e;border:1px solid #0284c7;padding:10px 4px;border-radius:10px;font-weight:900;font-size:11px;cursor:pointer;text-align:center;box-shadow:0 4px 0 #0284c7, 0 6px 12px rgba(56,189,248,.2);transition:all .1s ease;}
.btn-calved:active{transform:translateY(3px);box-shadow:0 1px 0 #0284c7, 0 2px 4px rgba(56,189,248,.15);}

/* Faint Soft Coral Red (डिलीट) */
.btn-del{flex:0 0 auto;background:linear-gradient(135deg,#fecdd3 0%,#fda4af 100%);color:#881337;border:1px solid #fb7185;padding:10px 10px;border-radius:10px;font-weight:900;font-size:11px;cursor:pointer;text-align:center;box-shadow:0 4px 0 #e11d48, 0 6px 12px rgba(251,113,133,.2);transition:all .1s ease;}
.btn-del:active{transform:translateY(3px);box-shadow:0 1px 0 #e11d48, 0 2px 4px rgba(251,113,133,.15);}

.empty{text-align:center;color:#94a3b8;font-size:12px;padding:20px;font-weight:700;}

/* Modal & Custom Popup */
.date-modal{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.6);z-index:99999;justify-content:center;align-items:center;padding:16px;backdrop-filter:blur(3px);}
.date-modal-card{background:white;padding:20px;border-radius:20px;width:100%;max-width:320px;box-shadow:0 15px 35px rgba(0,0,0,0.25);text-align:center;border:2px solid #047857;}
.date-modal-card h4{font-size:15px;color:#047857;margin-bottom:12px;font-weight:900;}

/* Zoom */
#imageZoomModal{display:none;position:fixed;z-index:99999;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.92);justify-content:center;align-items:center;flex-direction:column;padding:16px;}
#zoomedImage{max-width:95%;max-height:80%;object-fit:contain;border-radius:14px;}
.modal-close-btn{position:absolute;top:20px;right:20px;color:white;font-size:32px;font-weight:bold;background:rgba(255,255,255,0.2);width:44px;height:44px;border-radius:50%;display:flex;justify-content:center;align-items:center;cursor:pointer;}
</style>
</head>

<body>

<div class="wrap">

  <!-- LOCK SCREEN -->
  <div id="lockScreen" style="display:none;">
    <div class="lock-card">
      <div class="lock-title">🔐 The MH Farmer</div>
      <div class="lock-sub" id="lockSubTxt">ॲप वापरण्यासाठी तुमचा मोबाईल नंबर आणि पिन प्रविष्ट करा</div>
      <label id="lblMob">मोबाईल नंबर (१० अंकी)</label>
      <input type="tel" id="loginMob" maxlength="10" inputmode="numeric">
      <label id="lblPin">सिक्रेट पिन (PIN)</label>
      <input type="password" id="loginPin" maxlength="4" inputmode="numeric">
      <button class="btn" type="button" id="btnLogin" onclick="verifyLogin()">ॲप सुरू करा 🚀</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appScreen" style="display:none;">

    <!-- Header with Golden Wheat Touch -->
    <div class="app-header">
      <div style="text-align:left; display:flex; align-items:center; gap:8px;">
        <span style="font-size:26px; filter: drop-shadow(0 2px 4px rgba(252,211,77,0.5));">🌾</span>
        <div>
          <div class="header-title">The MH Farmer</div>
          <div class="header-sub" id="mainHeaderSub">Cattle Pregnancy Tracker</div>
        </div>
      </div>
      <div>
        <select id="langSelect" onchange="changeLanguage()">
          <option value="mr">मराठी</option>
          <option value="hi">हिंदी</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <button id="pwaInstallBtn" class="install-bar" type="button" onclick="installPWA()" style="display:none;">
      <span>📲 ॲप फोनमध्ये इन्स्टॉल करा</span>
    </button>

    <div id="notifBannerBox" class="notification-banner" style="display:none;">
      <div class="notif-title" id="notifTitleText">🔔 महत्त्वाचे अलर्ट्स</div>
      <div id="notifListContainer" class="notif-list"></div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat"><div class="stat-number" id="totalCount">0</div><div class="stat-label" id="lblTotal">एकूण</div></div>
      <div class="stat"><div class="stat-number" id="cowCount">0</div><div class="stat-label" id="lblCow">गाय</div></div>
      <div class="stat"><div class="stat-number" id="buffaloCount">0</div><div class="stat-label" id="lblBuf">म्हैस</div></div>
    </div>

    <!-- Compact Form with Split Doctor & Semen Inputs -->
    <div class="card">
      <h3 id="formTitle">➕ नवीन पशु नोंद</h3>
      
      <div class="animal-buttons">
        <button class="animal-btn active" id="cowBtn" type="button" onclick="selectAnimal('cow')">🐄 <span id="btnCowTxt">गाय</span></button>
        <button class="animal-btn" id="buffaloBtn" type="button" onclick="selectAnimal('buffalo')">🐃 <span id="btnBufTxt">म्हैस</span></button>
      </div>

      <label id="lblNameLbl">पशुचे नाव / ओळख</label>
      <input type="text" id="cName" placeholder="उदा. कावेरी">

      <label id="lblDate">गाय गाभण राहिल्याची तारीख</label>
      <input type="date" id="cDate">

      <label id="lblNoteLbl">डॉक्टर व सिमेन तपशील (पर्यायी)</label>
      <div class="split-inputs">
        <input type="text" id="cDoc" placeholder="डॉक्टरचे नाव">
        <input type="text" id="cSemen" placeholder="सिमेन ब्रँड/नाव">
      </div>

      <label id="lblPhotoLbl">पशुचा फोटो (पर्यायी)</label>
      <input type="file" id="cPhoto" accept="image/*" onchange="previewPhoto()">
      <img id="photoPreview" class="photo-preview" alt="Preview" onclick="openImageModal(this.src)">

      <button class="btn" id="btnSave" type="button" onclick="saveData()">💾 नोंद जतन करा</button>
    </div>

    <div class="card">
      <h3 id="listTitle">📋 माझ्या पशुंच्या नोंदी</h3>
      <div id="list"></div>
    </div>

  </div>

</div>

<!-- Professional Custom Modal for Date & Split Doctor/Semen Entry -->
<div id="customDateModal" class="date-modal">
  <div class="date-modal-card">
    <h4 id="modalTitleText">तारीख निवडा</h4>
    
    <label style="text-align:left; font-size:11px; font-weight:800; color:#475569; margin-bottom:2px;" id="modalDateLbl">तारीख निवडा</label>
    <input type="date" id="modalDateInput" style="margin-bottom:10px;">

    <div id="modalDoctorSemenContainer" style="display:none;">
      <label style="text-align:left; font-size:11px; font-weight:800; color:#475569; margin-bottom:2px;" id="lblDocName">डॉक्टरचे नाव</label>
      <input type="text" id="modalDoctorInput" placeholder="उदा. डाॅ. पाटील" style="margin-bottom:8px;">

      <label style="text-align:left; font-size:11px; font-weight:800; color:#475569; margin-bottom:2px;" id="lblSemenName">सिमेन ब्रँड / नाव</label>
      <input type="text" id="modalSemenInput" placeholder="उदा. एचएफ / जर्सी" style="margin-bottom:12px;">
    </div>

    <button class="btn" type="button" onclick="submitModalDate()">✅ ओके</button>
    <button class="btn" type="button" style="background:#64748b; margin-top:6px;" onclick="closeDateModal()">रद्द करा</button>
  </div>
</div>

<!-- Zoom -->
<div id="imageZoomModal" onclick="closeImageModal()">
  <div class="modal-close-btn" onclick="closeImageModal()">&times;</div>
  <img id="zoomedImage" src="" alt="Zoomed Photo" onclick="event.stopPropagation()">
</div>

<script>
'use strict';

let deferredPrompt = null;
const pwaBtn = document.getElementById('pwaInstallBtn');

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  if(pwaBtn && !window.matchMedia('(display-mode: standalone)').matches){
    pwaBtn.style.display = 'flex';
  }
});

function installPWA(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){ deferredPrompt = null; if(pwaBtn) pwaBtn.style.display = 'none'; });
  }
}

function openImageModal(src){
  if(!src) return;
  document.getElementById('zoomedImage').src = src;
  document.getElementById('imageZoomModal').style.display = 'flex';
}

function closeImageModal(){
  document.getElementById('imageZoomModal').style.display = 'none';
}

let cur = 'cow';
let activeActionId = null;
let activeActionType = null;

function selectAnimal(type){
  cur = type==='buffalo' ? 'buffalo' : 'cow';
  document.getElementById('cowBtn').classList.toggle('active', cur==='cow');
  document.getElementById('buffaloBtn').classList.toggle('active', cur==='buffalo');

  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  document.getElementById('lblDate').innerText = cur==='buffalo' ? t.dtLblBuf : t.dtLblCow;
}

function openDateModal(type, id){
  activeActionType = type;
  activeActionId = id;
  const modal = document.getElementById('customDateModal');
  const input = document.getElementById('modalDateInput');
  const title = document.getElementById('modalTitleText');
  const docSemenContainer = document.getElementById('modalDoctorSemenContainer');
  
  const now = new Date();
  input.value = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  input.max = input.value;

  const db = getDB();
  let animalType = 'गाय';
  for(let i=0; i<db.length; i++){
    if(Number(db[i].id) === Number(id)){
      animalType = (db[i].type === 'buffalo') ? 'म्हैस' : 'गाय';
      break;
    }
  }

  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;

  if(type === 'repeat' || type === 'newPregnancy'){
    docSemenContainer.style.display = 'block';
    document.getElementById('modalDoctorInput').value = '';
    document.getElementById('modalSemenInput').value = '';
    document.getElementById('lblDocName').innerText = t.lblDocName;
    document.getElementById('lblSemenName').innerText = t.lblSemenName;
  } else {
    docSemenContainer.style.display = 'none';
  }

  if(lang === 'hi'){
    if(type === 'repeat') title.innerText = animalType + ' रिपीट होने के कारण नई तारीख चुनें:';
    else if(type === 'calved') title.innerText = animalType + ' ब्याने की सटीक तारीख दर्ज करें:';
    else if(type === 'newPregnancy') title.innerText = 'नई ' + animalType + ' लगाने की तारीख दर्ज करें:';
    else if(type === 'changeCalve') title.innerText = animalType + ' ब्याने की सटीक तारीख बदलें:';
  } else if(lang === 'en'){
    if(type === 'repeat') title.innerText = 'Select new pregnancy date for ' + animalType + ':';
    else if(type === 'calved') title.innerText = 'Enter exact calving date for ' + animalType + ':';
    else if(type === 'newPregnancy') title.innerText = 'Enter new breeding date for ' + animalType + ':';
    else if(type === 'changeCalve') title.innerText = 'Change calving date for ' + animalType + ':';
  } else {
    if(type === 'repeat') title.innerText = animalType + ' उलटल्यामुळे नवीन गाभण तारीख निवडा:';
    else if(type === 'calved') title.innerText = animalType + ' वेवल्याची अचूक तारीख टाका:';
    else if(type === 'newPregnancy') title.innerText = 'नवीन ' + animalType + ' लावल्याची तारीख टाका:';
    else if(type === 'changeCalve') title.innerText = 'वेवल्याची अचूक तारीख बदला:';
  }

  modal.style.display = 'flex';
}

function closeDateModal(){
  document.getElementById('customDateModal').style.display = 'none';
  activeActionId = null;
  activeActionType = null;
}

function submitModalDate(){
  const val = document.getElementById('modalDateInput').value;
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  
  if(!val){ alert(t.dateRequired); return; }
  const parsed = parseISODate(val);
  if(!parsed || parsed > getTodayDate()){ alert(t.futureDateError); return; }

  const docName = document.getElementById('modalDoctorInput').value.trim();
  const semenName = document.getElementById('modalSemenInput').value.trim();

  const db = getDB();
  for(let i=0; i<db.length; i++){
    if(Number(db[i].id) === Number(activeActionId)){
      if(activeActionType === 'repeat' || activeActionType === 'newPregnancy'){
        db[i].date = val;
        db[i].isCalved = false;
        db[i].isAssumedCalved = false;
        db[i].calvedDate = '';
        if(docName) db[i].doctor = docName;
        if(semenName) db[i].semen = semenName;
      } else if(activeActionType === 'calved' || activeActionType === 'changeCalve'){
        db[i].isCalved = true;
        db[i].isAssumedCalved = false;
        db[i].calvedDate = val;
      }
      break;
    }
  }

  localStorage.setItem('cattle_tracker_db', JSON.stringify(db));
  closeDateModal();
  draw();
}

function compressImage(file, callback){
  if(!file || !file.type || file.type.indexOf('image/')!==0){ callback(''); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if(w > 500){ h = h * (500 / w); w = 500; }
      if(h > 500){ w = w * (500 / h); h = 500; }
      canvas.width = Math.round(w); canvas.height = Math.round(h);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = function(){ callback(''); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function previewPhoto(){
  const input = document.getElementById('cPhoto');
  const preview = document.getElementById('photoPreview');
  if(input.files && input.files[0]){
    compressImage(input.files[0], function(res){
      if(res){ preview.src = res; preview.style.display = 'block'; }
      else { preview.removeAttribute('src'); preview.style.display = 'none'; }
    });
  }
}

function parseISODate(str){
  if(typeof str!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(str)) return null;
  const p = str.split('-').map(Number);
  const d = new Date(p[0], p[1]-1, p[2]);
  if(d.getFullYear()!==p[0] || d.getMonth()!==p[1]-1 || d.getDate()!==p[2]) return null;
  d.setHours(0,0,0,0);
  return d;
}

function getTodayDate(){
  const d = new Date(); d.setHours(0,0,0,0); return d;
}

function getDayDifference(start, end){
  return Math.round((end - start)/86400000);
}

function formatDate(d){
  return String(d.getDate()).padStart(2,'0') + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + d.getFullYear();
}

function addD(str, days){
  const d = parseISODate(str);
  if(!d) return '---';
  d.setDate(d.getDate() + Number(days||0));
  return formatDate(d);
}

function getFormattedDuration(str, lang){
  const start = parseISODate(str);
  if(!start) return lang==='en'?'0 days':(lang==='hi'?'0 दिन':'० दिवस');
  const now = getTodayDate();
  if(now < start) return lang==='en'?'0 days':(lang==='hi'?'0 दिन':'० दिवस');
  const yrs = now.getFullYear() - start.getFullYear();
  let m = now.getMonth() - start.getMonth() + (yrs*12);
  let d = now.getDate() - start.getDate();
  if(d < 0){ m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if(m < 0){ m = 0; d = 0; }

  if(lang==='en') return m + ' mos ' + d + ' days';
  if(lang==='hi') return m + ' महीने ' + d + ' दिन';
  return m + ' महिना ' + d + ' दिवस';
}

function escapeHtml(val){
  return String(val==null ? '' : val).replace(/[&<>'"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c];
  });
}

function draw(){
  const box = document.getElementById('list');
  if(!box) return;
  const db = getDB();
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;

  let cows = 0, buffaloes = 0;
  const today = getTodayDate();

  for(let i=0; i<db.length; i++){
    const it = db[i];
    const start = parseISODate(it.date);
    if(start && !it.isCalved){
      const pDays = getDayDifference(start, today);
      const tot = it.type==='buffalo' ? 310 : 282;
      if(pDays >= tot && !it.calvedDate){
        it.isCalved = true;
        it.isAssumedCalved = true;
        const assumedCalveDate = new Date(start.getTime());
        assumedCalveDate.setDate(assumedCalveDate.getDate() + tot);
        it.calvedDate = assumedCalveDate.getFullYear() + '-' + String(assumedCalveDate.getMonth()+1).padStart(2,'0') + '-' + String(assumedCalveDate.getDate()).padStart(2,'0');
      }
    }

    if(it.type==='cow') cows++;
    if(it.type==='buffalo') buffaloes++;
  }
  try{ localStorage.setItem('cattle_tracker_db', JSON.stringify(db)); }catch(e){}

  document.getElementById('totalCount').innerText = db.length;
  document.getElementById('cowCount').innerText = cows;
  document.getElementById('buffaloCount').innerText = buffaloes;

  if(db.length === 0){
    box.innerHTML = '<div class="empty">' + escapeHtml(t.empty) + '</div>';
    checkSmartNotifications();
    return;
  }

  let html = '';

  for(let i=0; i<db.length; i++){
    const it = db[i];
    const isBuffalo = it.type==='buffalo';
    const tot = isBuffalo ? 310 : 282;
    const start = parseISODate(it.date);

    const imgHtml = it.photo ? '<img src="'+escapeHtml(it.photo)+'" onclick="openImageModal(\''+escapeHtml(it.photo)+'\')">' : (isBuffalo ? '🐃' : '🐄');
    const safeName = escapeHtml(it.name);
    const docName = escapeHtml(it.doctor || '').trim();
    const semenName = escapeHtml(it.semen || '').trim();
    const animalLabel = isBuffalo ? '🐃 ' + t.buf : '🐄 ' + t.cow;
    const safeId = Number(it.id);

    html += '<div class="item">';
    html += '<div class="cow-img">'+imgHtml+'</div>';
    html += '<div class="item-info">';

    if(!it.isCalved){
      const pDays = start ? getDayDifference(start, today) : 0;
      const dry = isBuffalo ? 220 : 210;
      const dewormDay = tot - 30;

      const check21 = addD(it.date, 21);
      const dryDate = addD(it.date, dry);
      const dewormDate = addD(it.date, dewormDay);
      const transDate = addD(it.date, tot-21);
      const deliveryDate = addD(it.date, tot);

      html += '<div class="item-top"><span>'+ animalLabel +' &nbsp; <b>'+safeName+'</b></span>';
      html += '<span class="duration-badge">⏱️ '+escapeHtml(getFormattedDuration(it.date, lang))+'</span></div>';

      html += '<div class="row"><span>📅 '+(isBuffalo?t.dtLblBuf:t.dtLblCow)+'</span><span class="date-badge">'+escapeHtml(start ? formatDate(start) : '---')+'</span></div>';
      html += '<div class="row"><span>'+t.chk21+'</span><span class="date-badge">'+escapeHtml(check21)+'</span></div>';
      html += '<div class="row"><span>'+t.milkDry+'</span><span class="date-badge">'+escapeHtml(dryDate)+'</span></div>';
      html += '<div class="row"><span>'+t.deworm+'</span><span class="date-badge">'+escapeHtml(dewormDate)+'</span></div>';
      html += '<div class="row"><span>'+t.trans+'</span><span class="date-badge">'+escapeHtml(transDate)+'</span></div>';

      html += '<div class="due"><span>'+t.delivery+'</span><span class="due-badge">'+escapeHtml(deliveryDate)+'</span></div>';

      if(docName || semenName){
        html += '<div class="note-box">';
        if(docName) html += '<div>💉 <b>डॉक्टर:</b> ' + docName + '</div>';
        if(semenName) html += '<div>🧬 <b>सिमेन:</b> ' + semenName + '</div>';
        html += '</div>';
      }

      html += '<div class="action-btns">';
      if(pDays >= (tot - 20)){
        html += '<button class="btn-calved" type="button" onclick="openDateModal(\'calved\','+safeId+')">'+escapeHtml(t.calvedBtn)+'</button>';
      }
      html += '<button class="btn-repeat" type="button" onclick="openDateModal(\'repeat\','+safeId+')">'+escapeHtml(t.repeatBtn)+'</button>';
      html += '<button class="btn-del" type="button" onclick="delData('+safeId+')">'+escapeHtml(t.delBtn)+'</button>';
      html += '</div>';

    } else {
      const calvedDate = parseISODate(it.calvedDate);
      const cDays = calvedDate ? getDayDifference(calvedDate, today) : 0;
      const restDays = 90;
      
      const heatStart = new Date(calvedDate.getTime());
      heatStart.setDate(heatStart.getDate() + restDays);

      const calvedTitleTxt = lang==='en'?'Calved':(lang==='hi'?'ब्याई है':'वेली आहे');
      const daysCountLbl = lang==='en'?'Days since calving:':(lang==='hi'?'ब्याने के बाद के दिन:':'वेऊन झालेले दिवस:');
      const daysUnitTxt = lang==='en'?' days':(lang==='hi'?' दिन':' दिवस');

      html += '<div class="item-top"><span>'+ animalLabel +' &nbsp; <b>'+safeName+'</b></span>';
      html += '<span class="duration-badge" style="background:#dcfce7; color:#15803d; border-color:#86efac;">🐄 '+calvedTitleTxt+'</span></div>';

      html += '<div class="row"><span>📅 '+daysCountLbl+'</span><span class="date-badge" style="background:#dbeafe; color:#1e40af; border-color:#93c5fd;">'+cDays+daysUnitTxt+'</span></div>';
      html += '<div class="row"><span>'+t.calvedDateLbl+'</span><span class="date-badge">'+escapeHtml(calvedDate ? formatDate(calvedDate) : '---')+'</span></div>';
      html += '<div class="row"><span>'+t.heatWindowText+'</span><span class="date-badge">'+formatDate(heatStart)+'</span></div>';

      if(it.isAssumedCalved){
        html += '<div class="small-assumption-note">'+t.assumedNote+'</div>';
      } else {
        html += '<div class="small-assumption-note">'+t.guidanceNote+'</div>';
      }

      html += '<div class="action-btns" style="flex-wrap:wrap;">';
      html += '<button class="btn-calved" type="button" onclick="openDateModal(\'changeCalve\','+safeId+')">'+escapeHtml(t.changeCalveDateBtn)+'</button>';
      html += '<button class="btn-repeat" type="button" onclick="openDateModal(\'newPregnancy\','+safeId+')">'+escapeHtml(t.setNewDateBtn)+'</button>';
      html += '<button class="btn-del" type="button" onclick="delData('+safeId+')">'+escapeHtml(t.delBtn)+'</button>';
      html += '</div>';
    }

    html += '</div></div>';
  }

  box.innerHTML = html;
  checkSmartNotifications();
}

function checkSmartNotifications(){
  const banner = document.getElementById('notifBannerBox');
  const title = document.getElementById('notifTitleText');
  const list = document.getElementById('notifListContainer');
  if(!banner || !title || !list) return;

  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  title.innerText = t.notifTitle;

  const db = getDB();
  const today = getTodayDate();
  const alerts = [];

  for(let i=0; i<db.length; i++){
    const it = db[i];
    const isBuff = it.type === 'buffalo';
    const animalName = (isBuff ? '🐃' : '🐄') + ' ' + escapeHtml(it.name);
    const animalWord = isBuff ? (lang==='en'?'Buffalo':(lang==='hi'?'भैंस':'म्हैस')) : (lang==='en'?'Cow':(lang==='hi'?'गाय':'गाय'));

    if(it.isCalved){
      const calvedDate = parseISODate(it.calvedDate);
      if(calvedDate){
        const cDay = getDayDifference(calvedDate, today);
        if(cDay === 90){
          let heatMsg = lang==='en' ? ('💡 90 days of rest completed. If ' + animalWord + ' is in heat, check and breed.') : (lang==='hi' ? ('💡 ब्याने के 90 दिन पूरे हो गए हैं। यदि ' + animalWord + ' हीट में है तो जाँच कर गर्भधारण कराएं।') : ('💡 वेऊन ९० दिवस पूर्ण झाले आहेत. आता ' + animalWord + ' माजावर आली असेल तर तपासून भरवून घ्या.'));
          alerts.push({name: animalName, text: heatMsg});
        }
      }
      continue;
    }

    const start = parseISODate(it.date);
    if(!start || start > today) continue;

    const pDay = getDayDifference(start, today);
    const tot = isBuff ? 310 : 282;
    const dry = isBuff ? 220 : 210;
    const dewormDay = tot - 30;

    const deliveryDate = new Date(start.getTime()); deliveryDate.setDate(deliveryDate.getDate() + tot);
    const dryDate = new Date(start.getTime()); dryDate.setDate(dryDate.getDate() + dry);
    const dewormDate = new Date(start.getTime()); dewormDate.setDate(dewormDate.getDate() + dewormDay);

    const daysToDelivery = Math.round((deliveryDate - today) / 86400000);
    const notificationStartDays = isBuff ? 285 : 252;

    if(pDay >= notificationStartDays && pDay <= tot + 9){
      let dayCountText = '';
      if(lang==='en'){
        if(daysToDelivery > 0) dayCountText = '(' + daysToDelivery + ' days remaining)';
        else if(daysToDelivery === 0) dayCountText = '(Expected today)';
        else dayCountText = '(Time has arrived)';
      } else if(lang==='hi'){
        if(daysToDelivery > 0) dayCountText = '(' + daysToDelivery + ' दिन बाकी हैं)';
        else if(daysToDelivery === 0) dayCountText = '(आज अनुमानित समय है)';
        else dayCountText = '(समय आ गया है)';
      } else {
        if(daysToDelivery > 0) dayCountText = '(' + daysToDelivery + ' दिवस बाकी आहेत)';
        else if(daysToDelivery === 0) dayCountText = '(आज अंदाजे वेळ आहे)';
        else dayCountText = '(नुकतीच वेळ झाली आहे)';
      }

      let delNotifTxt = lang==='en' ? ('🍼 ' + animalWord + ' delivery time near ' + dayCountText + '. If calved, update system & click "Calved"!') : (lang==='hi' ? ('🍼 ' + animalWord + ' के ब्याने का समय नजदीक है ' + dayCountText + '. यदि ब्या गई है, तो सिस्टम में अपडेट करें और "ब्याया है" बटन दबाएं!') : ('🍼 ' + animalWord + ' वेवण्याची वेळ जवळ आली आहे ' + dayCountText + '. जर ' + animalWord + ' वेवली असेल, तर लगेच सिस्टीममध्ये अपडेट करा आणि "वेली आहे" हे बटण दाबा!'));

      alerts.push({ name: animalName, text: delNotifTxt });
    }

    if(pDay >= 19 && pDay <= 21){
      let heatTxt = lang==='en' ? (pDay===21 ? 'Today marks 21 days of pregnancy. Check if animal is in heat.' : 'Pregnancy reached ' + pDay + ' days. Prepare for heat check.') : (lang==='hi' ? (pDay===21 ? 'आज गर्भधारण के 21 दिन पूरे हो गए हैं। कृपया जांच करें कि पशु रिपीट हुआ है या नहीं।' : 'गर्भधारण के ' + pDay + ' दिन हो गए हैं। उलट जांच की तैयारी रखें।') : (pDay===21 ? '🔴 आज गाभण राहून २१ दिवस पूर्ण झाले आहेत. कृपया गाय/म्हैस उलटली का ते तपासा.' : '🔴 गाभण राहून ' + pDay + ' दिवस झाले आहेत. उलट तपासणीची तयारी ठेवा.'));
      alerts.push({name: animalName, text: heatTxt});
    }

    const dDiff = getDayDifference(today, dewormDate);
    if(dDiff >= 0 && dDiff <= 3){
      let dewTxt = lang==='en' ? (dDiff===0 ? 'Today is deworming medicine schedule.' : 'Deworming schedule near (' + dDiff + ' days left).') : (lang==='hi' ? (dDiff===0 ? 'आज डिवॉर्मिंग दवा देने का दिन है।' : 'डिवॉर्मिंग दवा का समय नजदीक है (' + dDiff + ' दिन बाकी).') : (dDiff===0 ? '💊 आज वीण्याच्या नेमका महिनाभर आधीची जंतनाशक गोळी/औषध देण्याची वेळ आहे.' : '💊 जंतनाशक औषध देण्याची वेळ जवळ येत आहे ('+dDiff+' दिवस बाकी).'));
      alerts.push({name: animalName, text: dewTxt});
    }

    const dryDiff = getDayDifference(today, dryDate);
    if(dryDiff >= 0 && dryDiff <= 3){
      let dryTxt = lang==='en' ? (dryDiff===0 ? 'Today is dry-off period.' : 'Dry-off period near (' + dryDiff + ' days left).') : (lang==='hi' ? (dryDiff===0 ? 'आज दूध बंद करने का समय है।' : 'दूध बंद करने का समय नजदीक है (' + dryDiff + ' दिन बाकी).') : (dryDiff===0 ? '🥛 आज दूध बंद करण्याची (आटवण्याची) वेळ आली आहे.' : '🥛 दूध आटवण्याची वेळ जवळ येत आहे ('+dryDiff+' दिवस बाकी).'));
      alerts.push({name: animalName, text: dryTxt});
    }
  }

  if(alerts.length === 0){
    banner.style.display = 'none';
    list.innerHTML = '';
    return;
  }

  let html = '';
  for(let i=0; i<alerts.length; i++){
    html += '<div class="notif-item"><div style="font-weight:900; color:#991b1b;">'+alerts[i].name+'</div><div style="color:#c2410c;">'+alerts[i].text+'</div></div>';
  }
  list.innerHTML = html;
  banner.style.display = 'block';
}

function saveData(){
  const dt = document.getElementById('cDate').value;
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  const inputDate = parseISODate(dt);

  if(!inputDate){ alert(t.dateRequired); return; }
  if(inputDate > getTodayDate()){ alert(t.futureDateError); return; }

  const nm = document.getElementById('cName').value.trim() || (cur==='cow' ? t.bCow : t.bBuf);
  const doc = document.getElementById('cDoc').value.trim();
  const semen = document.getElementById('cSemen').value.trim();
  const previewImg = document.getElementById('photoPreview');
  const photo = previewImg.style.display==='block' ? previewImg.src : '';

  const db = getDB();
  db.unshift({ 
    id: Date.now(), 
    name: nm, 
    type: cur, 
    date: dt, 
    doctor: doc,
    semen: semen,
    photo: photo,
    isCalved: false,
    calvedDate: '',
    isAssumedCalved: false
  });

  try{
    localStorage.setItem('cattle_tracker_db', JSON.stringify(db));
  }catch(e){ alert(t.storageError); return; }

  document.getElementById('cName').value = '';
  document.getElementById('cDoc').value = '';
  document.getElementById('cSemen').value = '';
  document.getElementById('cPhoto').value = '';
  previewImg.style.display = 'none';
  setTodayMaxDate();
  draw();
}

function delData(id){
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  if(!confirm(t.confirmDel)) return;
  const db = getDB().filter(item => Number(item.id)!==Number(id));
  localStorage.setItem('cattle_tracker_db', JSON.stringify(db));
  draw();
}

function initApp(){
  let unlocked = false;
  try{ unlocked = localStorage.getItem('cattle_unlocked')==='true'; }catch(e){}
  if(!unlocked){
    document.getElementById('lockScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display = 'none';
    return;
  }
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';

  let savedLang = 'mr';
  try{ savedLang = localStorage.getItem('cattle_lang') || 'mr'; }catch(e){}
  document.getElementById('langSelect').value = savedLang;
  setTodayMaxDate();
  changeLanguage();
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', initApp);
}else{
  initApp();
}
</script>
