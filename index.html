      border-radius: 14px;

    }

    }

    .stats {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }

      flex: 1;

    .stat-number {

    }

    .stat-label {

      color: #64748b;

      margin-top: 2px;
    }

    .card {
      background: white;
      padding: 16px;
      margin-top: 12px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);

    }

    .card h2 {
      margin-top: 0;
      color: #166534;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    }

    }

    .animal-btn.active {

      color: #166534;
    }

    button {
      border: none;
      padding: 14px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }

    .save-btn {

      color: white;
      box-shadow: 0 6px 15px rgba(22,163,74,0.3);

    .record {

      margin-top: 12px;
    }

    .record img {

  /* =========================
     DATABASE
  ========================= */
  const DB_KEY = "cattle_tracker_db";

  function getDB() {
    try {
      return JSON.parse(localStorage.getItem(DB_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveDB(data) {
    localStorage.setItem(DB_KEY, JSON.stringify(data));
  }

  /* =========================
     ANIMAL SELECTION
  ========================= */
  let cur = "cow";

  function selectAnimal(type) {
    cur = type;
    document.getElementById("cowBtn").classList.toggle("active", type === "cow");
    document.getElementById("buffaloBtn").classList.toggle("active", type === "buffalo");
  }

  /* =========================
     DATE FUNCTIONS
  ========================= */
  function dateFromString(str) {
    const parts = String(str).split("-");
    if (parts.length !== 3) {
      return new Date(str);
    }
    return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }

  function dateOnly(date) {
    return new Date(date.getFullYear(), date.getMonth(), date.getDate());
  }

  function daysBetween(date1, date2) {
    const d1 = dateOnly(date1);
    const d2 = dateOnly(date2);
    return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
  }

  function addDaysForReminder(baseDate, days) {
    const d = new Date(baseDate);
    d.setDate(d.getDate() + days);
    return d;
  }

  function formatReminderDate(date) {
    const day = String(date.getDate()).padStart(2, "0");
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const year = date.getFullYear();
    return day + "/" + month + "/" + year;
  }

  /* =========================
     PREGNANCY REMINDER DATA
  ========================= */
  function getReminderData(item) {
    let totalDays = 282;
    let dryDays = 210;

    if (item.type === "buffalo") {
      totalDays = 310;
      dryDays = 240;
    }

    const pregnancyDate = dateFromString(item.date);

    return {
      animal: item,
      heatDate: addDaysForReminder(pregnancyDate, 21),
      dryDate: addDaysForReminder(pregnancyDate, dryDays),
      transitionDate: addDaysForReminder(pregnancyDate, totalDays - 21),
      deliveryDate: addDaysForReminder(pregnancyDate, totalDays)
    };
  }

  /* =========================
     REMINDER CREATOR
  ========================= */
  function addReminder(container, item, date, text, kind, t) {
    const today = dateOnly(new Date());
    const reminderDate = dateOnly(date);
    const diff = daysBetween(today, reminderDate);

    let statusText = t.upcoming;
    let statusClass = "reminder-upcoming";

    if (diff === 0) {
      statusText = t.today;
      statusClass = "reminder-today";
    } else if (diff < 0) {
      statusText = t.overdue;
      statusClass = "reminder-today";
    }

    const emoji = item.type === "buffalo" ? "🐃" : "🐄";
    let finalText = text;

    if (kind === "delivery" && diff > 0) {
      finalText = t.deliverySoon;
    }

    const div = document.createElement("div");
    div.className = "reminder-item";
    div.innerHTML = `
      <div class="reminder-name">
        ${emoji} '${escapeHTML(item.name || "")}'
      </div>
      <div class="reminder-text">
        ${finalText}
      </div>
      <div class="reminder-date ${statusClass}">
        <b>${statusText}</b> • ${formatReminderDate(reminderDate)}
      </div>
    `;
    container.appendChild(div);
  }

  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* =========================
     DRAW REMINDERS
  ========================= */
  function drawReminders() {
    const lang = localStorage.getItem("cattle_lang") || document.getElementById("langSelect").value;
    const t = langData[lang];
    const list = document.getElementById("reminderList");
    if (!list) return;

    list.innerHTML = "";
    const db = getDB();
    const today = dateOnly(new Date());
    let reminderCount = 0;

    db.forEach(function(item) {
      if (!item.date) return;
      const data = getReminderData(item);
      const deliveryDate = dateOnly(data.deliveryDate);

      if (deliveryDate < today) {
        return;
      }

      const reminders = [
        { date: data.heatDate, text: t.heatReminder, kind: "heat" },
        { date: data.dryDate, text: t.dryReminder, kind: "dry" },
        { date: data.transitionDate, text: t.transitionReminder, kind: "transition" },
        { date: data.deliveryDate, text: t.deliveryReminder, kind: "delivery" }
      ];

      reminders.forEach(function(reminder) {
        const diff = daysBetween(today, dateOnly(reminder.date));
        if (diff >= -30 && diff <= 7) {
          addReminder(list, item, reminder.date, reminder.text, reminder.kind, t);
          reminderCount++;
        }
      });
    });

    if (reminderCount === 0) {
      const empty = document.createElement("div");
      empty.className = "reminder-empty";
      empty.textContent = t.noReminder;
      list.appendChild(empty);
    }
  }

  /* =========================
     LANGUAGE
  ========================= */
  function changeLanguage() {
    const lang = document.getElementById("langSelect").value;
    const t = langData[lang];
    localStorage.setItem("cattle_lang", lang);

    document.getElementById("addTitle").textContent = t.addTitle;
    document.getElementById("animalTypeLabel").textContent = t.animalType;
    document.getElementById("cowBtn").textContent = t.cow;
    document.getElementById("buffaloBtn").textContent = t.buffalo;
    document.getElementById("nameLabel").textContent = t.name;
    document.getElementById("dateLabel").textContent = t.date;
    document.getElementById("noteLabel").textContent = t.note;
    document.getElementById("photoLabel").textContent = t.photo;
    document.getElementById("saveBtn").textContent = t.save;
    document.getElementById("recordsTitle").textContent = t.records;
    document.getElementById("cowStat").textContent = "🐄 " + t.cows;
    document.getElementById("buffaloStat").textContent = "🐃 " + t.buffaloes;
    document.getElementById("totalStat").textContent = t.total;
    document.getElementById("reminderTitle").textContent = t.reminderTitle;

    draw();
    drawReminders();
  }

  /* =========================

    const name = document.getElementById("animalName").value.trim();
    const date = document.getElementById("pregnancyDate").value;
    const note = document.getElementById("animalNote").value.trim();
