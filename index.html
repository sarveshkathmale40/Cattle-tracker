/* ==================================================
   DATABASE
================================================== */

function getDB(){

  try{

    const raw =
      localStorage.getItem(
        DB_KEY
      );


    if(!raw){
      return [];
    }


    const data =
      JSON.parse(raw);


    if(!Array.isArray(data)){
      return [];
    }


    return data;

  }catch(error){

    console.error(
      "Database read error:",
      error
    );

    return [];

  }

}


function setDB(data){

  try{

    localStorage.setItem(
      DB_KEY,
      JSON.stringify(data)
    );

    return true;

  }catch(error){

    console.error(
      "Database save error:",
      error
    );

    alert(
      "Data save failed. Browser storage may be full."
    );

    return false;

  }

}


/* ==================================================
   DATE
================================================== */

function todayISO(){

  const d =
    new Date();


  const year =
    d.getFullYear();


  const month =
    String(
      d.getMonth() + 1
    ).padStart(2,"0");


  const day =
    String(
      d.getDate()
    ).padStart(2,"0");


  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


function updateDate(date,days){

  if(!date){
    return "";
  }


  const d =
    new Date(
      date + "T00:00:00"
    );


  d.setDate(
    d.getDate() + days
  );


  const year =
    d.getFullYear();


  const month =
    String(
      d.getMonth() + 1
    ).padStart(2,"0");


  const day =
    String(
      d.getDate()
    ).padStart(2,"0");


  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


function formatDate(date){

  if(!date){
    return "";
  }


  const p =
    date.split("-");


  if(p.length !== 3){
    return date;
  }


  return (
    p[2] +
    "/" +
    p[1] +
    "/" +
    p[0]
  );

}

/* ==================================================
   IMAGE COMPRESSION
================================================== */

function compressImage(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(e){

          const img =
            new Image();


          img.onload =
            function(){

              let width =
                img.width;

              let height =
                img.height;


              const maxSize =
                400;


              if(
                width > maxSize ||
                height > maxSize
              ){

                if(width > height){

                  height =
                    Math.round(
                      height *
                      maxSize /
                      width
                    );

                  width =
                    maxSize;

                }else{

                  width =
                    Math.round(
                      width *
                      maxSize /
                      height
                    );

                  height =
                    maxSize;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.7
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            e.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* ==================================================
   PHOTO PREVIEW
================================================== */

async function previewPhoto(){

  const input =
    document.getElementById(
      "photo"
    );


  const preview =
    document.getElementById(
      "photoPreview"
    );


  if(
    !input.files ||
    !input.files.length
  ){
    return;
  }


  try{

    currentPhoto =
      await compressImage(
        input.files[0]
      );


    preview.innerHTML =
      "";


    const img =
      document.createElement(
        "img"
      );


    img.src =
      currentPhoto;

    img.alt =
      "Animal Photo";


    preview.appendChild(
      img
    );

  }catch(error){

    console.error(
      "Photo error:",
      error
    );

  }

}

/* ==================================================
   SAVE / UPDATE
================================================== */

async function saveData(){

  const name =
    document.getElementById(
      "animalName"
    ).value.trim();


  const pregDate =
    document.getElementById(
      "pregDate"
    ).value;


  const note =
    document.getElementById(
      "note"
    ).value.trim();


  const photoInput =
    document.getElementById(
      "photo"
    );


  if(!pregDate){

    const lang =
      getLang();


    alert(
      lang === "mr"
        ? "कृपया गाभण / AI तारीख निवडा."
        : lang === "hi"
        ? "कृपया गर्भाधान / AI तारीख चुनें।"
        : "Please select Pregnancy / AI date."
    );

    return;
  }


  let photo =
    currentPhoto;


  if(
    photoInput.files &&
    photoInput.files.length
  ){

    try{

      photo =
        await compressImage(
          photoInput.files[0]
        );

    }catch(error){

      console.error(
        "Photo compression error:",
        error
      );

    }

  }


  const db =
    getDB();


  /* =========================
     UPDATE EXISTING RECORD
  ========================= */

  if(editingId !== null){

    const index =
      db.findIndex(
        function(item){

          return (
            String(item.id) ===
            String(editingId)
          );

        }
      );


    if(index !== -1){

      db[index].type =
        cur;


      db[index].name =
        name;


      db[index].pregDate =
        pregDate;


      db[index].note =
        note;


      if(photo){

        db[index].photo =
          photo;

      }


      db[index].updatedAt =
