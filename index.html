<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cattle Tracker - The MH Farmer</title>

<link rel="manifest" href="manifest.json">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#f1f8e9,#fff8e1);
  color:#263238;
}

header{
  background:linear-gradient(135deg,#2e7d32,#66bb6a);
  color:white;
  padding:10px 12px;
  text-align:center;
  position:relative;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.brand-title{
  font-size:14px;
  font-weight:bold;
  margin-bottom:2px;
}

header h1{
  margin:0;
  font-size:23px;
}

.language-box{
  position:absolute;
  right:8px;
  top:8px;
}

#language{
  width:92px;
  padding:4px 5px;
  border:0;
  border-radius:7px;
  font-size:11px;
  background:white;
  color:#222;
  cursor:pointer;
}

.container{
  max-width:700px;
  margin:auto;
  padding:8px;
}

.card{
  background:white;
  border-radius:12px;
  padding:10px;
  margin-bottom:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h2{
  margin:0 0 7px;
  font-size:16px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.stat{
  text-align:center;
  padding:8px 4px;
  border-radius:9px;
  background:#f5f5f5;
  font-size:12px;
  border-top:3px solid #43a047;
}

.stat:nth-child(2){
  border-top-color:#fb8c00;
}

.stat:nth-child(3){
  border-top-color:#1e88e5;
}

.stat strong{
  display:block;
  font-size:19px;
  margin-top:2px;
}

.animal-buttons{
  display:flex;
  gap:7px;
}

.animal-btn{
  flex:1;
  border:2px solid #ddd;
  background:#fafafa;
  padding:8px;
  border-radius:9px;
  font-size:14px;
  cursor:pointer;
}

.animal-btn.active{
  background:#e8f5e9;
  border-color:#43a047;
  font-weight:bold;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin:6px 0 3px;
}

input,
textarea{
  width:100%;
  padding:8px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:13px;
}

textarea{
  min-height:55px;
  resize:vertical;
}

.main-btn{
  width:100%;
  margin-top:8px;
  padding:9px;
  border:0;
  border-radius:8px;
  background:#2e7d32;
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.main-btn.update{
  background:#1565c0;
}

.photo-preview{
  margin-top:6px;
  text-align:center;
}

.photo-preview img{
  max-width:120px;
  max-height:120px;
  border-radius:8px;
  border:1px solid #ccc;
}

.reminders{
  background:#fffde7;
  border-left:4px solid #f9a825;
  padding:7px;
}

.reminder{
  padding:7px 8px;
  border-radius:7px;
  margin-bottom:5px;
  background:#fff3e0;
  font-size:12px;
  line-height:1.35;
}

.reminder:last-child{
  margin-bottom:0;
}

.reminder.today{
  background:#ffebee;
  border-left:4px solid #e53935;
}

.reminder.tomorrow{
  background:#e3f2fd;
  border-left:4px solid #1e88e5;
}

.reminder strong{
  display:block;
  font-size:13px;
  margin-bottom:2px;
}

.record{
  border:1px solid #ddd;
  border-radius:9px;
  padding:8px;
  margin-bottom:7px;
  background:#fff;
}

.record-head{
  display:flex;
  justify-content:space-between;
  gap:7px;
  align-items:flex-start;
}

.record-name{
  font-weight:bold;
  font-size:14px;
}

.record-date{
  font-size:11px;
  color:#666;
  margin-top:3px;
}

.record-note{
  font-size:12px;
  margin-top:5px;
  white-space:pre-wrap;
}

.record img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:7px;
  border:1px solid #ddd;
}

.actions{
  display:flex;
  gap:5px;
  margin-top:7px;
}

.action-btn{
  flex:1;
  border:0;
  padding:7px 5px;
  border-radius:7px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.repeat-btn{
  background:#e3f2fd;
  color:#1565c0;
}

.delete-btn{
  background:#ffebee;
  color:#c62828;
}

.empty{
  text-align:center;
  color:#777;
  padding:12px 5px;
  font-size:12px;
}

.editing-info{
  display:none;
  background:#e3f2fd;
  color:#1565c0;
  padding:6px 8px;
  border-radius:7px;
  font-size:11px;
  margin-top:7px;
}

.editing-info.show{
  display:block;
}
</style>
</head>

<body>

<header>

  <div class="brand-title">
    🌾 The MH Farmer
  </div>

  <h1>
    🐄 Cattle Tracker
  </h1>

  <div class="language-box">
    <select id="language">
      <option value="mr">मराठी</option>
      <option value="hi">हिन्दी</option>
      <option value="en">English</option>
    </select>
  </div>

</header>


<div class="container">

  <!-- REMINDERS -->
  <div class="card reminders">

    <h2 id="reminderTitle">
      🔔 आजच्या सूचना
    </h2>

    <div id="reminders"></div>

  </div>


  <!-- STATS -->
  <div class="card">

    <div class="stats">

      <div class="stat">
        🐄 <span id="cowStat">गाय</span>
        <strong id="cowCount">0</strong>
      </div>

      <div class="stat">
        🐃 <span id="buffaloStat">म्हैस</span>
        <strong id="buffaloCount">0</strong>
      </div>

      <div class="stat">
        📋 <span id="totalStat">एकूण</span>
        <strong id="totalCount">0</strong>
      </div>

    </div>

  </div>


  <!-- FORM -->
  <div class="card">

    <h2 id="formTitle">
      🐄 नवीन जनावर नोंद
    </h2>

    <div class="animal-buttons">

      <button
        type="button"
        class="animal-btn active"
        id="cowBtn">
        🐄 गाय
      </button>

      <button
        type="button"
        class="animal-btn"
        id="buffaloBtn">
        🐃 म्हैस
      </button>

    </div>


    <label id="nameLabel">
      जनावराचे नाव
    </label>

    <input
      type="text"
      id="animalName"
      placeholder="उदा. सरू"
    >


    <label id="dateLabel">
      गाभण / AI तारीख
    </label>

    <input
      type="date"
      id="pregDate"
    >


    <label id="noteLabel">
      नोंद
    </label>

    <textarea
      id="note"
      placeholder="इतर माहिती..."
    ></textarea>


    <label id="photoLabel">
      फोटो
    </label>

    <input
      type="file"
      id="photo"
      accept="image/*"
    >


    <div
      class="photo-preview"
      id="photoPreview">
    </div>


    <div
      class="editing-info"
      id="editingInfo">
    </div>


    <button
      type="button"
      class="main-btn"
      id="saveBtn">

      💾 माहिती सेव्ह करा

    </button>

  </div>


  <!-- RECORDS -->
  <div class="card">

    <h2 id="recordsTitle">
      📋 Animal Records
    </h2>

    <div id="records"></div>

  </div>

</div>


<!-- MAIN JAVASCRIPT -->
<script src="app.js"></script>

</body>
</html>
