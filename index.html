<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#15803d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The MH Farmer">

<link rel="manifest" href="manifest.json">
<title>The MH Farmer</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:linear-gradient(135deg,#ecfdf5 0%,#f0fdf4 50%,#f8fafc 100%);
  min-height:100vh;
  padding:10px;
  color:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
}

.wrap{
  width:100%;
  max-width:420px;
  margin:0 auto;
}

/* Lock Screen */
#lockScreen{
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:90vh;
}

.lock-card{
  background:white;
  border-radius:24px;
  padding:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  border:1px solid #e2e8f0;
  text-align:center;
}

.lock-title{
  font-size:22px;
  font-weight:900;
  color:#15803d;
  margin-bottom:6px;
}

.lock-sub{
  font-size:12px;
  color:#64748b;
  margin-bottom:20px;
  font-weight:600;
  line-height:1.4;
}

/* 3D Attractive Header */
.app-header{
  background:linear-gradient(135deg,#15803d 0%,#16a34a 50%,#22c55e 100%);
  border-radius:22px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 10px 25px -5px rgba(22,163,74,.4), inset 0 2px 4px rgba(255,255,255,.3);
  text-align:center;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:white;
  border:2px solid #14532d;
}

.header-title{
  font-size:22px;
  font-weight:900;
  letter-spacing:.5px;
  text-shadow:0 3px 6px rgba(0,0,0,.2);
  background:linear-gradient(to right, #ffffff, #dcfce7);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.header-sub{
  font-size:11px;
  color:#bbf7d0;
  margin-top:2px;
  font-weight:800;
  letter-spacing:.8px;
  text-transform:uppercase;
}

/* Custom Install PWA Button */
.install-bar{
  display:none;
  background:linear-gradient(135deg,#059669 0%,#10b981 100%);
  color:white;
  padding:10px 14px;
  border-radius:14px;
  margin-bottom:12px;
  text-align:center;
  box-shadow:0 6px 15px rgba(16,185,129,.3);
  font-size:13px;
  font-weight:800;
  border:none;
  width:100%;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

/* Language */
#langSelect{
  background:rgba(255,255,255,.25);
  color:white;
  border:1px solid rgba(255,255,255,.5);
  border-radius:10px;
  padding:6px 10px;
  font-size:12px;
  font-weight:bold;
  outline:none;
  cursor:pointer;
}

#langSelect option{
  background:#15803d;
  color:white;
}

/* Notifications */
.notification-banner{
  background:linear-gradient(135deg,#fff7ed 0%,#ffedd5 100%);
  border:2px solid #fdba74;
  border-radius:16px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 6px 20px rgba(194,65,12,.15);
}

.notif-title{
  font-size:13px;
  font-weight:900;
  color:#c2410c;
  margin-bottom:6px;
  display:flex;
  align-items:center;
  gap:6px;
}

.notif-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.notif-item{
  background:white;
  border-radius:10px;
  padding:8px 10px;
  font-size:11.5px;
  color:#7c2d12;
  font-weight:600;
  border:1.5px solid #fed7aa;
  line-height:1.4;
  border-left:4px solid #ea580c;
}

/* 3D Colorful Stats Cards */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}

.stat{
  background:linear-gradient(135deg,#ffffff 0%,#f8fafc 100%);
  padding:10px 6px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 6px 15px rgba(0,0,0,.05), inset 0 2px 3px rgba(255,255,255,.8);
  border:2px solid #e2e8f0;
  transition:transform .2s;
}

.stat:hover{
  transform:translateY(-2px);
}

.stat-number{
  font-size:18px;
  font-weight:900;
  color:#15803d;
}

.stat-label{
  font-size:10.5px;
  color:#64748b;
  font-weight:800;
  margin-top:1px;
}

/* Compact & Colorful Main Card */
.card{
  background:white;
  border-radius:20px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.05);
  border:2px solid #e2e8f0;
}

.card h3{
  font-size:15px;
  margin-bottom:10px;
  color:#15803d;
  font-weight:900;
  display:flex;
  align-items:center;
  gap:6px;
  text-transform:uppercase;
  letter-spacing:.3px;
}

/* Inputs & Labels (Compact Vertical Spacing) */
label{
  display:block;
  text-align:left;
  font-size:10.5px;
  font-weight:800;
  color:#475569;
  margin-bottom:4px;
  margin-left:2px;
}

input,select,textarea{
  width:100%;
  padding:10px 12px;
  border:2px solid #cbd5e1;
  border-radius:12px;
  font-size:14px;
  outline:none;
  background:#f8fafc;
  margin-bottom:8px;
  font-weight:700;
  font-family:inherit;
  transition:all .2s;
}

input:focus,select:focus,textarea:focus{
  border-color:#16a34a;
  background:white;
  box-shadow:0 0 0 3px rgba(22,163,74,.15);
}

textarea{
  height:55px;
  resize:none;
}

/* 3D Animal Buttons */
.animal-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:10px;
}

.animal-btn{
  border:2px solid #cbd5e1;
  background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%);
  padding:10px 6px;
  border-radius:12px;
  cursor:pointer;
  font-weight:900;
  color:#64748b;
  text-align:center;
  font-size:13px;
  box-shadow:0 4px 10px rgba(0,0,0,.04), inset 0 1px 2px rgba(255,255,255,.8);
  transition:all .2s;
}

.animal-btn.active{
  border-color:#15803d;
  background:linear-gradient(135deg,#dcfce7 0%,#bbf7d0 100%);
  color:#14532d;
  box-shadow:0 6px 15px rgba(22,163,74,.25), inset 0 2px 4px rgba(255,255,255,.6);
  transform:translateY(-1px);
}

/* 3D Main Save Button */
.btn{
  width:100%;
  background:linear-gradient(135deg,#16a34a 0%,#15803d 50%,#14532d 100%);
  color:white;
  border:2px solid #14532d;
  padding:12px;
  border-radius:12px;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
  margin-top:4px;
  box-shadow:0 6px 18px rgba(22,163,74,.35), inset 0 2px 4px rgba(255,255,255,.3);
  transition:all .2s;
  letter-spacing:.3px;
}

.btn:active{
  transform:scale(.98);
  box-shadow:0 2px 8px rgba(22,163,74,.3);
}

/* Photo Preview with Elegant 3D Border Frame */
.photo-preview{
  width:65px;
  height:65px;
  border-radius:14px;
  object-fit:cover;
  display:none;
  margin:4px auto 8px;
  border:3px solid #16a34a;
  box-shadow:0 6px 15px rgba(22,163,74,.25);
  cursor:pointer;
}

/* Records Item */
.item{
  background:linear-gradient(135deg,#ffffff 0%,#f8fafc 100%);
  border-radius:16px;
  padding:12px;
  border:2px solid #e2e8f0;
  margin-bottom:10px;
  display:flex;
  gap:10px;
  align-items:flex-start;
  box-shadow:0 4px 15px rgba(0,0,0,.03);
}

/* 3D Cow Photo Thumbnail Frame */
.cow-img{
  width:72px;
  height:72px;
  border-radius:14px;
  background:#e2e8f0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:32px;
  flex-shrink:0;
  overflow:hidden;
  border:3px solid #15803d;
  box-shadow:0 6px 15px rgba(21,128,61,.25), inset 0 2px 3px rgba(255,255,255,.5);
  cursor:pointer;
}

.cow-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .2s;
}

.item-info{
  flex-grow:1;
  min-width:0;
}

.item-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:4px;
  font-weight:900;
  font-size:12.5px;
  border-bottom:2px solid #f1f5f9;
  padding-bottom:5px;
  margin-bottom:5px;
  color:#1e293b;
}

.duration-badge{
  background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);
  color:#1d4ed8;
  font-weight:900;
  font-size:11px;
  padding:3px 8px;
  border-radius:8px;
  border:1.5px solid #93c5fd;
  box-shadow:0 2px 5px rgba(29,78,216,.1);
  white-space:nowrap;
}

/* Rows */
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:4px;
  font-size:11px;
  padding:5px 0;
  color:#334155;
  font-weight:700;
  border-bottom:1px dashed #e2e8f0;
}

.row span:first-child{
  flex:1;
  line-height:1.3;
}

/* Date Badge */
.date-badge{
  background:linear-gradient(135deg,#fef08a 0%,#fde047 100%);
  color:#78350f;
  padding:2px 7px;
  border-radius:6px;
  font-size:10.5px;
  font-weight:900;
  border:1.5px solid #ca8a04;
  text-align:right;
  width:90px;
  flex-shrink:0;
  box-shadow:0 2px 4px rgba(202,138,4,.15);
}

/* Delivery */
.due{
  background:linear-gradient(135deg,#dcfce7 0%,#bbf7d0 100%);
  padding:6px 8px;
  border-radius:10px;
  color:#14532d;
  font-weight:900;
  margin-top:6px;
  font-size:11.5px;
  border:1.5px solid #22c55e;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 6px rgba(34,197,94,.15);
}

.due span:first-child{
  flex:1;
}

.due-badge{
  background:#15803d;
  color:white;
  padding:2px 7px;
  border-radius:6px;
  font-size:11px;
  font-weight:900;
  text-align:right;
  width:90px;
  flex-shrink:0;
  border:1.5px solid #14532d;
  box-shadow:0 1px 3px rgba(0,0,0,.1);
}

.note-box{
  background:linear-gradient(135deg,#fef3c7 0%,#fde68a 100%);
  border:1.5px solid #f59e0b;
  border-radius:8px;
  padding:5px 7px;
  font-size:11px;
  color:#92400e;
  margin-top:5px;
  font-weight:700;
  box-shadow:0 2px 4px rgba(245,158,11,.1);
}

/* 3D Action Buttons */
.action-btns{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.btn-repeat{
  flex:2;
  background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);
  color:#1d4ed8;
  border:2px solid #3b82f6;
  padding:7px 8px;
  border-radius:10px;
  font-weight:900;
  font-size:11px;
  cursor:pointer;
  text-align:center;
  box-shadow:0 4px 10px rgba(59,130,246,.25), inset 0 1px 2px rgba(255,255,255,.8);
}

.btn-calved{
  flex:2;
  background:linear-gradient(135deg,#dcfce7 0%,#bbf7d0 100%);
  color:#14532d;
  border:2px solid #22c55e;
  padding:7px 8px;
  border-radius:10px;
  font-weight:900;
  font-size:11px;
  cursor:pointer;
  text-align:center;
  box-shadow:0 4px 10px rgba(34,197,94,.25), inset 0 1px 2px rgba(255,255,255,.8);
}

.btn-del{
  flex:1;
  background:linear-gradient(135deg,#fee2e2 0%,#fecaca 100%);
  color:#991b1b;
  border:2px solid #ef4444;
  padding:7px 6px;
  border-radius:10px;
  font-weight:900;
  font-size:11px;
  cursor:pointer;
  text-align:center;
  box-shadow:0 4px 10px rgba(239,68,68,.25), inset 0 1px 2px rgba(255,255,255,.8);
}

.empty{
  text-align:center;
  color:#94a3b8;
  font-size:12px;
  padding:20px;
  font-weight:700;
}

/* Modal Date Picker Box */
.date-modal{
  display:none;
  position:fixed;
  top:0; left:0; width:100vw; height:100vh;
  background:rgba(0,0,0,0.6);
  z-index:99999;
  justify-content:center;
  align-items:center;
  padding:16px;
  backdrop-filter:blur(3px);
}
.date-modal-card{
  background:white;
  padding:20px;
  border-radius:20px;
  width:100%;
  max-width:320px;
  box-shadow:0 15px 35px rgba(0,0,0,0.25);
  text-align:center;
  border:2px solid #16a34a;
}
.date-modal-card h4{
  font-size:15px;
  color:#15803d;
  margin-bottom:12px;
  font-weight:900;
}

/* Image Zoom Lightbox Modal */
#imageZoomModal{
  display:none;
  position:fixed;
  z-index:99999;
  top:0; left:0; width:100vw; height:100vh;
  background:rgba(0,0,0,0.92);
  justify-content:center;
  align-items:center;
  flex-direction:column;
  padding:16px;
}
#zoomedImage{
  max-width:95%; max-height:80%; object-fit:contain; border-radius:14px; border:2px solid #22c55e;
}
.modal-close-btn{
  position:absolute; top:20px; right:20px; color:white; font-size:32px; font-weight:bold;
  background:rgba(255,255,255,0.2); width:44px; height:44px; border-radius:50%;
  display:flex; justify-content:center; align-items:center; cursor:pointer;
}
</style>
</head>

<body>

<div class="wrap">

  <!-- LOCK SCREEN -->
  <div id="lockScreen" style="display:none;">
    <div class="lock-card">
      <div class="lock-title">🔐 The MH Farmer</div>
      <div class="lock-sub" id="lockSubTxt">ॲप वापरण्यासाठी तुमचा मोबाईल नंबर आणि पिन प्रविष्ट करा</div>
      <label id="lblMob">मोबाईल नंबर (१० अंकी)</label>
      <input type="tel" id="loginMob" maxlength="10" inputmode="numeric">
      <label id="lblPin">सिक्रेट पिन (PIN)</label>
      <input type="password" id="loginPin" maxlength="4" inputmode="numeric">
      <button class="btn" type="button" id="btnLogin" onclick="verifyLogin()">ॲप सुरू करा 🚀</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appScreen" style="display:none;">

    <!-- 3D Header -->
    <div class="app-header">
      <div style="text-align:left;">
        <div class="header-title">🌾 The MH Farmer</div>
        <div class="header-sub" id="mainHeaderSub">Cattle Pregnancy Tracker</div>
      </div>
      <div>
        <select id="langSelect" onchange="changeLanguage()">
          <option value="mr">मराठी</option>
          <option value="hi">हिंदी</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <button id="pwaInstallBtn" class="install-bar" type="button" onclick="installPWA()" style="display:none;">
      <span>📲 ॲप फोनमध्ये इन्स्टॉल करा</span>
    </button>

    <div id="notifBannerBox" class="notification-banner" style="display:none;">
      <div class="notif-title" id="notifTitleText">🔔 महत्त्वाचे अलर्ट्स</div>
      <div id="notifListContainer" class="notif-list"></div>
    </div>

    <!-- 3D Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-number" id="totalCount">0</div>
        <div class="stat-label" id="lblTotal">एकूण</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="cowCount">0</div>
        <div class="stat-label" id="lblCow">गाय</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="buffaloCount">0</div>
        <div class="stat-label" id="lblBuf">म्हैस</div>
      </div>
    </div>

    <!-- Compact Form -->
    <div class="card">
      <h3 id="formTitle">➕ नवीन पशु नोंद</h3>
      
      <div class="animal-buttons">
        <button class="animal-btn active" id="cowBtn" type="button" onclick="selectAnimal('cow')">🐄 <span id="btnCowTxt">गाय</span></button>
        <button class="animal-btn" id="buffaloBtn" type="button" onclick="selectAnimal('buffalo')">🐃 <span id="btnBufTxt">म्हैस</span></button>
      </div>

      <label id="lblNameLbl">पशुचे नाव / ओळख</label>
      <input type="text" id="cName" placeholder="उदा. कावेरी">

      <label id="lblDate">गाय गाभण राहिल्याची तारीख</label>
      <input type="date" id="cDate">

      <label id="lblNoteLbl">डॉक्टर / सिमेन तपशील (पर्यायी)</label>
      <textarea id="cNote" placeholder="उदा. डॉक्टरचे नाव, सिमेन ब्रँड"></textarea>

      <label id="lblPhotoLbl">पशुचा फोटो (पर्यायी)</label>
      <input type="file" id="cPhoto" accept="image/*" onchange="previewPhoto()">
      <img id="photoPreview" class="photo-preview" alt="Preview" onclick="openImageModal(this.src)">

      <button class="btn" id="btnSave" type="button" onclick="saveData()">💾 नोंद जतन करा</button>
    </div>

    <div class="card">
      <h3 id="listTitle">📋 माझ्या पशुंच्या नोंदी</h3>
      <div id="list"></div>
    </div>

  </div>

</div>

<!-- Custom Calendar Date Picker Modal -->
<div id="customDateModal" class="date-modal">
  <div class="date-modal-card">
    <h4 id="modalTitleText">तारीख निवडा</h4>
    <input type="date" id="modalDateInput" style="margin-bottom:12px;">
    <button class="btn" type="button" onclick="submitModalDate()">✅ ओके</button>
    <button class="btn" type="button" style="background:#64748b; margin-top:6px;" onclick="closeDateModal()">रद्द करा</button>
  </div>
</div>

<!-- Image Zoom Lightbox Modal -->
<div id="imageZoomModal" onclick="closeImageModal()">
  <div class="modal-close-btn" onclick="closeImageModal()">&times;</div>
  <img id="zoomedImage" src="" alt="Zoomed Photo" onclick="event.stopPropagation()">
</div>

<script>
'use strict';

let deferredPrompt = null;
const pwaBtn = document.getElementById('pwaInstallBtn');

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  if(pwaBtn && !window.matchMedia('(display-mode: standalone)').matches){
    pwaBtn.style.display = 'flex';
  }
});

function installPWA(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){ deferredPrompt = null; if(pwaBtn) pwaBtn.style.display = 'none'; });
  }
}

function openImageModal(src){
  if(!src) return;
  document.getElementById('zoomedImage').src = src;
  document.getElementById('imageZoomModal').style.display = 'flex';
}

function closeImageModal(){
  document.getElementById('imageZoomModal').style.display = 'none';
}

let cur = 'cow';
let activeActionId = null;
let activeActionType = null;

function selectAnimal(type){
  cur = type==='buffalo' ? 'buffalo' : 'cow';
  document.getElementById('cowBtn').classList.toggle('active', cur==='cow');
  document.getElementById('buffaloBtn').classList.toggle('active', cur==='buffalo');

  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  document.getElementById('lblDate').innerText = cur==='buffalo' ? t.dtLblBuf : t.dtLblCow;
}

function openDateModal(type, id){
  activeActionType = type;
  activeActionId = id;
  const modal = document.getElementById('customDateModal');
  const input = document.getElementById('modalDateInput');
  const title = document.getElementById('modalTitleText');
  
  const now = new Date();
  input.value = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  input.max = input.value;

  const db = getDB();
  let animalType = 'गाय';
  for(let i=0; i<db.length; i++){
    if(Number(db[i].id) === Number(id)){
      animalType = (db[i].type === 'buffalo') ? 'म्हैस' : 'गाय';
      break;
    }
  }

  if(type === 'repeat') title.innerText = animalType + ' उलटल्यामुळे नवीन गाभण तारीख निवडा:';
  else if(type === 'calved') title.innerText = animalType + ' वेवल्याची अचूक तारीख टाका:';
  else if(type === 'newPregnancy') title.innerText = 'नवीन ' + animalType + ' लावल्याची तारीख टाका:';
  else if(type === 'changeCalve') title.innerText = animalType + ' वेवल्याची अचूक तारीख बदला:';

  modal.style.display = 'flex';
}

function closeDateModal(){
  document.getElementById('customDateModal').style.display = 'none';
  activeActionId = null;
  activeActionType = null;
}

function submitModalDate(){
  const val = document.getElementById('modalDateInput').value;
  if(!val){ alert('कृपया तारीख निवडा!'); return; }
  const parsed = parseISODate(val);
  if(!parsed || parsed > getTodayDate()){ alert('भविष्यातील तारीख चालणार नाही!'); return; }

  const db = getDB();
  for(let i=0; i<db.length; i++){
    if(Number(db[i].id) === Number(activeActionId)){
      let animalName = db[i].type === 'buffalo' ? 'म्हैस' : 'गाय';
      if(activeActionType === 'repeat' || activeActionType === 'newPregnancy'){
        db[i].date = val;
        db[i].isCalved = false;
        db[i].calvedDate = '';
        const newNote = prompt("नवीन डॉक्टर / सिमेन तपशील टाका (किंवा तसेच ठेवा):", db[i].note || "");
        if(newNote !== null) db[i].note = newNote.trim();
      } else if(activeActionType === 'calved' || activeActionType === 'changeCalve'){
        db[i].isCalved = true;
        db[i].calvedDate = val;
      }
      break;
    }
  }

  localStorage.setItem('cattle_tracker_db', JSON.stringify(db));
  closeDateModal();
  draw();
}

function compressImage(file, callback){
  if(!file || !file.type || file.type.indexOf('image/')!==0){ callback(''); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if(w > 500){ h = h * (500 / w); w = 500; }
      if(h > 500){ w = w * (500 / h); h = 500; }
      canvas.width = Math.round(w); canvas.height = Math.round(h);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = function(){ callback(''); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function previewPhoto(){
  const input = document.getElementById('cPhoto');
  const preview = document.getElementById('photoPreview');
  if(input.files && input.files[0]){
    compressImage(input.files[0], function(res){
      if(res){ preview.src = res; preview.style.display = 'block'; }
      else { preview.removeAttribute('src'); preview.style.display = 'none'; }
    });
  }
}

function parseISODate(str){
  if(typeof str!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(str)) return null;
  const p = str.split('-').map(Number);
  const d = new Date(p[0], p[1]-1, p[2]);
  if(d.getFullYear()!==p[0] || d.getMonth()!==p[1]-1 || d.getDate()!==p[2]) return null;
  d.setHours(0,0,0,0);
  return d;
}

function getTodayDate(){
  const d = new Date(); d.setHours(0,0,0,0); return d;
}

function getDayDifference(start, end){
  return Math.round((end - start)/86400000);
}

function formatDate(d){
  return String(d.getDate()).padStart(2,'0') + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + d.getFullYear();
}

function addD(str, days){
  const d = parseISODate(str);
  if(!d) return '---';
  d.setDate(d.getDate() + Number(days||0));
  return formatDate(d);
}

function getFormattedDuration(str, lang){
  const start = parseISODate(str);
  if(!start) return '0 दिवस';
  const now = getTodayDate();
  if(now < start) return '0 दिवस';
  const yrs = now.getFullYear() - start.getFullYear();
  let m = now.getMonth() - start.getMonth() + (yrs*12);
  let d = now.getDate() - start.getDate();
  if(d < 0){ m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if(m < 0){ m = 0; d = 0; }

  if(lang==='en') return m + ' mos ' + d + ' days';
  if(lang==='hi') return m + ' महीने ' + d + ' दिन';
  return m + ' महिना ' + d + ' दिवस';
}

function escapeHtml(val){
  return String(val==null ? '' : val).replace(/[&<>'"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c];
  });
}

function draw(){
  const box = document.getElementById('list');
  if(!box) return;
  const db = getDB();
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;

  let cows = 0, buffaloes = 0;

  for(let i=0; i<db.length; i++){
    const it = db[i];
    if(it.type==='cow') cows++;
    if(it.type==='buffalo') buffaloes++;
  }

  document.getElementById('totalCount').innerText = db.length;
  document.getElementById('cowCount').innerText = cows;
  document.getElementById('buffaloCount').innerText = buffaloes;

  if(db.length === 0){
    box.innerHTML = '<div class="empty">' + escapeHtml(t.empty) + '</div>';
    checkSmartNotifications();
    return;
  }

  let html = '';
  const today = getTodayDate();

  for(let i=0; i<db.length; i++){
    const it = db[i];
    const isBuffalo = it.type==='buffalo';
    const tot = isBuffalo ? 310 : 282;
    const start = parseISODate(it.date);

    const imgHtml = it.photo ? '<img src="'+escapeHtml(it.photo)+'" onclick="openImageModal(\''+escapeHtml(it.photo)+'\')">' : (isBuffalo ? '🐃' : '🐄');
    const safeName = escapeHtml(it.name);
    const safeNote = escapeHtml(it.note || '').trim();
    const animalLabel = isBuffalo ? '🐃 ' + t.buf : '🐄 ' + t.cow;
    const safeId = Number(it.id);

    html += '<div class="item">';
    html += '<div class="cow-img">'+imgHtml+'</div>';
    html += '<div class="item-info">';

    if(!it.isCalved){
      const pDays = start ? getDayDifference(start, today) : 0;
      const dry = isBuffalo ? 235 : 210;
      const dewormDay = tot - 30;

      const check21 = addD(it.date, 21);
      const dryDate = addD(it.date, dry);
      const dewormDate = addD(it.date, dewormDay);
      const transDate = addD(it.date, tot-21);
      const deliveryDate = addD(it.date, tot);

      html += '<div class="item-top"><span>'+ animalLabel +' &nbsp; <b>'+safeName+'</b></span>';
      html += '<span class="duration-badge">⏱️ '+escapeHtml(getFormattedDuration(it.date, lang))+'</span></div>';

      html += '<div class="row"><span>📅 '+(isBuffalo?t.dtLblBuf:t.dtLblCow)+'</span><span class="date-badge">'+escapeHtml(start ? formatDate(start) : '---')+'</span></div>';
      html += '<div class="row"><span>'+t.chk21+'</span><span class="date-badge">'+escapeHtml(check21)+'</span></div>';
      html += '<div class="row"><span>'+t.milkDry+'</span><span class="date-badge">'+escapeHtml(dryDate)+'</span></div>';
      html += '<div class="row"><span>'+t.deworm+'</span><span class="date-badge">'+escapeHtml(dewormDate)+'</span></div>';
      html += '<div class="row"><span>'+t.trans+'</span><span class="date-badge">'+escapeHtml(transDate)+'</span></div>';

      html += '<div class="due"><span>'+t.delivery+'</span><span class="due-badge">'+escapeHtml(deliveryDate)+'</span></div>';

      if(safeNote && safeNote.toLowerCase() !== 'undefined' && safeNote !== ''){
        html += '<div class="note-box">💉 <b>डॉक्टर/सिमेन:</b> ' + safeNote + '</div>';
      }

      html += '<div class="action-btns">';
      if(pDays >= 265){
        html += '<button class="btn-calved" type="button" onclick="openDateModal(\'calved\','+safeId+')">'+escapeHtml(t.calvedBtn)+'</button>';
      }
      html += '<button class="btn-repeat" type="button" onclick="openDateModal(\'repeat\','+safeId+')">'+escapeHtml(t.repeatBtn)+'</button>';
      html += '<button class="btn-del" type="button" onclick="delData('+safeId+')">'+escapeHtml(t.delBtn)+'</button>';
      html += '</div>';

    } else {
      const calvedDate = parseISODate(it.calvedDate);
      const cDays = calvedDate ? getDayDifference(calvedDate, today) : 0;
      const restDays = 90;
      
      const heatStart = new Date(calvedDate.getTime());
      heatStart.setDate(heatStart.getDate() + restDays);

      html += '<div class="item-top"><span>'+ animalLabel +' &nbsp; <b>'+safeName+'</b></span>';
      html += '<span class="duration-badge" style="background:#dcfce7; color:#15803d; border-color:#86efac;">🐄 वेली आहे</span></div>';

      html += '<div class="row"><span>📅 वेऊन झालेले दिवस</span><span class="date-badge" style="background:#dbeafe; color:#1e40af; border-color:#93c5fd;">'+cDays+' दिवस</span></div>';
      html += '<div class="row"><span>'+t.calvedDateLbl+'</span><span class="date-badge">'+escapeHtml(calvedDate ? formatDate(calvedDate) : '---')+'</span></div>';
      html += '<div class="row"><span>'+t.heatWindowText+'</span><span class="date-badge">'+formatDate(heatStart)+'</span></div>';

      html += '<div class="action-btns" style="flex-wrap:wrap;">';
      html += '<button class="btn-calved" style="flex:1;" type="button" onclick="openDateModal(\'changeCalve\','+safeId+')">'+escapeHtml(t.changeCalveDateBtn)+'</button>';
      html += '<button class="btn-repeat" style="flex:1;" type="button" onclick="openDateModal(\'newPregnancy\','+safeId+')">'+escapeHtml(t.setNewDateBtn)+'</button>';
      html += '<button class="btn-del" style="flex:0 0 auto;" type="button" onclick="delData('+safeId+')">'+escapeHtml(t.delBtn)+'</button>';
      html += '</div>';
    }

    html += '</div></div>';
  }

  box.innerHTML = html;
  checkSmartNotifications();
}

function checkSmartNotifications(){
  const banner = document.getElementById('notifBannerBox');
  const title = document.getElementById('notifTitleText');
  const list = document.getElementById('notifListContainer');
  if(!banner || !title || !list) return;

  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  title.innerText = t.notifTitle;

  const db = getDB();
  const today = getTodayDate();
  const alerts = [];

  for(let i=0; i<db.length; i++){
    const it = db[i];
    const isBuff = it.type === 'buffalo';
    const animalName = (isBuff ? '🐃' : '🐄') + ' ' + escapeHtml(it.name);
    const animalWord = isBuff ? 'म्हैस' : 'गाय';

    if(it.isCalved){
      const calvedDate = parseISODate(it.calvedDate);
      if(calvedDate){
        const cDay = getDayDifference(calvedDate, today);
        if(cDay === 90){
          alerts.push({name: animalName, text: '💡 वेऊन ९० दिवस पूर्ण झाले आहेत. आता ' + animalWord + ' माजावर आली असेल तर तपासून भरवून घ्या.'});
        }
      }
      continue;
    }

    const start = parseISODate(it.date);
    if(!start || start > today) continue;

    const pDay = getDayDifference(start, today);
    const tot = isBuff ? 310 : 282;
    const dry = isBuff ? 235 : 210;
    const dewormDay = tot - 30;

    const deliveryDate = new Date(start.getTime()); deliveryDate.setDate(deliveryDate.getDate() + tot);
    const dryDate = new Date(start.getTime()); dryDate.setDate(dryDate.getDate() + dry);
    const dewormDate = new Date(start.getTime()); dewormDate.setDate(dewormDate.getDate() + dewormDay);

    // 9th Month Start till 9 days buffer for Delivery Notification with action prompt
    const daysToDelivery = Math.round((deliveryDate - today) / 86400000);
    // 9th month starts roughly 30 days before delivery (252 days for cow, 280 for buffalo)
    const ninthMonthStartDays = tot - 30;

    if(pDay >= ninthMonthStartDays && pDay <= tot + 9){
      let dayCountText = '';
      if(daysToDelivery > 0) dayCountText = '(' + daysToDelivery + ' दिवस बाकी आहेत)';
      else if(daysToDelivery === 0) dayCountText = '(आज अंदाजे वेळ आहे)';
      else dayCountText = '(नुकतीच वेळ झाली आहे)';

      alerts.push({
        name: animalName, 
        text: '🍼 ' + animalWord + ' वेवण्याची वेळ जवळ आली आहे, नववा महिना सुरू झाला आहे ' + dayCountText + '. जर ' + animalWord + ' वेवली असेल, तर लगेच सिस्टीममध्ये अपडेट करा आणि खालील "वेली आहे" हे बटण दाबा!'
      });
    }

    // Heat check 3 days buffer (around day 21)
    if(pDay >= 19 && pDay <= 21){
      if(pDay === 21) alerts.push({name: animalName, text: t.heatNotif});
      else alerts.push({name: animalName, text: '🔴 गाभण राहून ' + pDay + ' दिवस झाले आहेत. उलट तपासणीची तयारी ठेवा.'});
    }

    // Deworming 3 days buffer
    const dDiff = getDayDifference(today, dewormDate);
    if(dDiff >= 0 && dDiff <= 3){
      if(dDiff === 0) alerts.push({name: animalName, text: t.dewormNotif});
      else alerts.push({name: animalName, text: '💊 जंतनाशक औषध देण्याची वेळ जवळ येत आहे ('+dDiff+' दिवस बाकी).' });
    }

    // Dry off 3 days buffer
    const dryDiff = getDayDifference(today, dryDate);
    if(dryDiff >= 0 && dryDiff <= 3){
      if(dryDiff === 0) alerts.push({name: animalName, text: t.dryNotif});
      else alerts.push({name: animalName, text: '🥛 दूध आटवण्याची वेळ जवळ येत आहे ('+dryDiff+' दिवस बाकी).'});
    }
  }

  if(alerts.length === 0){
    banner.style.display = 'none';
    list.innerHTML = '';
    return;
  }

  let html = '';
  for(let i=0; i<alerts.length; i++){
    html += '<div class="notif-item"><div style="font-weight:900; color:#991b1b;">'+alerts[i].name+'</div><div style="color:#c2410c;">'+alerts[i].text+'</div></div>';
  }
  list.innerHTML = html;
  banner.style.display = 'block';
}

function saveData(){
  const dt = document.getElementById('cDate').value;
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  const inputDate = parseISODate(dt);

  if(!inputDate){ alert(t.dateRequired); return; }
  if(inputDate > getTodayDate()){ alert(t.futureDateError); return; }

  const nm = document.getElementById('cName').value.trim() || (cur==='cow' ? t.bCow : t.bBuf);
  const nt = document.getElementById('cNote').value.trim();
  const previewImg = document.getElementById('photoPreview');
  const photo = previewImg.style.display==='block' ? previewImg.src : '';

  const db = getDB();
  db.unshift({ 
    id: Date.now(), 
    name: nm, 
    type: cur, 
    date: dt, 
    note: nt, 
    photo: photo,
    isCalved: false,
    calvedDate: ''
  });

  try{
    localStorage.setItem('cattle_tracker_db', JSON.stringify(db));
  }catch(e){ alert(t.storageError); return; }

  document.getElementById('cName').value = '';
  document.getElementById('cNote').value = '';
  document.getElementById('cPhoto').value = '';
  previewImg.style.display = 'none';
  setTodayMaxDate();
  draw();
}

function delData(id){
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  if(!confirm(t.confirmDel)) return;
  const db = getDB().filter(item => Number(item.id)!==Number(id));
  localStorage.setItem('cattle_tracker_db', JSON.stringify(db));
  draw();
}

function initApp(){
  let unlocked = false;
  try{ unlocked = localStorage.getItem('cattle_unlocked')==='true'; }catch(e){}
  if(!unlocked){
    document.getElementById('lockScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display = 'none';
    return;
  }
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';

  let savedLang = 'mr';
  try{ savedLang = localStorage.getItem('cattle_lang') || 'mr'; }catch(e){}
  document.getElementById('langSelect').value = savedLang;
  setTodayMaxDate();
  changeLanguage();
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', initApp);
}else{
  initApp();
}
</script>
