<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cattle Tracker">

<link rel="manifest" href="./manifest.json">

<title>Cattle Tracker</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;
}

html{
  background:#f1f5f9;
}

body{
  background:
    radial-gradient(circle at top,#dcfce7 0,#f8fafc 30%,#f1f5f9 100%);
  min-height:100vh;
  padding:12px;
  color:#0f172a;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.wrap{
  width:100%;
  max-width:460px;
}

/* ================= INSTALL BANNER ================= */

#installBanner{
  background:linear-gradient(135deg,#eff6ff,#dbeafe);
  border:1px solid #bfdbfe;
  color:#1e3a8a;
  padding:15px;
  border-radius:18px;
  font-size:13px;
  margin-bottom:12px;
  line-height:1.65;
  box-shadow:0 8px 24px rgba(37,99,235,.10);
  animation:slideDown .35s ease;
}

#installBanner b{
  color:#1d4ed8;
}

@keyframes slideDown{
  from{
    opacity:0;
    transform:translateY(-8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ================= HEADER ================= */

.app-header{
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 10px 30px rgba(15,23,42,.08);
  text-align:center;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border:1px solid rgba(226,232,240,.9);
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.header-logo{
  width:46px;
  height:46px;
  border-radius:14px;
  background:linear-gradient(135deg,#dcfce7,#bbf7d0);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  box-shadow:inset 0 0 0 1px #bbf7d0;
  flex-shrink:0;
}

.header-text{
  text-align:left;
  min-width:0;
}

.header-title{
  font-size:18px;
  font-weight:800;
  color:#166534;
  white-space:nowrap;
}

.header-sub{
  font-size:10px;
  color:#64748b;
  margin-top:2px;
}

.lang-select{
  width:auto !important;
  min-width:92px;
  margin:0 !important;
  padding:8px 9px !important;
  font-size:12px !important;
  font-weight:700 !important;
  border:1px solid #cbd5e1 !important;
  border-radius:10px !important;
}

/* ================= CARDS ================= */

.card{
  background:rgba(255,255,255,.96);
  border-radius:20px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 8px 24px rgba(15,23,42,.06);
  border:1px solid #e2e8f0;
}

.card h3{
  font-size:16px;
  margin-bottom:14px;
  color:#166534;
  font-weight:800;
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:12px;
}

.stat{
  background:rgba(255,255,255,.96);
  padding:11px 5px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 6px 18px rgba(15,23,42,.05);
  border:1px solid #e2e8f0;
}

.stat-number{
  font-size:19px;
  font-weight:800;
  color:#166534;
}

.stat-label{
  font-size:9px;
  color:#64748b;
  margin-top:2px;
  font-weight:700;
}

/* ================= FORM ================= */

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:2px solid #cbd5e1;
  border-radius:13px;
  font-size:16px;
  outline:none;
  background:white;
  margin-bottom:12px;
  font-weight:600;
  font-family:inherit;
  transition:.2s;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#16a34a;
  box-shadow:0 0 0 3px rgba(22,163,74,.10);
}

textarea{
  min-height:80px;
  resize:vertical;
}

input[type="file"]{
  padding:9px;
  font-size:13px;
  background:#f8fafc;
}

/* ================= ANIMAL BUTTONS ================= */

.animal-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-bottom:13px;
}

.animal-btn{
  border:2px solid #dcfce7;
  background:linear-gradient(180deg,#f0fdf4,#ecfdf5);
  padding:12px 5px;
  border-radius:15px;
  cursor:pointer;
  font-weight:800;
  color:#166534;
  text-align:center;
  transition:.2s;
  font-size:25px;
}

.animal-btn span{
  font-size:12px;
}

.animal-btn:active{
  transform:scale(.96);
}

.animal-btn.active{
  border-color:#16a34a;
  background:linear-gradient(180deg,#dcfce7,#bbf7d0);
  box-shadow:0 5px 15px rgba(22,163,74,.16);
}

/* ================= BUTTONS ================= */

.btn{
  width:100%;
  background:linear-gradient(135deg,#16a34a,#15803d);
  color:white;
  border:none;
  padding:14px;
  border-radius:13px;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  margin-top:4px;
  box-shadow:0 6px 16px rgba(22,163,74,.25);
  transition:.2s;
}

.btn:active{
  transform:scale(.98);
}

.btn-blue{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  box-shadow:0 6px 16px rgba(37,99,235,.22);
  margin-top:10px;
}

/* ================= PHOTO ================= */

.photo-preview{
  width:90px;
  height:90px;
  border-radius:15px;
  object-fit:cover;
  display:none;
  margin:5px auto 12px;
  border:2px solid #cbd5e1;
  box-shadow:0 5px 15px rgba(15,23,42,.10);
}

/* ================= RECORD ================= */

.item{
  background:linear-gradient(180deg,#ffffff,#f8fafc);
  border-radius:17px;
  padding:12px;
  border:1px solid #e2e8f0;
  margin-bottom:10px;
  display:flex;
  gap:10px;
  align-items:flex-start;
  box-shadow:0 5px 16px rgba(15,23,42,.04);
}

.cow-img{
  width:62px;
  height:62px;
  border-radius:13px;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  flex-shrink:0;
  overflow:hidden;
  border:1px solid #cbd5e1;
}

.cow-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.item-info{
  flex-grow:1;
  min-width:0;
}

.item-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-weight:800;
  font-size:13px;
  border-bottom:1px solid #f1f5f9;
  padding-bottom:5px;
  margin-bottom:4px;
}

.item-top span:first-child{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:11px;
  padding:4px 0;
  color:#475569;
}

.row b{
  color:#0f172a;
  white-space:nowrap;
}

.due{
  background:#ecfdf5;
  padding:7px;
  border-radius:8px;
  color:#166534;
  font-weight:800;
  margin-top:5px;
  font-size:11px;
}

.due span:last-child{
  color:#166534;
}

.note-box{
  background:#fffbeb;
  border:1px solid #fef3c7;
  border-radius:8px;
  padding:7px;
  font-size:11px;
  color:#92400e;
  margin-top:5px;
  word-break:break-word;
}

.btn-del{
  width:100%;
  background:#fff1f2;
  color:#be123c;
  border:1px solid #fecdd3;
  padding:7px;
  border-radius:8px;
  font-weight:800;
  font-size:11px;
  cursor:pointer;
  margin-top:7px;
}

.empty{
  text-align:center;
  color:#94a3b8;
  font-size:13px;
  padding:25px 10px;
}

/* ================= MOBILE ================= */

@media(max-width:360px){
  body{
    padding:8px;
  }

  .card{
    padding:13px;
  }

  .header-title{
    font-size:16px;
  }

  .header-logo{
    width:40px;
    height:40px;
    font-size:21px;
  }

  .stats{
    gap:5px;
  }

  .stat-number{
    font-size:17px;
  }

  .stat-label{
    font-size:8px;
  }
}

/* ================= PWA STANDALONE ================= */

@media(display-mode:standalone){
  body{
    padding-top:calc(12px + env(safe-area-inset-top));
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
  }

  #installBanner{
    display:none !important;
  }
}
