<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#15803d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The MH Farmer">

<link rel="manifest" href="manifest.json">
<title>The MH Farmer</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:linear-gradient(135deg,#f0fdf4 0%,#f8fafc 100%);
  min-height:100vh;
  padding:12px;
  color:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
}

.wrap{
  width:100%;
  max-width:420px;
  margin:0 auto;
}

/* Lock Screen */
#lockScreen{
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:90vh;
}

.lock-card{
  background:white;
  border-radius:24px;
  padding:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  border:1px solid #e2e8f0;
  text-align:center;
}

.lock-title{
  font-size:22px;
  font-weight:900;
  color:#15803d;
  margin-bottom:6px;
}

.lock-sub{
  font-size:12px;
  color:#64748b;
  margin-bottom:20px;
  font-weight:600;
  line-height:1.4;
}

/* Header */
.app-header{
  background:linear-gradient(135deg,#15803d 0%,#16a34a 100%);
  border-radius:20px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 10px 25px -5px rgba(22,163,74,.3);
  text-align:center;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:white;
}

.header-title{
  font-size:20px;
  font-weight:900;
  letter-spacing:.5px;
  text-shadow:0 2px 4px rgba(0,0,0,.1);
}

.header-sub{
  font-size:11.5px;
  color:#bbf7d0;
  margin-top:3px;
  font-weight:700;
  letter-spacing:.5px;
}

/* Custom Install PWA Button */
.install-bar{
  display:none;
  background:linear-gradient(135deg,#059669 0%,#10b981 100%);
  color:white;
  padding:12px 16px;
  border-radius:16px;
  margin-bottom:14px;
  text-align:center;
  box-shadow:0 6px 20px rgba(16,185,129,.25);
  font-size:14px;
  font-weight:800;
  border:none;
  width:100%;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  transition:transform .2s;
}

.install-bar:active{
  transform:scale(.98);
}

/* Language */
#langSelect{
  background:rgba(255,255,255,.2);
  color:white;
  border:1px solid rgba(255,255,255,.4);
  border-radius:10px;
  padding:6px 10px;
  font-size:12px;
  font-weight:bold;
  outline:none;
  cursor:pointer;
}

#langSelect option{
  background:#15803d;
  color:white;
}

/* Notifications */
.notification-banner{
  background:linear-gradient(135deg,#fff7ed 0%,#ffedd5 100%);
  border:2px solid #fdba74;
  border-radius:18px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 6px 20px rgba(194,65,12,.15);
}

.notif-title{
  font-size:14px;
  font-weight:900;
  color:#c2410c;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:6px;
}

.notif-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.notif-item{
  background:white;
  border-radius:12px;
  padding:10px 12px;
  font-size:12px;
  color:#7c2d12;
  font-weight:600;
  border:1.5px solid #fed7aa;
  line-height:1.4;
  box-shadow:0 2px 6px rgba(0,0,0,.04);
  border-left:5px solid #ea580c;
}

/* Stats */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:14px;
}

.stat{
  background:white;
  padding:12px 8px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.04);
  border:1px solid #e2e8f0;
}

.stat-number{
  font-size:20px;
  font-weight:900;
  color:#15803d;
}

.stat-label{
  font-size:11px;
  color:#64748b;
  font-weight:600;
  margin-top:2px;
}

/* Cards */
.card{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 8px 25px rgba(0,0,0,.04);
  border:1px solid #e2e8f0;
}

.card h3{
  font-size:16px;
  margin-bottom:14px;
  color:#15803d;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:6px;
}

/* Inputs */
label{
  display:block;
  text-align:left;
  font-size:11px;
  font-weight:700;
  color:#475569;
  margin-bottom:6px;
  margin-left:2px;
}

input,select,textarea{
  width:100%;
  padding:13px 14px;
  border:2px solid #e2e8f0;
  border-radius:14px;
  font-size:15px;
  outline:none;
  background:#f8fafc;
  margin-bottom:12px;
  font-weight:600;
  font-family:inherit;
  transition:all .3s;
}

input:focus,select:focus,textarea:focus{
  border-color:#16a34a;
  background:white;
  box-shadow:0 0 0 4px rgba(22,163,74,.1);
}

/* Animal Buttons */
.animal-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:14px;
}

.animal-btn{
  border:2px solid #e2e8f0;
  background:#f8fafc;
  padding:12px 8px;
  border-radius:14px;
  cursor:pointer;
  font-weight:bold;
  color:#64748b;
  text-align:center;
  font-size:14px;
  transition:all .2s;
}

.animal-btn.active{
  border-color:#16a34a;
  background:#dcfce7;
  color:#15803d;
  box-shadow:0 4px 12px rgba(22,163,74,.15);
}

/* Button */
.btn{
  width:100%;
  background:linear-gradient(135deg,#15803d 0%,#16a34a 100%);
  color:white;
  border:none;
  padding:15px;
  border-radius:14px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  margin-top:6px;
  box-shadow:0 6px 20px rgba(22,163,74,.3);
  transition:transform .2s;
}

.btn:active{
  transform:scale(.98);
}

/* Photo */
.photo-preview{
  width:75px;
  height:75px;
  border-radius:14px;
  object-fit:cover;
  display:none;
  margin:8px auto 12px;
  border:2px solid #16a34a;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
  cursor:pointer;
}

/* Records */
.item{
  background:#f8fafc;
  border-radius:16px;
  padding:14px;
  border:1px solid #e2e8f0;
  margin-bottom:12px;
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.cow-img{
  width:76px;
  height:76px;
  border-radius:14px;
  background:#e2e8f0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:34px;
  flex-shrink:0;
  overflow:hidden;
  border:2px solid #cbd5e1;
  box-shadow:0 4px 10px rgba(0,0,0,.06);
  cursor:pointer;
}

.cow-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .2s;
}

.cow-img img:active{
  transform:scale(1.05);
}

.item-info{
  flex-grow:1;
  min-width:0;
}

.item-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  font-weight:bold;
  font-size:13px;
  border-bottom:1px solid #e2e8f0;
  padding-bottom:6px;
  margin-bottom:6px;
  color:#1e293b;
}

.duration-badge{
  background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);
  color:#1d4ed8;
  font-weight:900;
  font-size:12px;
  padding:4px 9px;
  border-radius:8px;
  border:1.5px solid #93c5fd;
  box-shadow:0 2px 6px rgba(29,78,216,.15);
  white-space:nowrap;
}

/* Rows */
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  font-size:11.5px;
  padding:6px 0;
  color:#334155;
  font-weight:600;
  border-bottom:1px dashed #e2e8f0;
}

.row span:first-child{
  flex:1;
  line-height:1.3;
}

/* Date Badge */
.date-badge{
  background:#fef08a;
  color:#78350f;
  padding:3px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:900;
  border:1.5px solid #fde047;
  text-align:right;
  width:95px;
  flex-shrink:0;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  letter-spacing:.3px;
}

/* Delivery */
.due{
  background:linear-gradient(135deg,#dcfce7 0%,#bbf7d0 100%);
  padding:8px 10px;
  border-radius:10px;
  color:#14532d;
  font-weight:900;
  margin-top:8px;
  font-size:12px;
  border:1.5px solid #86efac;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 6px rgba(22,163,74,.15);
}

.due span:first-child{
  flex:1;
}

.due-badge{
  background:#15803d;
  color:white;
  padding:3px 8px;
  border-radius:6px;
  font-size:11.5px;
  font-weight:900;
  text-align:right;
  width:95px;
  flex-shrink:0;
  border:1.5px solid #166534;
  box-shadow:0 1px 3px rgba(0,0,0,.1);
  letter-spacing:.3px;
}

.note-box{
  background:#fef3c7;
  border:1px solid #fde68a;
  border-radius:8px;
  padding:6px 8px;
  font-size:11.5px;
  color:#92400e;
  margin-top:6px;
  font-weight:500;
}

/* Action Buttons */
.action-btns{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.btn-repeat{
  flex:1;
  background:#eff6ff;
  color:#1d4ed8;
  border:1px solid #bfdbfe;
  padding:7px;
  border-radius:10px;
  font-weight:bold;
  font-size:11px;
  cursor:pointer;
}

.btn-calved{
  flex:1;
  background:#dcfce7;
  color:#15803d;
  border:1px solid #86efac;
  padding:7px;
  border-radius:10px;
  font-weight:bold;
  font-size:11px;
  cursor:pointer;
}

.btn-del{
  flex:1;
  background:#ffeeef;
  color:#b91c1c;
  border:1px solid #fecaca;
  padding:7px;
  border-radius:10px;
  font-weight:bold;
  font-size:11px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#94a3b8;
  font-size:13px;
  padding:24px;
  font-weight:500;
}

/* Image Zoom Lightbox Modal */
#imageZoomModal{
  display:none;
  position:fixed;
  z-index:99999;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:rgba(0,0,0,0.92);
  justify-content:center;
  align-items:center;
  flex-direction:column;
  padding:16px;
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

#zoomedImage{
  max-width:95%;
  max-height:80%;
  object-fit:contain;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
  border:2px solid rgba(255,255,255,.2);
}

.modal-close-btn{
  position:absolute;
  top:20px;
  right:20px;
  color:white;
  font-size:32px;
  font-weight:bold;
  background:rgba(255,255,255,0.15);
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  line-height:1;
}

.modal-tip{
  color:#cbd5e1;
  margin-top:14px;
  font-size:12px;
  font-weight:600;
}
</style>
</head>

<body>

<div class="wrap">

  <!-- LOCK SCREEN -->
  <div id="lockScreen" style="display:none;">

    <div class="lock-card">

      <div class="lock-title">
        🔐 The MH Farmer
      </div>

      <div class="lock-sub">
        ॲप वापरण्यासाठी तुमचा मोबाईल नंबर आणि पिन प्रविष्ट करा
      </div>

      <label>
        मोबाईल नंबर (१० अंकी)
      </label>

      <input
        type="tel"
        id="loginMob"

      >

      <label>

        type="password"
        id="loginPin"
        placeholder=""
        maxlength="4"
        inputmode="numeric"
        autocomplete="off"
      >

      <button
        class="btn"
        type="button"
        onclick="verifyLogin()"
      >
        ॲप सुरू करा 🚀
      </button>

    </div>

  </div>


  <!-- MAIN APP -->
  <div id="appScreen" style="display:none;">

    <!-- Header -->
    <div class="app-header">

      <div style="text-align:left;">

        <div
          class="header-title"
          id="mainHeaderTitle"
        >
          The MH Farmer
        </div>

        <div
          class="header-sub"
          id="mainHeaderSub"
        >
          Cattle Pregnancy Tracker
        </div>

      </div>

      <div>

        <select
          id="langSelect"
          onchange="changeLanguage()"
        >
          <option value="mr">मराठी</option>
          <option value="hi">हिंदी</option>

    <!-- PWA Install Button -->
    <button

      type="button"
      onclick="installPWA()"

      <span>📲 ॲप फोनमध्ये इन्स्टॉल करा</span>
    </button>


    <!-- Notifications -->
    <div
      id="notifBannerBox"
      class="notification-banner"
      style="display:none;"
    >

      <div
        class="notif-title"
        id="notifTitleText"
      >
        🔔 महत्त्वाचे अलर्ट्स
      </div>

      <div
        id="notifListContainer"
        class="notif-list"
      ></div>

    </div>


    <!-- Stats -->
    <div class="stats">

      <div class="stat">

        <div
          class="stat-number"
          id="totalCount"
        >
          0
        </div>

        <div
          class="stat-label"
          id="lblTotal"
        >
          एकूण नोंदी
        </div>

      </div>


      <div class="stat">

        <div
          class="stat-number"
          id="cowCount"
        >
          0
        </div>

        <div
          class="stat-label"
          id="lblCow"
        >
          गाय
        </div>

      </div>


      <div class="stat">

        <div
          class="stat-number"
          id="buffaloCount"
        >
          0
        </div>

        <div
          class="stat-label"
          id="lblBuf"
        >
          म्हैस
        </div>

      </div>

    </div>


    <!-- Form -->
    <div class="card">

      <h3 id="formTitle">
        ➕ नवीन पशु नोंद
      </h3>


      <div class="animal-buttons">

        <button
          class="animal-btn active"
          id="cowBtn"
          type="button"
          onclick="selectAnimal('cow')"
        >
          🐄
          <span id="btnCowTxt">
            गाय
          </span>
        </button>


        <button
          class="animal-btn"
          id="buffaloBtn"
          type="button"
          onclick="selectAnimal('buffalo')"
        >
          🐃
          <span id="btnBufTxt">
            म्हैस
          </span>
        </button>

      </div>


      <label id="lblNameLbl">
        पशुचे नाव / ओळख
      </label>

      <input
        type="text"
        id="cName"
        placeholder="उदा. कावेरी"
      >


      <label id="lblDate">
        गाय गाभण राहिल्याची तारीख
      </label>

      <input
        type="date"
        id="cDate"
      >


      <label id="lblNoteLbl">
        डॉक्टर / सिमेन तपशील
      </label>

      <textarea
        id="cNote"
        placeholder="उदा. डॉक्टरचे नाव, सिमेन ब्रँड"
      ></textarea>


      <label id="lblPhotoLbl">
        पशुचा फोटो (पर्यायी)
      </label>

      <input
        type="file"
        id="cPhoto"
        accept="image/*"

      <img
        id="photoPreview"
        class="photo-preview"
        alt="Preview"
        onclick="openImageModal(this.src)"
      >


      <button
        class="btn"
        id="btnSave"
        type="button"
        onclick="saveData()"
      >
        💾 नोंद जतन करा
      </button>

    </div>


    <!-- Records -->
    <div class="card">

      <h3 id="listTitle">
        📋 माझ्या पशुंच्या नोंदी
      </h3>

      <div id="list"></div>

    </div>

  </div>

</div>


<!-- Image Zoom Lightbox Modal -->
<div id="imageZoomModal" onclick="closeImageModal()">
  <div class="modal-close-btn" onclick="closeImageModal()">&times;</div>
  <img id="zoomedImage" src="" alt="Zoomed Photo" onclick="event.stopPropagation()">
  <p class="modal-tip">बंद करण्यासाठी कुठेही टच करा</p>
</div>


<script>
'use strict';

let deferredPrompt = null;
const pwaBtn = document.getElementById('pwaInstallBtn');

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  if(pwaBtn && !window.matchMedia('(display-mode: standalone)').matches){
    pwaBtn.style.display = 'flex';
  }
});

function installPWA(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(choiceResult){
      deferredPrompt = null;
      if(pwaBtn){
        pwaBtn.style.display = 'none';
      }
    });
  }
}

window.addEventListener('appinstalled', function(){
  if(pwaBtn){
    pwaBtn.style.display = 'none';
  }
  deferredPrompt = null;
});


function openImageModal(src){
  if(!src) return;
  const modal = document.getElementById('imageZoomModal');
  const img = document.getElementById('zoomedImage');
  if(modal && img){
    img.src = src;
    modal.style.display = 'flex';
  }
}

function closeImageModal(){
  const modal = document.getElementById('imageZoomModal');
  const img = document.getElementById('zoomedImage');
  if(modal) modal.style.display = 'none';
  if(img) img.removeAttribute('src');
}


if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(err){});
  });
}

let cur='cow';

const langData={
  mr:{
    headerSub:'Cattle Pregnancy Tracker',
    tot:'एकूण',
    cow:'गाय',
    buf:'म्हैस',
    formT:'➕ नवीन पशु नोंद',
    bCow:'गाय',
    bBuf:'म्हैस',
    namePh:'उदा. कावेरी',
    nameLbl:'पशुचे नाव / ओळख',
    dtLbl:'गाय गाभण राहिल्याची तारीख',
    noteLbl:'डॉक्टर / सिमेन तपशील',
    photoLbl:'पशुचा फोटो (पर्यायी)',
    notePh:'उदा. डॉक्टरचे नाव, सिमेन ब्रँड',
    saveBtn:'💾 नोंद जतन करा',

    setNewDateBtn:'📅 नवीन भरवण्याची तारीख टाка',
    chk21:'🔴 उलट तपासणी <span style="font-size:10px; color:#64748b;">(२१ वा दिवस)</span>',
    milkDry:'🥛 दूध आटवणे <span style="font-size:10px; color:#64748b;">(७ वा महिना)</span>',
    deworm:'💉 जंतनाशक <span style="font-size:10px; color:#64748b;">(३० दिवस आधी)</span>',

function verifyLogin(){
  const mob = document.getElementById('loginMob').value.trim();
  const pin = document.getElementById('loginPin').value.trim();

  if(!/^\d{10}$/.test(mob)){
    alert('कृपया बरोबर १० अंकी मोबाईल नंबर टाका!');
    return;
  }
  if(!/^\d{4}$/.test(pin)){
    alert('कृपया ४ अंकी PIN टाका!');
    return;
  }

  const expectedPin = mob.substring(0,2) + mob.substring(mob.length-1) + mob.substring(mob.length-1);

  if(pin === expectedPin){
    try{
      localStorage.setItem('cattle_unlocked', 'true');
      localStorage.setItem('cattle_user_mob', mob);
    }catch(e){}

    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    setTodayMaxDate();
    draw();
  }else{
    alert('चुकीचा PIN!');
  }
}

}

function compressImage(file, callback){
  if(!file || !file.type || file.type.indexOf('image/')!==0){ callback(''); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if(w > 500){ h = h * (500 / w); w = 500; }
      if(h > 500){ w = w * (500 / h); h = 500; }
      canvas.width = Math.round(w); canvas.height = Math.round(h);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = function(){ callback(''); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function previewPhoto(){
  const input = document.getElementById('cPhoto');
  const preview = document.getElementById('photoPreview');
  if(input.files && input.files[0]){
    compressImage(input.files[0], function(res){
      if(res){ preview.src = res; preview.style.display = 'block'; }
      else { preview.removeAttribute('src'); preview.style.display = 'none'; }
    });
  }
}

function parseISODate(str){
  if(typeof str!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(str)) return null;
  const p = str.split('-').map(Number);
  const d = new Date(p[0], p[1]-1, p[2]);
  if(d.getFullYear()!==p[0] || d.getMonth()!==p[1]-1 || d.getDate()!==p[2]) return null;
  d.setHours(0,0,0,0);
  return d;
}

function getTodayDate(){
  const d = new Date(); d.setHours(0,0,0,0); return d;
}

function getDayDifference(start, end){
  return Math.round((end - start)/86400000);
}

function formatDate(d){
  return String(d.getDate()).padStart(2,'0') + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + d.getFullYear();
}

function addD(str, days){
  const d = parseISODate(str);
  if(!d) return '---';
  d.setDate(d.getDate() + Number(days||0));
  return formatDate(d);
}

function getFormattedDuration(str, lang){
  const start = parseISODate(str);
  if(!start) return '0 दिवस';
  const now = getTodayDate();
  if(now < start) return '0 दिवस';
  const yrs = now.getFullYear() - start.getFullYear();
  let m = now.getMonth() - start.getMonth() + (yrs*12);
  let d = now.getDate() - start.getDate();
  if(d < 0){ m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if(m < 0){ m = 0; d = 0; }

  if(lang==='en') return m + ' mos ' + d + ' days';
  if(lang==='hi') return m + ' महीने ' + d + ' दिन';
  return m + ' महिना ' + d + ' दिवस';
}

function escapeHtml(val){
  return String(val==null ? '' : val).replace(/[&<>'"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c];
  });
}

function draw(){
  const box = document.getElementById('list');
  if(!box) return;
  const db = getDB();
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;

  let cows = 0, buffaloes = 0;
  for(let i=0; i<db.length; i++){
    if(db[i].type==='cow') cows++;
    if(db[i].type==='buffalo') buffaloes++;
  }

  document.getElementById('totalCount').innerText = db.length;
  document.getElementById('cowCount').innerText = cows;
  document.getElementById('buffaloCount').innerText = buffaloes;

  if(db.length === 0){
    box.innerHTML = '<div class="empty">' + escapeHtml(t.empty) + '</div>';
    checkSmartNotifications();
    return;
  }

  let html = '';
  const today = getTodayDate();

  for(let i=0; i<db.length; i++){
    const it = db[i];
    const isBuffalo = it.type==='buffalo';
    const tot = isBuffalo ? 310 : 282;
    const start = parseISODate(it.date);

    const imgHtml = it.photo ? '<img src="'+escapeHtml(it.photo)+'" onclick="openImageModal(\''+escapeHtml(it.photo)+'\')">' : (isBuffalo ? '🐃' : '🐄');
    const safeName = escapeHtml(it.name);
    const safeNote = escapeHtml(it.note || '');
    const animalLabel = isBuffalo ? '🐃 ' + t.buf : '🐄 ' + t.cow;

    html += '<div class="item">';
    html += '<div class="cow-img">'+imgHtml+'</div>';
    html += '<div class="item-info">';

    if(!it.isCalved){
      // Normal Pregnancy Phase
      const pDays = start ? getDayDifference(start, today) : 0;
      const dry = isBuffalo ? 235 : 210;
      const dewormDay = tot - 30;

      const check21 = addD(it.date, 21);
      const dryDate = addD(it.date, dry);
      const dewormDate = addD(it.date, dewormDay);
      const transDate = addD(it.date, tot-21);
      const deliveryDate = addD(it.date, tot);

      html += '<div class="item-top"><span>'+ animalLabel +' &nbsp; <b>'+safeName+'</b></span>';
      html += '<span class="duration-badge">⏱️ '+escapeHtml(getFormattedDuration(it.date, lang))+'</span></div>';

      html += '<div class="row"><span>📅 '+t.dtLbl+'</span><span class="date-badge">'+escapeHtml(start ? formatDate(start) : '---')+'</span></div>';
      html += '<div class="row"><span>'+t.chk21+'</span><span class="date-badge">'+escapeHtml(check21)+'</span></div>';
      html += '<div class="row"><span>'+t.milkDry+'</span><span class="date-badge">'+escapeHtml(dryDate)+'</span></div>';
      html += '<div class="row"><span>'+t.deworm+'</span><span class="date-badge">'+escapeHtml(dewormDate)+'</span></div>';
      html += '<div class="row"><span>'+t.trans+'</span><span class="date-badge">'+escapeHtml(transDate)+'</span></div>';

      html += '<div class="due"><span>'+t.delivery+'</span><span class="due-badge">'+escapeHtml(deliveryDate)+'</span></div>';

      if(safeNote){
        html += '<div class="note-box">'+t.notePrefix+safeNote+'</div>';
      }

      html += '<div class="action-btns">';
      // Show 'Calved' button only after 8 months 25 days (approx 265 days) or auto-reset at tot+11
      if(pDays >= 265 || pDays >= (tot + 11)){
        html += '<button class="btn-calved" type="button" onclick="markCalved('+it.id+')">'+escapeHtml(t.calvedBtn)+'</button>';
      }
      html += '<button class="btn-repeat" type="button" onclick="updateDate('+it.id+')">'+escapeHtml(t.repeatBtn)+'</button>';
      html += '<button class="btn-del" type="button" onclick="delData('+it.id+')">'+escapeHtml(t.delBtn)+'</button>';
      html += '</div>';

    } else {
      // Post-Calving Phase (Rest Period & Heat Window)
      const calvedDate = parseISODate(it.calvedDate);
      const cDays = calvedDate ? getDayDifference(calvedDate, today) : 0;
      const restDays = isBuffalo ? 75 : 60; // 2-3 months rest
      
      const heatStart = new Date(calvedDate.getTime());
      heatStart.setDate(heatStart.getDate() + restDays);

      html += '<div class="item-top"><span>'+ animalLabel +' &nbsp; <b>'+safeName+'</b></span>';
      html += '<span class="duration-badge" style="background:#dcfce7; color:#15803d; border-color:#86efac;">🐄 वेली आहे</span></div>';

      html += '<div class="row"><span>📅 गाय वेऊन झालेले दिवस</span><span class="date-badge" style="background:#dbeafe; color:#1e40af; border-color:#93c5fd;">'+cDays+' दिवस</span></div>';
      html += '<div class="row"><span>'+t.heatWindowText+'</span><span class="date-badge">'+formatDate(heatStart)+'</span></div>';

      if(safeNote){
        html += '<div class="note-box">'+t.notePrefix+safeNote+'</div>';
      }

      html += '<div class="action-btns">';
      html += '<button class="btn-calved" type="button" onclick="setNewPregnancy('+it.id+')">'+escapeHtml(t.setNewDateBtn)+'</button>';
      html += '<button class="btn-del" type="button" onclick="delData('+it.id+')">'+escapeHtml(t.delBtn)+'</button>';
      html += '</div>';
    }

    html += '</div></div>';
  }

  box.innerHTML = html;
  checkSmartNotifications();
}

function checkSmartNotifications(){
  const banner = document.getElementById('notifBannerBox');
  const title = document.getElementById('notifTitleText');
  const list = document.getElementById('notifListContainer');
  if(!banner || !title || !list) return;

  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  title.innerText = t.notifTitle;

  const db = getDB();
  const today = getTodayDate();
  const alerts = [];

  for(let i=0; i<db.length; i++){
    const it = db[i];
    if(it.isCalved) continue;

    const start = parseISODate(it.date);
    if(!start || start > today) continue;

    const pDay = getDayDifference(start, today);
    const tot = it.type==='buffalo' ? 310 : 282;
    const dry = it.type==='buffalo' ? 235 : 210;
    const dewormDay = tot - 30;

    const deliveryDate = new Date(start.getTime()); deliveryDate.setDate(deliveryDate.getDate() + tot);
    const dryDate = new Date(start.getTime()); dryDate.setDate(dryDate.getDate() + dry);
    const dewormDate = new Date(start.getTime()); dewormDate.setDate(dewormDate.getDate() + dewormDay);

    const name = escapeHtml(it.name);
    const ico = it.type==='buffalo' ? '🐃' : '🐄';

    if(pDay >= 19 && pDay <= 21){
      alerts.push({name: ico+' '+name, text: t.heatNotif.replace('{day}', pDay)});
    }
    const dDiff = getDayDifference(today, dewormDate);
    if(dDiff >= 0 && dDiff <= 3){
      alerts.push({name: ico+' '+name, text: t.dewormNotif.replace('{days}', dDiff)});
    }
    const dryDiff = getDayDifference(today, dryDate);
    if(dryDiff >= 0 && dryDiff <= 3){
      alerts.push({name: ico+' '+name, text: t.dryNotif.replace('{days}', dryDiff)});
    }
    const delDiff = getDayDifference(today, deliveryDate);
    if(delDiff >= 0 && delDiff <= 3){
      alerts.push({name: ico+' '+name, text: t.deliveryNotif.replace('{days}', delDiff)});
    }
  }

  if(alerts.length === 0){
    banner.style.display = 'none';
    list.innerHTML = '';
    return;
  }

  let html = '';
  for(let i=0; i<alerts.length; i++){
    html += '<div class="notif-item"><div style="font-weight:900; color:#991b1b;">'+alerts[i].name+'</div><div style="color:#c2410c;">'+alerts[i].text+'</div></div>';
  }
  list.innerHTML = html;
  banner.style.display = 'block';
}

function saveData(){
  const dt = document.getElementById('cDate').value;
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  const inputDate = parseISODate(dt);

  if(!inputDate){ alert(t.dateRequired); return; }
  if(inputDate > getTodayDate()){ alert(t.futureDateError); return; }

  const nm = document.getElementById('cName').value.trim() || (cur==='cow' ? t.bCow : t.bBuf);
  const nt = document.getElementById('cNote').value.trim();
  const previewImg = document.getElementById('photoPreview');
  const photo = previewImg.style.display==='block' ? previewImg.src : '';

  const db = getDB();
  db.unshift({ 
    id: Date.now(), 
    name: nm, 
    type: cur, 
    date: dt, 
    note: nt, 
    photo: photo,
    isCalved: false,
    calvedDate: ''
  });

  try{
    localStorage.setItem('cattle_tracker_db', JSON.stringify(db));
  }catch(e){ alert(t.storageError); return; }

  document.getElementById('cName').value = '';
  document.getElementById('cNote').value = '';
  document.getElementById('cPhoto').value = '';
  previewImg.style.display = 'none';
  draw();
}

function delData(id){
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  if(!confirm(t.confirmDel)) return;
  const db = getDB().filter(item => Number(item.id)!==Number(id));
  localStorage.setItem('cattle_tracker_db', JSON.stringify(db));
  draw();
}

function updateDate(id){
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  const now = new Date();
  const def = now.toISOString().split('T')[0];
  const newDt = prompt(t.promptNewDate, def);
  if(!newDt) return;
  const parsed = parseISODate(newDt.trim());
  if(!parsed || parsed > getTodayDate()){ alert(t.futureDateError); return; }

  const db = getDB();
  for(let i=0; i<db.length; i++){
    if(Number(db[i].id)===Number(id)){ 
      db[i].date = newDt.trim(); 
      db[i].isCalved = false;
      break; 
    }
  }
  localStorage.setItem('cattle_tracker_db', JSON.stringify(db));
  draw();
}

function markCalved(id){
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  if(!confirm(t.confirmCalved)) return;

  const now = new Date();
  const todayStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');

  const db = getDB();
  for(let i=0; i<db.length; i++){
    if(Number(db[i].id)===Number(id)){
      db[i].isCalved = true;
      db[i].calvedDate = todayStr;
      break;
    }
  }
  localStorage.setItem('cattle_tracker_db', JSON.stringify(db));
  draw();
}

function setNewPregnancy(id){
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  const now = new Date();
  const def = now.toISOString().split('T')[0];
  const newDt = prompt(t.promptHeatDate, def);
  if(!newDt) return;
  const parsed = parseISODate(newDt.trim());
  if(!parsed || parsed > getTodayDate()){ alert(t.futureDateError); return; }

  const db = getDB();
  for(let i=0; i<db.length; i++){
    if(Number(db[i].id)===Number(id)){
      db[i].date = newDt.trim();
      db[i].isCalved = false;
      db[i].calvedDate = '';
      break;
    }
  }
  localStorage.setItem('cattle_tracker_db', JSON.stringify(db));
  draw();
}

function initApp(){
  let unlocked = false;
  try{ unlocked = localStorage.getItem('cattle_unlocked')==='true'; }catch(e){}
  if(!unlocked){
    document.getElementById('lockScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display = 'none';
    return;
  }
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';

  let savedLang = 'mr';
  try{ savedLang = localStorage.getItem('cattle_lang') || 'mr'; }catch(e){}
  document.getElementById('langSelect').value = savedLang;
  setTodayMaxDate();
  changeLanguage();
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', initApp);
}else{
  initApp();
}
</script>
