<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#166534">

<title>Cattle Tracker</title>

<link rel="manifest" href="manifest.json">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f0fdf4;
  color:#1f2937;
}

#appScreen{
  max-width:600px;
  margin:auto;
  padding:15px;
}

.app-header{
  background:#166534;
  color:white;
  padding:18px;
  border-radius:15px;
  text-align:center;
  margin-bottom:15px;
}

.app-header h1{
  margin:0;
  font-size:28px;
}

.app-header p{
  margin:5px 0 0;
  font-size:14px;
}

.card{
  background:white;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:8px;
  margin-bottom:12px;
  font-size:16px;
}

textarea{
  resize:vertical;
}

button{
  border:none;
  border-radius:9px;
  padding:11px 15px;
  font-size:15px;
  cursor:pointer;
}

.animal-buttons{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.animal-buttons button{
  flex:1;
  background:#dcfce7;
  color:#166534;
  font-weight:bold;
}

.animal-buttons button.active{
  background:#166534;
  color:white;
}

.save-btn{
  width:100%;
  background:#166534;
  color:white;
  font-weight:bold;
  font-size:17px;
}

.delete-btn{
  background:#fee2e2;
  color:#b91c1c;
  margin-top:8px;
}

.repeat-btn{
  background:#dcfce7;
  color:#166534;
  margin-top:8px;
}

.record{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}

.record h3{
  margin:0 0 8px;
}

.record p{
  margin:5px 0;
}

.record img{
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:10px;
  margin-top:8px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:15px;
}

.stat{
  background:white;
  padding:12px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.06);
}

.stat strong{
  display:block;
  font-size:22px;
  color:#166534;
}

.reminder{
  background:#fff7ed;
  border-left:5px solid #f97316;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}

.reminder.today{
  background:#fef2f2;
  border-left-color:#dc2626;
}

.reminder-title{
  font-weight:bold;
  margin-bottom:5px;
}

.reminder-date{
  font-size:14px;
  color:#4b5563;
}

.photo-preview{
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:10px;
  display:none;
  margin-bottom:12px;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:15px;
}
</style>
</head>

<body>

<div id="appScreen">

  <!-- BRAND NAME ADDED HERE -->
  <div style="text-align:center;font-size:18px;font-weight:bold;color:#166534;margin-bottom:8px;">
    🌾 The MH Farmer
  </div>

  <div class="app-header">
    <h1 id="appTitle">Cattle Tracker</h1>
    <p id="appSubtitle">गाभण व खुराक व्यवस्थापन</p>
  </div>

  <div class="card">
    <label for="language">Language / भाषा</label>

    <select id="language" onchange="changeLanguage()">
      <option value="mr">मराठी</option>
      <option value="hi">हिंदी</option>
      <option value="en">English</option>
    </select>
  </div>

  <div id="reminderCard" class="card">
    <h2 id="reminderTitle">🔔 आजच्या सूचना</h2>
    <div id="reminders"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <strong id="totalAnimals">0</strong>
      <span id="totalText">एकूण</span>
    </div>

    <div class="stat">
      <strong id="cowCount">0</strong>
      <span id="cowText">गाय</span>
    </div>

    <div class="stat">
      <strong id="buffaloCount">0</strong>
      <span id="buffaloText">म्हैस</span>
    </div>
  </div>

  <div class="card">

    <label id="animalLabel">जनावर निवडा</label>

    <div class="animal-buttons">
      <button id="cowBtn" class="active" onclick="selectAnimal('cow')">
        🐄 गाय
      </button>

      <button id="buffaloBtn" onclick="selectAnimal('buffalo')">
        🐃 म्हैस
      </button>
    </div>

    <label id="nameLabel">जनावराचे नाव</label>

    <input
      type="text"
      id="animalName"
      placeholder="जनावराचे नाव"
    >

    <label id="dateLabel">गाभण / AI तारीख</label>

    <input
      type="date"
      id="pregDate"
    >

    <label id="noteLabel">टीप</label>

    <textarea
      id="note"
      rows="3"
      placeholder="काही माहिती लिहा..."
    ></textarea>

    <label id="photoLabel">फोटो</label>

    <input
      type="file"
      id="photo"
      accept="image/*"
      onchange="previewPhoto()"
    >

    <img
      id="photoPreview"
      class="photo-preview"
      alt="Preview"
    >

    <button
      class="save-btn"
      onclick="saveData()"
      id="saveBtn"
    >
      💾 माहिती जतन करा
    </button>

  </div>

  <div class="card">
    <h2 id="recordsTitle">📋 जनावरांची नोंद</h2>
    <div id="records"></div>
  </div>

</div>

<script>

let cur = "cow";

const langData = {

  mr:{
    title:"Cattle Tracker",
    subtitle:"गाभण व खुराक व्यवस्थापन",
    animalLabel:"जनावर निवडा",
    cow:"🐄 गाय",
    buffalo:"🐃 म्हैस",
    nameLabel:"जनावराचे नाव",
    namePlaceholder:"जनावराचे नाव",
    dateLabel:"गाभण / AI तारीख",
    noteLabel:"टीप",
    notePlaceholder:"काही माहिती लिहा...",
    photoLabel:"फोटो",
    save:"💾 माहिती जतन करा",
    records:"📋 जनावरांची नोंद",
    total:"एकूण",
    cowText:"गाय",
    buffaloText:"म्हैस",
    reminderTitle:"🔔 आजच्या सूचना",
    noReminder:"आज कोणतीही सूचना नाही.",
    heat:"🔄 हीट / परत आली का ते तपासा",
    dry:"🥛 ड्राय ऑफ करा / दूध काढणे बंद करण्याची वेळ",
    transition:"🌾 ट्रान्झिशन फीड सुरू करा",
    delivery:"🐄 अपेक्षित विण्याची तारीख",
    pregnantDate:"गाभण तारीख",
    deliveryDate:"अपेक्षित विण्याची तारीख",
    delete:"🗑️ हटवा",
    repeat:"🔁 पुन्हा नोंद",
    daysAgo:"दिवसांपूर्वी",
    daysLeft:"दिवस बाकी",
    today:"आज"
  },

  hi:{
    title:"Cattle Tracker",
    subtitle:"गर्भावस्था व आहार प्रबंधन",
    animalLabel:"पशु चुनें",
    cow:"🐄 गाय",
    buffalo:"🐃 भैंस",
    nameLabel:"पशु का नाम",
    namePlaceholder:"पशु का नाम",
    dateLabel:"गर्भाधान / AI तारीख",
    noteLabel:"नोट",
    notePlaceholder:"कुछ जानकारी लिखें...",
    photoLabel:"फोटो",
    save:"💾 जानकारी सेव करें",
    records:"📋 पशुओं की जानकारी",
    total:"कुल",
    cowText:"गाय",
    buffaloText:"भैंस",
    reminderTitle:"🔔 आज की सूचनाएं",
    noReminder:"आज कोई सूचना नहीं है।",
    heat:"🔄 हीट / वापस आई या नहीं जांचें",
    dry:"🥛 ड्राय ऑफ करें / दूध निकालना बंद करने का समय",
    transition:"🌾 ट्रांजिशन फीड शुरू करें",
    delivery:"🐄 अनुमानित प्रसव तारीख",
    pregnantDate:"गर्भाधान तारीख",
    deliveryDate:"अनुमानित प्रसव तारीख",
    delete:"🗑️ हटाएं",
    repeat:"🔁 फिर से नोंद",
    daysAgo:"दिन पहले",
    daysLeft:"दिन बाकी",
    today:"आज"
  },

  en:{
    title:"Cattle Tracker",
    subtitle:"Pregnancy & Feed Management",
    animalLabel:"Select Animal",
    cow:"🐄 Cow",
    buffalo:"🐃 Buffalo",
    nameLabel:"Animal Name",
    namePlaceholder:"Animal name",
    dateLabel:"Pregnancy / AI Date",
    noteLabel:"Note",
    notePlaceholder:"Write some information...",
    photoLabel:"Photo",
    save:"💾 Save Information",
    records:"📋 Animal Records",
    total:"Total",
    cowText:"Cow",
    buffaloText:"Buffalo",
    reminderTitle:"🔔 Today's Reminders",
    noReminder:"No reminders today.",
    heat:"🔄 Check for heat / return",
    dry:"🥛 Dry-off / stop milking time",
    transition:"🌾 Start transition feed",
    delivery:"🐄 Expected calving date",
    pregnantDate:"Pregnancy date",
    deliveryDate:"Expected calving date",
    delete:"🗑️ Delete",
    repeat:"🔁 Repeat Entry",
    daysAgo:"days ago",
    daysLeft:"days left",
    today:"Today"
  }

};

function getLang(){
  return document.getElementById("language").value || "mr";
}

function changeLanguage(){

  const lang = getLang();
  const t = langData[lang];

  localStorage.setItem("cattle_tracker_lang",lang);

  document.getElementById("appTitle").textContent = t.title;
  document.getElementById("appSubtitle").textContent = t.subtitle;

  document.getElementById("animalLabel").textContent = t.animalLabel;

  document.getElementById("cowBtn").textContent = t.cow;
  document.getElementById("buffaloBtn").textContent = t.buffalo;

  document.getElementById("nameLabel").textContent = t.nameLabel;
  document.getElementById("animalName").placeholder = t.namePlaceholder;

  document.getElementById("dateLabel").textContent = t.dateLabel;

  document.getElementById("noteLabel").textContent = t.noteLabel;
  document.getElementById("note").placeholder = t.notePlaceholder;

  document.getElementById("photoLabel").textContent = t.photoLabel;

  document.getElementById("saveBtn").textContent = t.save;
  document.getElementById("recordsTitle").textContent = t.records;

  document.getElementById("totalText").textContent = t.total;
  document.getElementById("cowText").textContent = t.cowText;
  document.getElementById("buffaloText").textContent = t.buffaloText;

  document.getElementById("reminderTitle").textContent = t.reminderTitle;

  draw();
  drawReminders();
}

function selectAnimal(type){

  cur = type;

  document.getElementById("cowBtn").classList.toggle("active",type === "cow");
  document.getElementById("buffaloBtn").classList.toggle("active",type === "buffalo");

  const t = langData[getLang()];

  const defaultName = cur === "cow"
    ? t.cow.replace("🐄 ","")
    : t.buffalo.replace("🐃 ","");

  document.getElementById("animalName").value = defaultName;
}

function getDB(){

  try{
    return JSON.parse(localStorage.getItem("cattle_tracker_db")) || [];
  }
  catch(e){
    return [];
  }

}

function setDB(data){
  localStorage.setItem("cattle_tracker_db",JSON.stringify(data));
}

function compressImage(file){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = function(e){

      const img = new Image();

      img.onload = function(){

        const canvas = document.createElement("canvas");

        let width = img.width;
        let height = img.height;

        const max = 400;

        if(width > max || height > max){

          if(width > height){

            height = Math.round(height * max / width);
            width = max;

          }else{

            width = Math.round(width * max / height);
            height = max;

          }

        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(img,0,0,width,height);

        resolve(canvas.toDataURL("image/jpeg",0.7));

      };

      img.onerror = reject;

      img.src = e.target.result;

    };

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}

async function previewPhoto(){

  const input = document.getElementById("photo");
  const preview = document.getElementById("photoPreview");

  if(!input.files.length){

    preview.style.display = "none";
    preview.src = "";

    return;
  }

  try{

    const compressed = await compressImage(input.files[0]);

    preview.src = compressed;
    preview.style.display = "block";

  }catch(e){

    console.log("Photo error",e);

  }

}

async function saveData(){

  const name = document.getElementById("animalName").value.trim();
  const pregDate = document.getElementById("pregDate").value;
  const note = document.getElementById("note").value.trim();

  if(!pregDate){

    alert("कृपया गाभण / AI तारीख निवडा.");
    return;
  }

  const photoInput = document.getElementById("photo");
  let photo = "";

  if(photoInput.files.length){

    try{
      photo = await compressImage(photoInput.files[0]);
    }
    catch(e){
      console.log("Photo compression failed",e);
    }

  }
  else{

    const preview = document.getElementById("photoPreview");

    if(preview.src && preview.style.display !== "none"){
      photo = preview.src;
    }

  }

  const data = {

    id:Date.now(),

    type:cur,

    name:name || (
      cur === "cow"
      ? langData[getLang()].cow.replace("🐄 ","")
      : langData[getLang()].buffalo.replace("🐃 ","")
    ),

    pregDate:pregDate,

    note:note,

    photo:photo

  };

  pushToDB(data);

  document.getElementById("animalName").value = "";
  document.getElementById("pregDate").value = "";
  document.getElementById("note").value = "";

  document.getElementById("photo").value = "";

  document.getElementById("photoPreview").src = "";
  document.getElementById("photoPreview").style.display = "none";

  draw();
  drawReminders();

}

function pushToDB(item){

  const db = getDB();

  db.push(item);

  setDB(db);

}

function delData(id){

  if(!confirm("ही नोंद हटवायची आहे का?")) return;

  const db = getDB().filter(x => x.id !== id);

  setDB(db);

  draw();
  drawReminders();

}

function repeatData(id){

  const db = getDB();
  const item = db.find(x => x.id === id);

  if(!item) return;

  cur = item.type;

  selectAnimal(cur);

  document.getElementById("animalName").value = item.name;
  document.getElementById("note").value = item.note || "";

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

}

function updateDate(date,days){

  const d = new Date(date + "T00:00:00");

  d.setDate(d.getDate() + days);

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}

function formatDate(date){

  if(!date) return "";

  const d = new Date(date + "T00:00:00");

  return d.toLocaleDateString("en-IN",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });

}

function getDays(date){

  const start = new Date(date + "T00:00:00");
  const today = new Date();

  today.setHours(0,0,0,0);

  return Math.floor(
    (today - start) / (1000 * 60 * 60 * 24)
  );

}

function getPregnancyData(item){

  const isCow = item.type === "cow";

  const totalDays = isCow ? 282 : 310;
  const dryDay = isCow ? 210 : 235;

  const heatDay = 21;
  const transitionDay = totalDays - 21;

  return {

    heat:updateDate(item.pregDate,heatDay),

    dry:updateDate(item.pregDate,dryDay),

    transition:updateDate(item.pregDate,transitionDay),

    delivery:updateDate(item.pregDate,totalDays)

  };

}

function reminderStatus(date){

  const today = new Date();

  today.setHours(0,0,0,0);

  const d = new Date(date + "T00:00:00");

  return Math.round(
    (d - today) / (1000 * 60 * 60 * 24)
  );

}

function reminderText(diff){

  const t = langData[getLang()];

  if(diff === 0) return t.today;

  if(diff < 0){
    return Math.abs(diff) + " " + t.daysAgo;
  }

  return diff + " " + t.daysLeft;

}

function drawReminders(){

  const container = document.getElementById("reminders");

  if(!container) return;

  const t = langData[getLang()];

  const db = getDB();

  let html = "";

  db.forEach(item => {

    const p = getPregnancyData(item);

    const reminders = [

      {
        date:p.heat,
        text:t.heat
      },

      {
        date:p.dry,
        text:t.dry
      },

      {
        date:p.transition,
        text:t.transition
      },

      {
        date:p.delivery,
        text:t.delivery
      }

    ];

    reminders.forEach(r => {

      const diff = reminderStatus(r.date);

      if(diff < -7 || diff > 7) return;

      if(
        r.date === p.delivery &&
        diff > 7
      ) return;

      html += `
        <div class="reminder ${diff === 0 ? "today" : ""}">
          <div class="reminder-title">
            ${r.text}
          </div>

          <div>
            🐄 ${item.name}
          </div>

          <div class="reminder-date">
            📅 ${formatDate(r.date)}
            &nbsp; • &nbsp;
            ${reminderText(diff)}
          </div>
        </div>
      `;

    });

  });

  if(!html){

    html = `
      <div class="empty">
        ${t.noReminder}
      </div>
    `;

  }

  container.innerHTML = html;

}

function draw(){

  const db = getDB();

  const records = document.getElementById("records");

  const t = langData[getLang()];

  let cowCount = 0;
  let buffaloCount = 0;

  db.forEach(item => {

    if(item.type === "cow"){
      cowCount++;
    }else{
      buffaloCount++;
    }

  });

  document.getElementById("totalAnimals").textContent = db.length;
  document.getElementById("cowCount").textContent = cowCount;
  document.getElementById("buffaloCount").textContent = buffaloCount;

  if(!db.length){

    records.innerHTML = `
      <div class="empty">
        ${t.noReminder}
      </div>
    `;

    return;

  }

  records.innerHTML = db.map(item => {

    const p = getPregnancyData(item);

    const days = getDays(item.pregDate);

    return `
      <div class="record">

        <h3>
          ${item.type === "cow" ? "🐄" : "🐃"}
          ${item.name}
        </h3>

        <p>
          📅 ${t.pregnantDate}:
          <strong>${formatDate(item.pregDate)}</strong>
        </p>

        <p>
          🔄 ${t.heat}:
          <strong>${formatDate(p.heat)}</strong>
        </p>

        <p>
          🥛 ${t.dry}:
          <strong>${formatDate(p.dry)}</strong>
        </p>

        <p>
          🌾 ${t.transition}:
          <strong>${formatDate(p.transition)}</strong>
        </p>

        <p>
          🐄 ${t.deliveryDate}:
          <strong>${formatDate(p.delivery)}</strong>
        </p>

        <p>
          📊 ${days} days
        </p>

        ${
          item.note
          ? `<p>📝 ${item.note}</p>`
          : ""
        }

        ${
          item.photo
          ? `<img src="${item.photo}" alt="Animal Photo">`
          : ""
        }

        <button
          class="repeat-btn"
          onclick="repeatData(${item.id})"
        >
          ${t.repeat}
        </button>

        <button
          class="delete-btn"
          onclick="delData(${item.id})"
        >
          ${t.delete}
        </button>

      </div>
    `;

  }).join("");

}

document.addEventListener("DOMContentLoaded",function(){

  const savedLang =
    localStorage.getItem("cattle_tracker_lang") || "mr";

  document.getElementById("language").value = savedLang;

  const today = new Date();

  const y = today.getFullYear();
  const m = String(today.getMonth()+1).padStart(2,"0");
  const d = String(today.getDate()).padStart(2,"0");

  document.getElementById("pregDate").value =
    `${y}-${m}-${d}`;

  changeLanguage();

  selectAnimal("cow");

  draw();
  drawReminders();

});

if("serviceWorker" in navigator){

  window.addEventListener("load",function(){

    navigator.serviceWorker
      .register("sw.js")
      .catch(err => console.log("SW Failed!",err));

  });

}

</script>

</body>
</html>
