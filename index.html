<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#15803d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The MH Farmer">

<link rel="manifest" href="manifest.json">
<title>The MH Farmer</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:
    radial-gradient(circle at top left,rgba(34,197,94,.14),transparent 35%),
    linear-gradient(135deg,#ecfdf5 0%,#f0fdf4 50%,#f8fafc 100%);
  min-height:100vh;
  padding:10px;
  color:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
}

.wrap{
  width:100%;
  max-width:420px;
  margin:0 auto;
}

/* Lock Screen */
#lockScreen{
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:90vh;
}

.lock-card{
  background:linear-gradient(145deg,#ffffff 0%,#f8fafc 100%);
  border-radius:26px;
  padding:24px;
  box-shadow:
    0 18px 40px rgba(15,23,42,.12),
    inset 0 2px 4px rgba(255,255,255,.9);
  border:2px solid #dbeafe;
  text-align:center;
}

.lock-title{
  font-size:22px;
  font-weight:900;
  color:#15803d;
  margin-bottom:6px;
  text-shadow:0 2px 4px rgba(21,128,61,.15);
}

.lock-sub{
  font-size:12px;
  color:#64748b;
  margin-bottom:20px;
  font-weight:600;
  line-height:1.4;
}

/* Premium 3D Header */
.app-header{
  background:
    linear-gradient(135deg,#14532d 0%,#15803d 38%,#16a34a 70%,#22c55e 100%);
  border-radius:24px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:
    0 12px 28px rgba(22,163,74,.35),
    inset 0 2px 5px rgba(255,255,255,.35),
    inset 0 -4px 8px rgba(0,0,0,.12);
  text-align:center;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:white;
  border:2px solid #14532d;
}

.header-title{
  font-size:22px;
  font-weight:900;
  letter-spacing:.5px;
  text-shadow:0 3px 7px rgba(0,0,0,.25);
  background:linear-gradient(to right,#ffffff,#dcfce7);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.header-sub{
  font-size:11px;
  color:#bbf7d0;
  margin-top:2px;
  font-weight:800;
  letter-spacing:.8px;
  text-transform:uppercase;
}

/* Install PWA Button */
.install-bar{
  display:none;
  background:linear-gradient(135deg,#047857 0%,#059669 45%,#10b981 100%);
  color:white;
  padding:11px 14px;
  border-radius:15px;
  margin-bottom:12px;
  text-align:center;
  box-shadow:
    0 7px 16px rgba(16,185,129,.32),
    inset 0 2px 3px rgba(255,255,255,.3);
  font-size:13px;
  font-weight:900;
  border:2px solid #047857;
  width:100%;
  cursor:pointer;
  justify-content:center;
  align-items:center;
  gap:8px;
  transition:all .15s ease;
}

.install-bar:active{
  transform:translateY(2px) scale(.98);
  box-shadow:0 3px 8px rgba(16,185,129,.25);
}

/* Language */
#langSelect{
  background:rgba(255,255,255,.22);
  color:white;
  border:2px solid rgba(255,255,255,.5);
  border-radius:11px;
  padding:7px 10px;
  font-size:12px;
  font-weight:bold;
  outline:none;
  cursor:pointer;
  box-shadow:
    0 3px 8px rgba(0,0,0,.15),
    inset 0 1px 2px rgba(255,255,255,.25);
}

#langSelect option{
  background:#15803d;
  color:white;
}

/* Notifications */
.notification-banner{
  background:linear-gradient(135deg,#fff7ed 0%,#ffedd5 100%);
  border:2px solid #fb923c;
  border-radius:17px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:
    0 7px 20px rgba(194,65,12,.15),
    inset 0 2px 3px rgba(255,255,255,.7);
}

.notif-title{
  font-size:13px;
  font-weight:900;
  color:#c2410c;
  margin-bottom:6px;
  display:flex;
  align-items:center;
  gap:6px;
}

.notif-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.notif-item{
  background:linear-gradient(145deg,#ffffff 0%,#fff7ed 100%);
  border-radius:11px;
  padding:8px 10px;
  font-size:11.5px;
  color:#7c2d12;
  font-weight:600;
  border:1.5px solid #fed7aa;
  line-height:1.4;
  border-left:5px solid #ea580c;
  box-shadow:0 3px 8px rgba(0,0,0,.05);
}

/* 3D Stats Cards */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}

.stat{
  background:linear-gradient(145deg,#ffffff 0%,#f1f5f9 100%);
  padding:11px 6px;
  border-radius:17px;
  text-align:center;
  box-shadow:
    0 7px 16px rgba(0,0,0,.07),
    inset 0 2px 4px rgba(255,255,255,.9);
  border:2px solid #dbeafe;
  transition:transform .15s ease;
}

.stat:active{
  transform:scale(.97);
}

.stat-number{
  font-size:18px;
  font-weight:900;
  color:#15803d;
  text-shadow:0 2px 4px rgba(21,128,61,.15);
}

.stat-label{
  font-size:10.5px;
  color:#64748b;
  font-weight:800;
  margin-top:1px;
}

/* Main Card */
.card{
  background:linear-gradient(145deg,#ffffff 0%,#f8fafc 100%);
  border-radius:21px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:
    0 9px 25px rgba(15,23,42,.07),
    inset 0 2px 4px rgba(255,255,255,.9);
  border:2px solid #e2e8f0;
}

.card h3{
  font-size:15px;
  margin-bottom:10px;
  color:#15803d;
  font-weight:900;
  display:flex;
  align-items:center;
  gap:6px;
  text-transform:uppercase;
  letter-spacing:.3px;
}

/* Inputs */
label{
  display:block;
  text-align:left;
  font-size:10.5px;
  font-weight:800;
  color:#475569;
  margin-bottom:4px;
  margin-left:2px;
}

input,select,textarea{
  width:100%;
  padding:10px 12px;
  border:2px solid #cbd5e1;
  border-radius:13px;
  font-size:14px;
  outline:none;
  background:#f8fafc;
  margin-bottom:8px;
  font-weight:700;
  font-family:inherit;
  transition:all .2s;
  box-shadow:inset 0 2px 4px rgba(15,23,42,.04);
}

input:focus,select:focus,textarea:focus{
  border-color:#16a34a;
  background:white;
  box-shadow:
    0 0 0 3px rgba(22,163,74,.15),
    inset 0 2px 4px rgba(15,23,42,.03);
}

textarea{
  height:55px;
  resize:none;
}

/* 3D Animal Buttons */
.animal-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:10px;
}

.animal-btn{
  border:2px solid #cbd5e1;
  background:linear-gradient(145deg,#ffffff 0%,#e2e8f0 100%);
  padding:11px 6px;
  border-radius:13px;
  cursor:pointer;
  font-weight:900;
  color:#64748b;
  text-align:center;
  font-size:13px;
  box-shadow:
    0 5px 0 #cbd5e1,
    0 7px 13px rgba(0,0,0,.07),
    inset 0 2px 3px rgba(255,255,255,.9);
  transition:all .15s ease;
}

.animal-btn:active{
  transform:translateY(4px) scale(.98);
  box-shadow:0 2px 4px rgba(0,0,0,.08);
}

.animal-btn.active{
  border-color:#15803d;
  background:linear-gradient(145deg,#dcfce7 0%,#86efac 100%);
  color:#14532d;
  box-shadow:
    0 5px 0 #15803d,
    0 8px 16px rgba(22,163,74,.25),
    inset 0 2px 4px rgba(255,255,255,.65);
}

/* Premium 3D Main Buttons */
.btn{
  width:100%;
  background:linear-gradient(145deg,#22c55e 0%,#16a34a 45%,#14532d 100%);
  color:white;
  border:2px solid #14532d;
  padding:12px;
  border-radius:13px;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
  margin-top:4px;
  box-shadow:
    0 6px 0 #14532d,
    0 10px 20px rgba(22,163,74,.28),
    inset 0 2px 4px rgba(255,255,255,.35);
  letter-spacing:.3px;
  transition:all .15s ease;
}

.btn:active{
  transform:translateY(5px) scale(.98);
  box-shadow:
    0 2px 5px rgba(22,163,74,.25),
    inset 0 2px 4px rgba(0,0,0,.12);
}

/* Photo Preview */
.photo-preview{
  width:65px;
  height:65px;
  border-radius:14px;
  object-fit:cover;
  display:none;
  margin:4px auto 8px;
  border:2px solid #cbd5e1;
  box-shadow:
    0 5px 12px rgba(0,0,0,.1),
    inset 0 2px 3px rgba(255,255,255,.8);
  cursor:pointer;
}

/* Records Item */
.item{
  background:linear-gradient(145deg,#ffffff 0%,#f8fafc 100%);
  border-radius:17px;
  padding:12px;
  border:2px solid #dbeafe;
  margin-bottom:10px;
  display:flex;
  gap:10px;
  align-items:flex-start;
  box-shadow:
    0 6px 16px rgba(15,23,42,.06),
    inset 0 2px 4px rgba(255,255,255,.9);
}

.cow-img{
  width:72px;
  height:72px;
  border-radius:14px;
  background:linear-gradient(145deg,#f1f5f9,#e2e8f0);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:32px;
  flex-shrink:0;
  overflow:hidden;
  border:2px solid #cbd5e1;
  box-shadow:
    0 5px 12px rgba(0,0,0,.07),
    inset 0 2px 3px rgba(255,255,255,.8);
  cursor:pointer;
}

.cow-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.item-info{
  flex-grow:1;
  min-width:0;
}

.item-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:4px;
  font-weight:900;
  font-size:12.5px;
  border-bottom:2px solid #f1f5f9;
  padding-bottom:5px;
  margin-bottom:5px;
  color:#1e293b;
}

.duration-badge{
  background:linear-gradient(145deg,#eff6ff 0%,#bfdbfe 100%);
  color:#1d4ed8;
  font-weight:900;
  font-size:11px;
  padding:3px 8px;
  border-radius:8px;
  border:1.5px solid #93c5fd;
  white-space:nowrap;
  box-shadow:
    0 3px 6px rgba(59,130,246,.12),
    inset 0 1px 2px rgba(255,255,255,.8);
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:4px;
  font-size:11px;
  padding:5px 0;
  color:#334155;
  font-weight:700;
  border-bottom:1px dashed #e2e8f0;
}

.row span:first-child{
  flex:1;
  line-height:1.3;
}

.date-badge{
  background:linear-gradient(145deg,#fef9c3 0%,#fde047 100%);
  color:#78350f;
  padding:2px 7px;
  border-radius:6px;
  font-size:10.5px;
  font-weight:900;
  border:1.5px solid #ca8a04;
  text-align:right;
  width:90px;
  flex-shrink:0;
  box-shadow:0 2px 5px rgba(202,138,4,.15);
}

.due{
  background:linear-gradient(145deg,#dcfce7 0%,#86efac 100%);
  padding:7px 8px;
  border-radius:11px;
  color:#14532d;
  font-weight:900;
  margin-top:6px;
  font-size:11.5px;
  border:2px solid #22c55e;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:
    0 4px 9px rgba(34,197,94,.18),
    inset 0 2px 3px rgba(255,255,255,.7);
}

.due span:first-child{
  flex:1;
}

.due-badge{
  background:linear-gradient(145deg,#16a34a,#14532d);
  color:white;
  padding:3px 7px;
  border-radius:6px;
  font-size:11px;
  font-weight:900;
  text-align:right;
  width:90px;
  flex-shrink:0;
  box-shadow:0 3px 6px rgba(20,83,45,.2);
}

.note-box{
  background:linear-gradient(145deg,#fef3c7 0%,#fde68a 100%);
  border:1.5px solid #f59e0b;
  border-radius:9px;
  padding:6px 7px;
  font-size:11px;
  color:#92400e;
  margin-top:5px;
  font-weight:700;
  box-shadow:0 3px 7px rgba(245,158,11,.1);
}

/* Small Note */
.small-assumption-note{
  font-size:9.5px;
  color:#64748b;
  font-weight:600;
  margin-top:4px;
  line-height:1.3;
  background:#f1f5f9;
  padding:5px 7px;
  border-radius:6px;
  border-left:3px solid #16a34a;
}

/* 3D Action Buttons */
.action-btns{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.btn-repeat{
  flex:2;
  background:linear-gradient(145deg,#eff6ff 0%,#bfdbfe 100%);
  color:#1d4ed8;
  border:2px solid #3b82f6;
  padding:7px 8px;
  border-radius:10px;
  font-weight:900;
  font-size:11px;
  cursor:pointer;
  text-align:center;
  box-shadow:
    0 4px 0 #2563eb,
    0 6px 11px rgba(59,130,246,.18),
    inset 0 1px 2px rgba(255,255,255,.9);
  transition:all .15s ease;
}

.btn-repeat:active{
  transform:translateY(3px) scale(.97);
  box-shadow:0 2px 4px rgba(59,130,246,.2);
}

.btn-calved{
  flex:2;
  background:linear-gradient(145deg,#dcfce7 0%,#86efac 100%);
  color:#14532d;
  border:2px solid #22c55e;
  padding:7px 8px;
  border-radius:10px;
  font-weight:900;
  font-size:11px;
  cursor:pointer;
  text-align:center;
  box-shadow:
    0 4px 0 #16a34a,
    0 6px 11px rgba(34,197,94,.18),
    inset 0 1px 2px rgba(255,255,255,.9);
  transition:all .15s ease;
}

.btn-calved:active{
  transform:translateY(3px) scale(.97);
  box-shadow:0 2px 4px rgba(34,197,94,.2);
}

.btn-del{
  flex:1;
  background:linear-gradient(145deg,#fee2e2 0%,#fca5a5 100%);
  color:#991b1b;
  border:2px solid #ef4444;
  padding:7px 6px;
  border-radius:10px;
  font-weight:900;
  font-size:11px;
  cursor:pointer;
  text-align:center;
  box-shadow:
    0 4px 0 #dc2626,
    0 6px 11px rgba(239,68,68,.18),
    inset 0 1px 2px rgba(255,255,255,.9);
  transition:all .15s ease;
}

.btn-del:active{
  transform:translateY(3px) scale(.97);
  box-shadow:0 2px 4px rgba(239,68,68,.2);
}

.empty{
  text-align:center;
  color:#94a3b8;
  font-size:12px;
  padding:20px;
  font-weight:700;
}

/* Modal */
.date-modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:rgba(0,0,0,.6);
  z-index:99999;
  justify-content:center;
  align-items:center;
  padding:16px;
  backdrop-filter:blur(3px);
}

.date-modal-card{
  background:linear-gradient(145deg,#ffffff,#f8fafc);
  padding:20px;
  border-radius:21px;
  width:100%;
  max-width:320px;
  box-shadow:
    0 18px 40px rgba(0,0,0,.25),
    inset 0 2px 4px rgba(255,255,255,.9);
  text-align:center;
  border:2px solid #16a34a;
}

.date-modal-card h4{
  font-size:15px;
  color:#15803d;
  margin-bottom:12px;
  font-weight:900;
}

/* Image Zoom */
#imageZoomModal{
  display:none;
  position:fixed;
  z-index:99999;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:rgba(0,0,0,.92);
  justify-content:center;
  align-items:center;
  flex-direction:column;
  padding:16px;
}

#zoomedImage{
  max-width:95%;
  max-height:80%;
  object-fit:contain;
  border-radius:14px;
}

.modal-close-btn{
  position:absolute;
  top:20px;
  right:20px;
  color:white;
  font-size:32px;
  font-weight:bold;
  background:rgba(255,255,255,.2);
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
</style>
</head>

<body>

<div class="wrap">

  <!-- LOCK SCREEN -->
  <div id="lockScreen" style="display:none;">
    <div class="lock-card">
      <div class="lock-title">🔐 The MH Farmer</div>
      <div class="lock-sub" id="lockSubTxt">ॲप वापरण्यासाठी तुमचा मोबाईल नंबर आणि पिन प्रविष्ट करा</div>

      <label id="lblMob">मोबाईल नंबर (१० अंकी)</label>
      <input type="tel" id="loginMob" maxlength="10" inputmode="numeric">

      <label id="lblPin">सिक्रेट पिन (PIN)</label>
      <input type="password" id="loginPin" maxlength="4" inputmode="numeric">

      <button class="btn" type="button" id="btnLogin" onclick="verifyLogin()">ॲप सुरू करा 🚀</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appScreen" style="display:none;">

    <!-- Attractive 3D Header -->
    <div class="app-header">
      <div style="text-align:left;">
        <div class="header-title">🌾 The MH Farmer</div>
        <div class="header-sub" id="mainHeaderSub">Cattle Pregnancy Tracker</div>
      </div>

      <div>
        <select id="langSelect" onchange="changeLanguage()">
          <option value="mr">मराठी</option>
          <option value="hi">हिंदी</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <button id="pwaInstallBtn" class="install-bar" type="button" onclick="installPWA()" style="display:none;">
      <span>📲 ॲप फोनमध्ये इन्स्टॉल करा</span>
    </button>

    <div id="notifBannerBox" class="notification-banner" style="display:none;">
      <div class="notif-title" id="notifTitleText">🔔 महत्त्वाचे अलर्ट्स</div>
      <div id="notifListContainer" class="notif-list"></div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-number" id="totalCount">0</div>
        <div class="stat-label" id="lblTotal">एकूण</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="cowCount">0</div>
        <div class="stat-label" id="lblCow">गाय</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="buffaloCount">0</div>
        <div class="stat-label" id="lblBuf">म्हैस</div>
      </div>
    </div>

    <!-- Compact Form -->
    <div class="card">
      <h3 id="formTitle">➕ नवीन पशु नोंद</h3>

      <div class="animal-buttons">
        <button class="animal-btn active" id="cowBtn" type="button" onclick="selectAnimal('cow')">
          🐄 <span id="btnCowTxt">गाय</span>
        </button>

        <button class="animal-btn" id="buffaloBtn" type="button" onclick="selectAnimal('buffalo')">
          🐃 <span id="btnBufTxt">म्हैस</span>
        </button>
      </div>

      <label id="lblNameLbl">पशुचे नाव / ओळख</label>
      <input type="text" id="cName" placeholder="उदा. कावेरी">

      <label id="lblDate">गाय गाभण राहिल्याची तारीख</label>
      <input type="date" id="cDate">

      <label id="lblNoteLbl">डॉक्टर / सिमेन तपशील (पर्यायी)</label>
      <textarea id="cNote" placeholder="उदा. डॉक्टरचे नाव, सिमेन ब्रँड"></textarea>

      <label id="lblPhotoLbl">पशुचा फोटो (पर्यायी)</label>
      <input type="file" id="cPhoto" accept="image/*" onchange="previewPhoto()">

      <img
        id="photoPreview"
        class="photo-preview"
        alt="Preview"
        onclick="openImageModal(this.src)"
      >

      <button class="btn" id="btnSave" type="button" onclick="saveData()">
        💾 नोंद जतन करा
      </button>
    </div>

    <div class="card">
      <h3 id="listTitle">📋 माझ्या पशुंच्या नोंदी</h3>
      <div id="list"></div>
    </div>

  </div>

</div>

<!-- Custom Calendar Date Picker Modal -->
<div id="customDateModal" class="date-modal">
  <div class="date-modal-card">
    <h4 id="modalTitleText">तारीख निवडा</h4>

<script>
'use strict';

let deferredPrompt = null;
const pwaBtn = document.getElementById('pwaInstallBtn');

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;

  if(pwaBtn && !window.matchMedia('(display-mode: standalone)').matches){
    pwaBtn.style.display = 'flex';
  }
});

function installPWA(){
  if(deferredPrompt){
    deferredPrompt.prompt();

    deferredPrompt.userChoice.then(function(){
      deferredPrompt = null;

      if(pwaBtn){
        pwaBtn.style.display = 'none';
      }
    });
  }
}

function openImageModal(src){
  if(!src) return;

  document.getElementById('zoomedImage').src = src;
  document.getElementById('imageZoomModal').style.display = 'flex';
}

function closeImageModal(){
  document.getElementById('imageZoomModal').style.display = 'none';
}

let cur = 'cow';
let activeActionId = null;
let activeActionType = null;

function selectAnimal(type){
  cur = type === 'buffalo' ? 'buffalo' : 'cow';

  document.getElementById('cowBtn').classList.toggle(
    'active',
    cur === 'cow'
  );

  document.getElementById('buffaloBtn').classList.toggle(
    'active',
    cur === 'buffalo'
  );

  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;

  document.getElementById('lblDate').innerText =
    cur === 'buffalo' ? t.dtLblBuf : t.dtLblCow;
}

function openDateModal(type, id){
  activeActionType = type;
  activeActionId = id;

  const modal = document.getElementById('customDateModal');
  const input = document.getElementById('modalDateInput');
  const title = document.getElementById('modalTitleText');

  const now = new Date();

  input.value =
    now.getFullYear() + '-' +
    String(now.getMonth()+1).padStart(2,'0') + '-' +
    String(now.getDate()).padStart(2,'0');

  input.max = input.value;

  const db = getDB();
  let animalType = 'गाय';

  for(let i=0; i<db.length; i++){
    if(Number(db[i].id) === Number(id)){
      animalType =
        db[i].type === 'buffalo' ? 'म्हैस' : 'गाय';
      break;
    }
  }

  const lang = document.getElementById('langSelect').value;

  if(lang === 'hi'){
    if(type === 'repeat'){
      title.innerText =
        animalType + ' रिपीट होने के कारण नई तारीख चुनें:';
    }
    else if(type === 'calved'){
      title.innerText =
        animalType + ' ब्याने की सटीक तारीख दर्ज करें:';
    }
    else if(type === 'newPregnancy'){
      title.innerText =
        'नई ' + animalType + ' लगाने की तारीख दर्ज करें:';
    }
    else if(type === 'changeCalve'){
      title.innerText =
        animalType + ' ब्याने की सटीक तारीख बदलें:';
    }
  }

  else if(lang === 'en'){
    if(type === 'repeat'){
      title.innerText =
        'Select new pregnancy date for ' + animalType + ':';
    }
    else if(type === 'calved'){
      title.innerText =
        'Enter exact calving date for ' + animalType + ':';
    }
    else if(type === 'newPregnancy'){
      title.innerText =
        'Enter new breeding date for ' + animalType + ':';
    }
    else if(type === 'changeCalve'){
      title.innerText =
        'Change calving date for ' + animalType + ':';
    }
  }

  else{
    if(type === 'repeat'){
      title.innerText =
        animalType + ' उलटल्यामुळे नवीन गाभण तारीख निवडा:';
    }
    else if(type === 'calved'){
      title.innerText =
        animalType + ' वेवल्याची अचूक तारीख टाका:';
    }
    else if(type === 'newPregnancy'){
      title.innerText =
        'नवीन ' + animalType + ' लावल्याची तारीख टाका:';
    }
    else if(type === 'changeCalve'){
      title.innerText =
        animalType + ' वेवल्याची अचूक तारीख बदला:';
    }
  }

  modal.style.display = 'flex';
}

function closeDateModal(){
  document.getElementById('customDateModal').style.display = 'none';

  activeActionId = null;
  activeActionType = null;
}

function submitModalDate(){
  const val =
    document.getElementById('modalDateInput').value;

  const lang =
    document.getElementById('langSelect').value;

  if(!val){
    alert(
      lang === 'en'
        ? 'Please select date!'
        : (
            lang === 'hi'
              ? 'कृपया तारीख चुनें!'
              : 'कृपया तारीख निवडा!'
          )
    );
    return;
  }

  const parsed = parseISODate(val);

  if(!parsed || parsed > getTodayDate()){
    alert(
      lang === 'en'
        ? 'Future dates not allowed!'
        : (
            lang === 'hi'
              ? 'भविष्य की तारीख मान्य नहीं!'
              : 'भविष्यातील तारीख चालणार नाही!'
          )
    );
    return;
  }

  const db = getDB();

  for(let i=0; i<db.length; i++){

    if(Number(db[i].id) === Number(activeActionId)){

      if(
        activeActionType === 'repeat' ||
        activeActionType === 'newPregnancy'
      ){
        db[i].date = val;
        db[i].isCalved = false;
        db[i].isAssumedCalved = false;
        db[i].calvedDate = '';

        const promptMsg =
          lang === 'en'
            ? 'Enter new Doctor / Semen details (or keep as is):'
            : (
                lang === 'hi'
                  ? 'नया डॉक्टर / सीमेन विवरण दर्ज करें:'
                  : 'नवीन डॉक्टर / सिमेन तपशील टाका (किंवा तसेच ठेवा):'
              );

        const newNote =
          prompt(promptMsg, db[i].note || "");

        if(newNote !== null){
          db[i].note = newNote.trim();
        }
      }

      else if(
        activeActionType === 'calved' ||
        activeActionType === 'changeCalve'
      ){
        db[i].isCalved = true;
        db[i].isAssumedCalved = false;
        db[i].calvedDate = val;
      }

      break;
    }
  }

  localStorage.setItem(
    'cattle_tracker_db',
    JSON.stringify(db)
  );

  closeDateModal();
  draw();
}

function verifyLogin(){

  const mob =
    document.getElementById('loginMob').value.trim();

  const pin =
    document.getElementById('loginPin').value.trim();

  const lang =
    document.getElementById('langSelect').value;

  if(!/^\d{10}$/.test(mob)){
    alert(
      lang === 'en'
        ? 'Enter valid 10-digit mobile!'
        : (
            lang === 'hi'
              ? 'सही 10 अंकों का मोबाइल नंबर दर्ज करें!'
              : 'कृपया बरोबर १० अंकी मोबाईल नंबर टाका!'
          )
    );
    return;
  }

  if(!/^\d{4}$/.test(pin)){
    alert(
      lang === 'en'
        ? 'Enter 4-digit PIN!'
        : (
            lang === 'hi'
              ? '4 अंकों का पिन दर्ज करें!'
              : 'कृपया ४ अंकी PIN टाका!'
          )
    );
    return;
  }

  const expectedPin =
    mob.substring(0,2) +
    mob.substring(mob.length-1) +
    mob.substring(mob.length-1);

  if(pin === expectedPin){

    try{
      localStorage.setItem(
        'cattle_unlocked',
        'true'
      );

      localStorage.setItem(
        'cattle_user_mob',
        mob
      );
    }catch(e){}

    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';

    setTodayMaxDate();
    draw();

  }else{

    alert(
      lang === 'en'
        ? 'Wrong PIN!'
        : (
            lang === 'hi'
              ? 'गलत पिन!'
              : 'चुकीचा PIN!'
          )
    );
  }
}

function setTodayMaxDate(){

  const dateInput =
    document.getElementById('cDate');

  if(!dateInput) return;

  const today = new Date();

  const todayStr =
    today.getFullYear() + '-' +
    String(today.getMonth()+1).padStart(2,'0') + '-' +
    String(today.getDate()).padStart(2,'0');

  dateInput.value = todayStr;
  dateInput.max = todayStr;

  const lang =
    document.getElementById('langSelect').value;

  const t =
    langData[lang] || langData.mr;

  document.getElementById('lblDate').innerText =
    cur === 'buffalo'
      ? t.dtLblBuf
      : t.dtLblCow;
}

    const data =
      localStorage.getItem('cattle_tracker_db');

    return data
      ? JSON.parse(data)
      : [];

  }catch(e){
    return [];
  }
}

function compressImage(file, callback){

  if(
    !file ||
    !file.type ||
    file.type.indexOf('image/') !== 0
  ){
    callback('');
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    const img = new Image();

    img.onload = function(){

      const canvas =
        document.createElement('canvas');

      let w = img.width;
      let h = img.height;

      if(w > 500){
        h = h * (500 / w);
        w = 500;
      }

      if(h > 500){
        w = w * (500 / h);
        h = 500;
      }

      canvas.width = Math.round(w);
      canvas.height = Math.round(h);

      const ctx =
        canvas.getContext('2d');

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      callback(
        canvas.toDataURL(
          'image/jpeg',
          0.75
        )
      );
    };

    img.onerror = function(){
      callback('');
    };

    img.src = e.target.result;
  };

  reader.readAsDataURL(file);
}

function parseISODate(str){

  if(
    typeof str !== 'string' ||
    !/^\d{4}-\d{2}-\d{2}$/.test(str)
  ){
    return null;
  }

  const p =
    str.split('-').map(Number);

  const d =
    new Date(
      p[0],
      p[1]-1,
      p[2]
    );

  if(
    d.getFullYear() !== p[0] ||
    d.getMonth() !== p[1]-1 ||
    d.getDate() !== p[2]
  ){
    return null;
  }

  d.setHours(0,0,0,0);

  return d;
}

function getTodayDate(){

  const d = new Date();

  d.setHours(0,0,0,0);

  return d;
}

function getDayDifference(start,end){

  return Math.round(
    (end-start)/86400000
  );
}

function formatDate(d){

  return String(d.getDate()).padStart(2,'0') +
    '-' +
    String(d.getMonth()+1).padStart(2,'0') +
    '-' +
    d.getFullYear();
}

function addD(str,days){

  const d = parseISODate(str);

  if(!d) return '---';

  d.setDate(
    d.getDate() +
    Number(days || 0)
  );

  return formatDate(d);
}

function getFormattedDuration(str,lang){

  const start =
    parseISODate(str);

  if(!start){
    return lang === 'en'
      ? '0 days'
      : (
          lang === 'hi'
            ? '0 दिन'
            : '० दिवस'
        );
  }

  const now =
    getTodayDate();

  if(now < start){
    return lang === 'en'
      ? '0 days'
      : (
          lang === 'hi'
            ? '0 दिन'
            : '० दिवस'
        );
  }

  const yrs =
    now.getFullYear() -
    start.getFullYear();

  let m =
    now.getMonth() -
    start.getMonth() +
    (yrs * 12);

  let d =
    now.getDate() -
    start.getDate();

  if(d < 0){
    m--;
    d +=
      new Date(
        now.getFullYear(),
        now.getMonth(),
        0
      ).getDate();
  }

  if(m < 0){
    m = 0;
    d = 0;
  }

  if(lang === 'en'){
    return m + ' mos ' + d + ' days';
  }

  if(lang === 'hi'){
    return m + ' महीने ' + d + ' दिन';
  }

  return m + ' महिना ' + d + ' दिवस';
}

function escapeHtml(val){

  return String(
    val == null ? '' : val
  ).replace(
    /[&<>'"]/g,
    function(c){
      return {
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '\'':'&#39;',
        '"':'&quot;'
      }[c];
    }
  );
}

function checkSmartNotifications(){

  const banner =
    document.getElementById(
      'notifBannerBox'
    );

  const title =
    document.getElementById(
      'notifTitleText'
    );

  const list =
    document.getElementById(
      'notifListContainer'
    );

  if(!banner || !title || !list){
    return;
  }

  const lang =
    document.getElementById(
      'langSelect'
    ).value;

  const t =
    langData[lang] || langData.mr;

  title.innerText =
    t.notifTitle;

  const db =
    getDB();

  const today =
    getTodayDate();

  const alerts = [];

  for(let i=0; i<db.length; i++){

    const it = db[i];

    const isBuff =
      it.type === 'buffalo';

    const animalName =
      (isBuff ? '🐃' : '🐄') +
      ' ' +
      escapeHtml(it.name);

    const animalWord =
      isBuff
        ? (
            lang === 'en'
              ? 'Buffalo'
              : (
                  lang === 'hi'
                    ? 'भैंस'
                    : 'म्हैस'
                )
          )
        : (
            lang === 'en'
              ? 'Cow'
              : 'गाय'
          );

    /* Calved animal */
    if(it.isCalved){

      const calvedDate =
        parseISODate(
          it.calvedDate
        );

      if(calvedDate){

        const cDay =
          getDayDifference(
            calvedDate,
            today
          );

        /*
          90 दिवस पूर्ण झाल्यावर
          एकदाच Heat/AI reminder.
        */

        if(cDay === 90){

          let heatMsg;

          if(lang === 'en'){

            heatMsg =
              '💡 90 days of rest completed. If ' +
              animalWord +
              ' is in heat, check and breed.';

          }

          else if(lang === 'hi'){

            heatMsg =
              '💡 ब्याने के 90 दिन पूरे हो गए हैं। यदि ' +
              animalWord +
              ' हीट में है तो जाँच कर गर्भधारण कराएं।';

          }

          else{

            heatMsg =
              '💡 वेऊन ९० दिवस पूर्ण झाले आहेत. आता ' +
              animalWord +
              ' माजावर आली असेल तर तपासून भरवून घ्या.';
          }

          alerts.push({
            name:animalName,
            text:heatMsg
          });
        }
      }

      continue;
    }

    const start =
      parseISODate(it.date);

    if(!start || start > today){
      continue;
    }

    const pDay =
      getDayDifference(
        start,
        today
      );

    const tot =
      isBuff ? 310 : 282;

    const dry =
      isBuff ? 235 : 210;

    const dewormDay =
      tot - 30;

    const deliveryDate =
      new Date(
        start.getTime()
      );

    deliveryDate.setDate(
      deliveryDate.getDate() +
      tot
    );

    const dryDate =
      new Date(
        start.getTime()
      );

    dryDate.setDate(
      dryDate.getDate() +
      dry
    );

    const dewormDate =
      new Date(
        start.getTime()
      );

    dewormDate.setDate(
      dewormDate.getDate() +
      dewormDay
    );

    /*
      ==============================
      DELIVERY ALERT WINDOW
      ==============================

      Cow:
      Day 265 to Day 282

      Buffalo:
      Day 295 to Day 310

      याच्या आधी delivery alert नाही.
      यानंतरही delivery alert नाही.
    */

    const deliveryAlertStart =
      isBuff ? 295 : 265;

    const deliveryAlertEnd =
      isBuff ? 310 : 282;

    const daysToDelivery =
      getDayDifference(
        today,
        deliveryDate
      );

    if(
      pDay >= deliveryAlertStart &&
      pDay <= deliveryAlertEnd
    ){

      let dayCountText = '';

      if(lang === 'en'){

        if(daysToDelivery > 0){
          dayCountText =
            '(' +

        else if(daysToDelivery === 0){
          dayCountText =
            '(Expected today)';

          dayCountText =
            '(Time has arrived)';
        }
      }

      else if(lang === 'hi'){

        if(daysToDelivery > 0){
          dayCountText =
            '(' +
            daysToDelivery +
            ' दिन बाकी हैं)';
        }

        else if(daysToDelivery === 0){
          dayCountText =
            '(आज अनुमानित समय है)';
        }

        else{
          dayCountText =
            '(समय आ गया है)';
        }
      }

      else{

        if(daysToDelivery > 0){
          dayCountText =
            '(' +
            daysToDelivery +
            ' दिवस बाकी आहेत)';
        }

        else if(daysToDelivery === 0){
          dayCountText =
            '(आज अंदाजे वेळ आहे)';
        }

        else{
          dayCountText =
            '(नुकतीच वेळ झाली आहे)';
        }
      }

      let delNotifTxt;

      if(lang === 'en'){

        delNotifTxt =
          '🍼 ' +
          animalWord +
          ' delivery time is near ' +
          dayCountText +
          '. If calved, update system & click "Calved"!';

      }

      else if(lang === 'hi'){

        delNotifTxt =
          '🍼 ' +
          animalWord +
          ' के ब्याने का समय नजदीक है ' +
          dayCountText +
          '. यदि ब्या गई है, तो सिस्टम में अपडेट करें और "ब्याया है" बटन दबाएं!';

      }

      else{

        delNotifTxt =
          '🍼 ' +
          animalWord +
          ' वेवण्याची वेळ जवळ आली आहे ' +
          dayCountText +
          '. जर ' +
          animalWord +
          ' वेवली असेल, तर लगेच सिस्टीममध्ये अपडेट करा आणि "वेली आहे" हे बटण दाबा!';
      }

      alerts.push({
        name:animalName,
        text:delNotifTxt
      });
    }

    /*
      ==============================
      HEAT / REPEAT ALERT
      ==============================

      फक्त 19, 20 आणि 21 दिवस.
      18 नाही.
      22 नाही.
    */

    if(
      pDay >= 19 &&
      pDay <= 21
    ){

      let heatTxt;

      if(lang === 'en'){

        heatTxt =
          pDay === 21
            ? '🔴 Today marks 21 days of pregnancy. Check if animal is in heat.'
            : '🔴 Pregnancy reached ' +
              pDay +
              ' days. Prepare for heat check.';
      }

      else if(lang === 'hi'){

        heatTxt =
          pDay === 21
            ? '🔴 आज गर्भधारण के 21 दिन पूरे हो गए हैं। कृपया जांच करें कि पशु रिपीट हुआ है या नहीं।'
            : '🔴 गर्भधारण के ' +
              pDay +
              ' दिन हो गए हैं। उलट जांच की तैयारी रखें.';
      }

      else{

        heatTxt =
          pDay === 21
            ? '🔴 आज गाभण राहून २१ दिवस पूर्ण झाले आहेत. कृपया गाय/म्हैस उलटली का ते तपासा.'

              pDay +
              ' दिवस झाले आहेत. उलट तपासणीची तयारी ठेवा.';
      }

      alerts.push({
        name:animalName,
        text:heatTxt
      });
    }

    /* Deworming */
    const dDiff =
      getDayDifference(
        today,
        dewormDate
      );

    if(
      dDiff >= 0 &&
      dDiff <= 3
    ){

      let dewTxt;

      if(lang === 'en'){

        dewTxt =
          dDiff === 0
            ? '💊 Today is deworming medicine schedule.'
            : '💊 Deworming schedule near (' +
              dDiff +
              ' days left).';
      }

      else if(lang === 'hi'){

        dewTxt =
          dDiff === 0
            ? '💊 आज डिवॉर्मिंग दवा देने का दिन है।'
            : '💊 डिवॉर्मिंग दवा का समय नजदीक है (' +
              dDiff +
              ' दिन बाकी).';
      }

      else{

        dewTxt =
          dDiff === 0
            ? '💊 आज वीण्याच्या नेमका महिनाभर आधीची जंतनाशक गोळी/औषध देण्याची वेळ आहे.'
            : '💊 जंतनाशक औषध देण्याची वेळ जवळ येत आहे (' +
              dDiff +
              ' दिवस बाकी).';
      }

      alerts.push({
        name:animalName,
        text:dewTxt
      });
    }

    /*
      ==============================
      DRY-OFF ALERT
      ==============================

      3 दिवस आधी + 2 + 1 + event day 0
    */

    const dryDiff =
      getDayDifference(
        today,
        dryDate
      );

    if(
      dryDiff >= 0 &&
      dryDiff <= 3
    ){

      let dryTxt;

      if(lang === 'en'){

        dryTxt =
          dryDiff === 0
            ? '🥛 Today is dry-off period.'
            : '🥛 Dry-off period near (' +
              dryDiff +
              ' days left).';
      }

      else if(lang === 'hi'){

        dryTxt =
          dryDiff === 0
            ? '🥛 आज दूध बंद करने का समय है।'
            : '🥛 दूध बंद करने का समय नजदीक है (' +
              dryDiff +
              ' दिन बाकी).';
      }

      else{

        dryTxt =
          dryDiff === 0
            ? '🥛 आज दूध बंद करण्याची (आटवण्याची) वेळ आली आहे.'
            : '🥛 दूध आटवण्याची वेळ जवळ येत आहे (' +
              dryDiff +
              ' दिवस बाकी).';
      }

      alerts.push({
        name:animalName,
        text:dryTxt
      });
    }

    /*
      Transition Feed notification intentionally नाही.
    */
  }

  if(alerts.length === 0){

    banner.style.display = 'none';
    list.innerHTML = '';

    return;
  }

  let html = '';

  for(let i=0; i<alerts.length; i++){

    html +=
      '<div class="notif-item">' +

      '<div style="font-weight:900;color:#991b1b;">' +
      alerts[i].name +
      '</div>' +

      '<div style="color:#c2410c;">' +
      alerts[i].text +
      '</div>' +

      '</div>';
  }

  list.innerHTML = html;
  banner.style.display = 'block';
}

function saveData(){

  const dt =
    document.getElementById(
      'cDate'
    ).value;

  const lang =
    document.getElementById(
      'langSelect'
    ).value;

  const t =
    langData[lang] || langData.mr;

  const inputDate =
    parseISODate(dt);

  if(!inputDate){

    alert(t.dateRequired);
    return;
  }

  if(inputDate > getTodayDate()){

    alert(t.futureDateError);
    return;
  }

  const nm =
    document.getElementById(
      'cName'
    ).value.trim() ||
    (
      cur === 'cow'
        ? t.bCow
        : t.bBuf
    );

  const nt =
    document.getElementById(
      'cNote'
    ).value.trim();

  const previewImg =
    document.getElementById(
      'photoPreview'
    );

  const photo =
    previewImg.style.display === 'block'
      ? previewImg.src
      : '';

  const db =
    getDB();

  db.unshift({

    id:Date.now(),

    name:nm,

    type:cur,

    date:dt,

    note:nt,

    photo:photo,

    isCalved:false,

    calvedDate:'',

    isAssumedCalved:false
  });

  try{

    localStorage.setItem(
      'cattle_tracker_db',
      JSON.stringify(db)
    );

  }catch(e){

    alert(t.storageError);
    return;
  }

  document.getElementById(
    'cName'
  ).value = '';

  document.getElementById(
    'cNote'
  ).value = '';

  document.getElementById(
    'cPhoto'
  ).value = '';

  previewImg.style.display = 'none';

  setTodayMaxDate();

  draw();
}

function delData(id){

  const lang =
    document.getElementById(
      'langSelect'
    ).value;

  const t =
    langData[lang] || langData.mr;

  if(!confirm(t.confirmDel)){
    return;
  }

  const db =
    getDB().filter(
      item =>
        Number(item.id) !== Number(id)
    );

  localStorage.setItem(
    'cattle_tracker_db',
    JSON.stringify(db)
  );

  draw();
}

function initApp(){

  let unlocked = false;

  try{

    unlocked =
      localStorage.getItem(
        'cattle_unlocked'
      ) === 'true';

  }catch(e){}

  if(!unlocked){

    document.getElementById(
      'lockScreen'
    ).style.display = 'flex';

    document.getElementById(
      'appScreen'
    ).style.display = 'none';

    return;
  }

  document.getElementById(
    'lockScreen'
  ).style.display = 'none';

  document.getElementById(
    'appScreen'
  ).style.display = 'block';

  let savedLang = 'mr';

  try{

    savedLang =
      localStorage.getItem(
        'cattle_lang'
      ) || 'mr';

  }catch(e){}

  document.getElementById(
    'langSelect'
  ).value = savedLang;

  setTodayMaxDate();

  changeLanguage();
}

if(document.readyState === 'loading'){

  document.addEventListener(
    'DOMContentLoaded',
    initApp
  );

}else{

  initApp();
}
</script>
