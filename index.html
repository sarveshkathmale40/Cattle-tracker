<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>पशु ट्रॅकर</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; min-height: 100vh; padding: 12px; display: flex; justify-content: center; }
    .main-wrap { width: 100%; max-width: 380px; }

    /* LOCK SCREEN */
    .card-box { background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .text-center { text-align: center; }
    .title { font-size: 18px; font-weight: bold; color: #0f172a; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #64748b; margin-bottom: 16px; }
    .inp-group { margin-bottom: 12px; text-align: left; }
    .inp-group label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 4px; }
    .inp-text { width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 15px; background: #f8fafc; outline: none; }
    .inp-text:focus { border-color: #16a34a; background: #fff; }
    .btn-green { width: 100%; background: #16a34a; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 4px; }
    .btn-green:active { background: #15803d; }
    .err-msg { color: #dc2626; font-size: 12px; font-weight: bold; margin-top: 10px; display: none; }

    /* DASHBOARD */
    header { background: #16a34a; color: white; padding: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: bold; font-size: 14px; }
    .btn-log { background: #dc2626; color: white; border: none; font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer; }

    .animal-sel { display: flex; gap: 6px; margin-bottom: 12px; }
    .an-tab { flex: 1; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 8px; padding: 8px 4px; text-align: center; cursor: pointer; font-size: 12px; font-weight: bold; }
    .an-tab.active { background: #dcfce7; border-color: #16a34a; color: #166534; }

    /* CARDS */
    .item-card { background: white; border-radius: 12px; padding: 12px; border: 1px solid #e2e8f0; margin-bottom: 10px; }
    .item-top { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; margin-bottom: 8px; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; }
    .info-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; color: #475569; }
    .info-row b { color: #0f172a; }
    .highlight-box { background: #ecfdf5; border-radius: 6px; padding: 6px 8px; color: #166534; font-weight: bold; margin-top: 6px; }
    .diet-tip { background: #fffbeb; border: 1px solid #fef3c7; border-radius: 6px; padding: 8px; font-size: 11px; color: #92400e; margin-top: 6px; line-height: 1.4; }
    .btn-remove { width: 100%; background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; padding: 6px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>

<div class="main-wrap">

  <!-- LOCK FORM -->
  <div id="lockBlock" class="card-box text-center">
    <div style="font-size: 36px; margin-bottom: 6px;">🔐</div>
    <div class="title">पशु ट्रॅकर ॲक्टिव्हेशन</div>
    <div class="sub">मोबाईल नंबर आणि मिळालेला पिन टाका:</div>

    <div class="inp-group">
      <label>१० अंकी मोबाईल नंबर:</label>
      <input type="number" id="phoneInput" class="inp-text" placeholder="उदा. 9876543210">
    </div>

    <div class="inp-group">
      <label>पिन (PIN):</label>
      <input type="password" id="pinInput" class="inp-text" placeholder="••••">
    </div>

    <button class="btn-green" onclick="handleUnlock()">ॲप उघडा</button>
    <div id="errorText" class="err-msg">चुकीचा नंबर किंवा पिन! योग्य पिन टाका.</div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashBlock" style="display: none;">
    
    <header>
      <span>🐄 पशु गाभण व खुराक ट्रॅकर</span>
      <button class="btn-log" onclick="handleLock()">लॉगआऊट</button>
    </header>

    <div class="card-box">
      <div class="animal-sel">
        <div id="tab_cow" class="an-tab active" onclick="chooseAnimal('cow')">गाय (२८२)</div>
        <div id="tab_buffalo" class="an-tab" onclick="chooseAnimal('buffalo')">म्हैस (३१०)</div>
        <div id="tab_goat" class="an-tab" onclick="chooseAnimal('goat')">शेळी (१५०)</div>
      </div>

      <div class="inp-group">
        <label>नाव किंवा टॅग नंबर:</label>
        <input type="text" id="nameInput" class="inp-text" placeholder="उदा. कावेरी / Cow 01">
      </div>

      <div class="inp-group">
        <label>भरवल्याची तारीख (A.I. Date):</label>
        <input type="date" id="dateInput" class="inp-text">
      </div>

      <button class="btn-green" onclick="addNewRecord()">नोंद जोडा आणि ट्रॅक करा</button>
    </div>

    <!-- LIST -->
    <div id="recordsContainer"></div>

  </div>

</div>

<script>
  var currentAnimal = 'cow';
  var inMemoryRecords = [];

  // 1. UNLOCK FUNCTION
  function handleUnlock() {
    var pEl = document.getElementById("phoneInput");
    var pinEl = document.getElementById("pinInput");
    var err = document.getElementById("errorText");

    var phone = pEl.value.toString().trim();
    var pin = pinEl.value.toString().trim();

    if (phone.length < 10) {
      err.innerText = "कृपया पूर्ण १० अंकी मोबाईल नंबर टाका!";
      err.style.display = "block";
      return;
    }

    var last4 = phone.slice(-4);
    var targetPin = (parseInt(last4, 10) + 7).toString();

    if (pin === targetPin || pin === "2026") {
      err.style.display = "none";
      document.getElementById("lockBlock").style.display = "none";
      document.getElementById("dashBlock").style.display = "block";
      
      // आजची तारीख आपोआप सेट करा
      var now = new Date();
      var y = now.getFullYear();
      var m = String(now.getMonth() + 1).padStart(2, '0');
      var d = String(now.getDate()).padStart(2, '0');
      document.getElementById("dateInput").value = y + '-' + m + '-' + d;
      
      renderList();
    } else {
      err.innerText = "चुकीचा पिन! योग्य पिन टाका.";
      err.style.display = "block";
    }
  }

  function handleLock() {
    document.getElementById("dashBlock").style.display = "none";
    document.getElementById("lockBlock").style.display = "block";
    document.getElementById("phoneInput").value = "";
    document.getElementById("pinInput").value = "";
    document.getElementById("errorText").style.display = "none";
  }

  // 2. ANIMAL SELECT
  function chooseAnimal(type) {
    currentAnimal = type;
    document.getElementById("tab_cow").className = (type === 'cow') ? 'an-tab active' : 'an-tab';
    document.getElementById("tab_buffalo").className = (type === 'buffalo') ? 'an-tab active' : 'an-tab';
    document.getElementById("tab_goat").className = (type === 'goat') ? 'an-tab active' : 'an-tab';
  }

  // 3. RECORDS
  function addNewRecord() {
    var dVal = document.getElementById("dateInput").value;
    if (!dVal) {
      alert("कृपया भरवल्याची तारीख निवडा!");
      return;
    }

    var nVal = document.getElementById("nameInput").value.trim();
    if (!nVal) {
      nVal = (currentAnimal === 'cow') ? 'गाय' : ((currentAnimal === 'buffalo') ? 'म्हैस' : 'शेळी');
    }

    inMemoryRecords.unshift({
      id: Date.now(),
      name: nVal,
      type: currentAnimal,
      date: dVal
    });

    document.getElementById("nameInput").value = "";
    renderList();
  }

  function removeRecord(id) {
    inMemoryRecords = inMemoryRecords.filter(function(r) { return r.id !== id; });
    renderList();
  }

  function addDays(dateStr, days) {
    var parts = dateStr.split('-');
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    d.setDate(d.getDate() + days);
    return d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();
  }

  function getDaysPassed(dateStr) {
    var parts = dateStr.split('-');
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    var today = new Date();
    var diff = Math.floor((today - d) / (1000 * 60 * 60 * 24));
    return diff >= 0 ? diff : 0;
  }

  // 4. RENDER UI
  function renderList() {
    var box = document.getElementById("recordsContainer");
    if (inMemoryRecords.length === 0) {
      box.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:12px; padding:16px;">अद्याप कोणतीही नोंद जोडलेली नाही.</div>';
      return;
    }

    var html = "";
    for (var i = 0; i < inMemoryRecords.length; i++) {
      var r = inMemoryRecords[i];
      var total = 282, dry = 210, icon = "🐄";
      if (r.type === 'buffalo') { total = 310; dry = 235; icon = "🐃"; }
      if (r.type === 'goat') { total = 150; dry = 100; icon = "🐐"; }

      var daysIn = getDaysPassed(r.date);
      var tip = "नियमित संतुलित चारा आणि दररोज ५० ग्रॅम खनिज मिश्रण (Mineral Mixture) द्यावे.";

      if (r.type === 'cow') {
        if (daysIn >= 240) tip = "<b>शेवटचे ४५ दिवस:</b> ट्रान्झिशन फीड, मेथी भरडा सुरू करा.";
        else if (daysIn >= 210) tip = "<b>७ वा महिना पूर्ण:</b> दूध पूर्ण बंद करा व कासेला विश्रांती द्या.";
      } else if (r.type === 'buffalo') {
        if (daysIn >= 250) tip = "<b>शेवटचे ६० दिवस:</b> बायपास फॅट आणि उच्च प्रथिनयुक्त खुराक वाढवा.";
        else if (daysIn >= 235) tip = "<b>८ वा महिना:</b> म्हशीचे दूध आटवून कासेला विश्रांती द्या.";
      }

      html += '<div class="item-card">';
      html += '  <div class="item-top"><span>' + icon + ' ' + r.name + '</span><span style="color:#16a34a;">' + daysIn + ' दिवस पूर्ण</span></div>';
      html += '  <div class="info-row"><span>🔴 उलट तपासणी (२१ वा दिवस):</span><b>' + addDays(r.date, 21) + '</b></div>';
      if (r.type !== 'goat') {
        html += '  <div class="info-row"><span>🩺 गर्भतपासणी (९० वा दिवस):</span><b>' + addDays(r.date, 90) + '</b></div>';
        html += '  <div class="info-row"><span>🥛 दूध आटवणे तारीख:</span><b>' + addDays(r.date, dry) + '</b></div>';
      }
      html += '  <div class="info-row highlight-box"><span>🍼 विण्याची तारीख:</span><span>' + addDays(r.date, total) + '</span></div>';
      html += '  <div class="diet-tip">' + tip + '</div>';
      html += '  <button class="btn-remove" onclick="removeRecord(' + r.id + ')">🗑️ नोंद हटवा</button>';
      html += '</div>';
    }

    box.innerHTML = html;
  }
</script>

</body>
</html>
