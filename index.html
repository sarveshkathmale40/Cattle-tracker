<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>पशु ट्रॅकर - ॲक्टिव्हेशन</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #15803d; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #ffffff; width: 100%; max-width: 340px; border-radius: 20px; padding: 24px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .icon { font-size: 40px; margin-bottom: 8px; }
    h2 { font-size: 18px; color: #0f172a; margin-bottom: 4px; }
    p { font-size: 12px; color: #64748b; margin-bottom: 16px; }
    .field { text-align: left; margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: bold; color: #334155; margin-bottom: 4px; }
    input { width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; background: #f8fafc; text-align: center; font-weight: bold; }
    input:focus { border-color: #16a34a; background: #fff; }
    .btn { width: 100%; background: #16a34a; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .err { color: #dc2626; font-size: 12px; font-weight: bold; margin-top: 10px; display: none; }
    .success-box { display: none; }
    .success-box h3 { color: #16a34a; font-size: 18px; margin-bottom: 8px; }
  </style>
</head>
<body>

<div class="card">
  <!-- Lock Form -->
  <div id="lockSection">
    <div class="icon">🔐</div>
    <h2>ॲप ॲक्टिव्हेशन</h2>
    <p>नोंदणी केलेला मोबाईल नंबर आणि पिन टाका:</p>

    <div class="field">
      <label>१० अंकी मोबाईल नंबर:</label>
      <input type="tel" id="userPhone" maxlength="10" placeholder="उदा. 9876543210">
    </div>

    <div class="field">
      <label>ॲक्टिव्हेशन पिन:</label>
      <input type="password" id="userPin" maxlength="6" placeholder="••••">
    </div>

    <button class="btn" onclick="checkAuth()">ॲप अनलॉक करा</button>
    <div id="errMsg" class="err">चुकीचा मोबाईल नंबर किंवा पिन!</div>
  </div>

  <!-- Success Screen -->
  <div id="successSection" class="success-box">
    <div class="icon">✅</div>
    <h3>अभिनंदन!</h3>
    <p style="color: #334155; font-size: 13px;">पासवर्ड बरोबर आहे. ॲप यशस्वीरीत्या अनलॉक झाले आहे!</p>
  </div>
</div>

<script>
  function checkAuth() {
    var rawPhone = document.getElementById("userPhone").value.trim();
    var rawPin = document.getElementById("userPin").value.trim();
    var err = document.getElementById("errMsg");

    // Remove any spaces or special characters
    var phone = rawPhone.replace(/\D/g, "");
    var pin = rawPin.replace(/\D/g, "");

    if (phone.length !== 10) {
      err.innerText = "कृपया पूर्ण १० अंकी मोबाईल नंबर टाका!";
      err.style.display = "block";
      return;
    }

    var last4 = phone.slice(-4);
    var expectedFormulaPin = (parseInt(last4, 10) + 7).toString();

    // 1. Formula PIN (+7), 2. Same last 4 digits, 3. Master PIN 2026
    if (pin === expectedFormulaPin || pin === last4 || pin === "2026") {
      err.style.display = "none";
      document.getElementById("lockSection").style.display = "none";
      document.getElementById("successSection").style.display = "block";
    } else {
      err.innerText = "चुकीचा पिन! योग्य पिन टाका.";
      err.style.display = "block";
    }
  }
</script>

</body>
</html>
