    }

      font-weight: bold;
      margin-bottom: 5px;

    }

      font-size: 28px;
    }

      margin-top: 12px;
    }

      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

      resize: vertical;
      min-height: 80px;
    }

      display: flex;
      gap: 10px;
      margin: 15px 0;
    }

    .stat {
      flex: 1;
      background: white;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .stat-number {
      font-size: 25px;
      font-weight: bold;
      color: #2e7d32;
    }

    .card {
      background: white;
      padding: 18px;
      margin-top: 15px;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #2e7d32;
      font-size: 20px;
    }

      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

      flex: 1;
      border: 2px solid #ddd;
      background: white;
      padding: 14px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    .animal-btn.active {
      border-color: #2e7d32;
      background: #e8f5e9;
    }

    button {
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .save-btn {
      width: 100%;
      margin-top: 15px;
      background: #2e7d32;
      color: white;
      font-weight: bold;
    }

    .save-btn:hover {
      background: #256628;
    }

    .record {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }

    .record img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 10px;
    }

    .record-name {
      font-size: 19px;
      font-weight: bold;
      color: #2e7d32;
    }

    .record-line {
      margin-top: 7px;
      font-size: 14px;
    }

    .record-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .repeat-btn {
      flex: 1;
      background: #1976d2;
      color: white;
    }

    .delete-btn {
      flex: 1;
      background: #d32f2f;
      color: white;
    }

    .photo-preview {
      display: none;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      margin-top: 10px;
      border-radius: 10px;
    }

      border: 1px solid #f0d96b;
      padding: 15px;
      margin-top: 15px;
      border-radius: 15px;
    }

    .reminder-title {

      font-weight: bold;
      color: #795548;
      margin-bottom: 10px;

  /* =========================
     DATABASE
  ========================= */

  const DB_KEY = "cattle_tracker_db";

  function getDB() {

    try {
      return JSON.parse(
        localStorage.getItem(DB_KEY)
      ) || [];
    } catch (e) {
      return [];
    }
  }

  function saveDB(data) {

    localStorage.setItem(
      DB_KEY,
      JSON.stringify(data)
    );
  }

  ========================= */

  function selectAnimal(type) {

    cur = type;

    document
      .getElementById("cowBtn")
      .classList
      .toggle("active", type === "cow");

    document
      .getElementById("buffaloBtn")
      .classList
      .toggle("active", type === "buffalo");
  }


  /* =========================
     DATE FUNCTIONS
  ========================= */

  function dateFromString(str) {

    const parts = String(str).split("-");

    if (parts.length !== 3) {
      return new Date(str);
    }

    return new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );
  }


  function dateOnly(date) {

    return new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );
  }


  function daysBetween(date1, date2) {

    const d1 = dateOnly(date1);
    const d2 = dateOnly(date2);

    return Math.round(
      (d2 - d1) /
      (1000 * 60 * 60 * 24)
    );
  }


  function addDaysForReminder(baseDate, days) {

    const d = new Date(baseDate);

    d.setDate(
      d.getDate() + days
    );

    return d;
  }


  function formatReminderDate(date) {

    const day =
      String(date.getDate()).padStart(2, "0");

    const month =
      String(date.getMonth() + 1).padStart(2, "0");

    const year =
      date.getFullYear();

    return (
      day +
      "/" +
      month +
      "/" +
      year
    );
  }


  /* =========================
     PREGNANCY REMINDER DATA
  ========================= */

  function getReminderData(item) {

    let totalDays = 282;
    let dryDays = 210;

    if (item.type === "buffalo") {

      totalDays = 310;
      dryDays = 235;
    }

    const pregnancyDate =
      dateFromString(item.date);

    return {

      animal: item,

      heatDate:
        addDaysForReminder(
          pregnancyDate,
          21
        ),

      dryDate:
        addDaysForReminder(
          pregnancyDate,
          dryDays
        ),

      transitionDate:
        addDaysForReminder(
          pregnancyDate,
          totalDays - 21
        ),

      deliveryDate:
        addDaysForReminder(
          pregnancyDate,
          totalDays
        )
    };
  }


  /* =========================
     REMINDER CREATOR
  ========================= */

  function addReminder(
    container,
    item,
    date,
    text,
    kind,
    t
  ) {

    const today =
      dateOnly(new Date());

    const reminderDate =
      dateOnly(date);

    const diff =
      daysBetween(
        today,
        reminderDate
      );

    let statusText = t.upcoming;
    let statusClass = "reminder-upcoming";

    if (diff === 0) {

      statusText = t.today;
      statusClass = "reminder-today";

    } else if (diff < 0) {

      statusText = t.overdue;
      statusClass = "reminder-today";
    }

    const emoji =
      item.type === "buffalo"
        ? "🐃"
        : "🐄";

    let finalText = text;

    if (
      kind === "delivery" &&
      diff > 0
    ) {
      finalText = t.deliverySoon;
    }

    const div =
      document.createElement("div");

    div.className =
      "reminder-item";

    div.innerHTML = `
      <div class="reminder-name">
        ${emoji} ${escapeHTML(item.name || "")}
      </div>

      <div class="reminder-text">
        ${finalText}
      </div>

      <div class="reminder-date ${statusClass}">
        ${statusText} •
        ${formatReminderDate(reminderDate)}
      </div>
    `;

    container.appendChild(div);
  }


  /* =========================
     DRAW REMINDERS
  ========================= */

  function drawReminders() {

    const lang =
      localStorage.getItem("cattle_lang") || "mr";

    const t =
      langData[lang];

    const list =
      document.getElementById(
        "reminderList"
      );

    if (!list) return;

    list.innerHTML = "";

    const db = getDB();

    const today =
      dateOnly(new Date());

    let reminderCount = 0;

    db.forEach(function(item) {

      if (!item.date) return;

      const data =
        getReminderData(item);

      const deliveryDate =
        dateOnly(
          data.deliveryDate
        );

      if (deliveryDate < today) {
        return;
      }

      const reminders = [

        {
          date: data.heatDate,
          text: t.heatReminder,
          kind: "heat"
        },

        {
          date: data.dryDate,
          text: t.dryReminder,
          kind: "dry"
        },

        {
          date: data.transitionDate,
          text: t.transitionReminder,
          kind: "transition"
        },

        {
          date: data.deliveryDate,
          text: t.deliveryReminder,
          kind: "delivery"
        }

      ];

      reminders.forEach(
        function(reminder) {

          const diff =
            daysBetween(
              today,
              dateOnly(
                reminder.date
              )
            );

          /*
            आजचे,
            मागील 30 दिवसांतील overdue,
            किंवा पुढील 7 दिवसांचे reminders.
          */

          if (
            diff >= -30 &&
            diff <= 7
          ) {

            addReminder(
              list,
              item,
              reminder.date,
              reminder.text,
              reminder.kind,
              t
            );

            reminderCount++;
          }

        }
      );

    });


    if (reminderCount === 0) {

      const empty =
        document.createElement("div");

      empty.className =
        "reminder-empty";

      empty.textContent =
        t.noReminder;

      list.appendChild(empty);
    }
  }

  /* =========================
     IMAGE COMPRESSION
  ========================= */

  function compressImage(file) {

    return new Promise(
      function(resolve, reject) {

        const reader =
          new FileReader();

        reader.onerror =
          function() {
            reject(
              new Error(
                "Photo could not be read."
              )
            );
          };

        reader.onload =
          function(event) {

            const img =
              new Image();

            img.onerror =
              function() {
                reject(
                  new Error(
                    "Photo could not be loaded."
                  )
                );
              };

            img.onload =
              function() {

                const canvas =
                  document.createElement(
                    "canvas"
                  );

                const maxWidth = 900;

                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {

                  height =
                    height *
                    maxWidth /
                    width;

                  width = maxWidth;
                }

                canvas.width = width;
                canvas.height = height;

                const ctx =
                  canvas.getContext("2d");

                ctx.drawImage(
                  img,
                  0,
                  0,
                  width,
                  height
                );

                resolve(
                  canvas.toDataURL(
