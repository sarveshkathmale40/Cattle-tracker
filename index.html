<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#047857">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The MH Farmer">

<link rel="manifest" href="manifest.json">
<title>The MH Farmer - Cattle Pregnancy Tracker</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:radial-gradient(circle at top,#f0fdf4 0%,#e2f8eb 40%,#cbd5e1 100%);min-height:100vh;padding:12px;color:#0f172a;display:flex;justify-content:center;align-items:flex-start;}
.wrap{width:100%;max-width:420px;margin:0 auto;}

/* Lock Screen */
#lockScreen{display:flex;flex-direction:column;justify-content:center;min-height:90vh;}
.lock-card{background:rgba(255,255,255,0.98);border-radius:28px;padding:26px;box-shadow:0 20px 40px rgba(0,0,0,.12);border:2px solid #34d399;text-align:center;}
.lock-title{font-size:24px;font-weight:900;color:#064e3b;margin-bottom:8px;letter-spacing:.5px;}
.lock-sub{font-size:12.5px;color:#475569;margin-bottom:22px;font-weight:700;line-height:1.5;}

/* Header Section */
.app-header{
  background:linear-gradient(135deg,#022c22 0%,#064e3b 45%,#047857 100%);
  border-radius:24px;
  padding:14px 16px;
  margin-bottom:14px;
  box-shadow:0 16px 36px -8px rgba(4,120,87,.55);
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:white;
  border:2px solid #34d399;
  gap:10px;
}
.header-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  flex:1;
}
.header-title{
  font-size:19px;
  font-weight:900;
  color:#ffffff;
  line-height:1.2;
  white-space:nowrap;
}
.tracker-pill{
  display:inline-block;
  background:rgba(0,0,0,0.28);
  border:1px solid rgba(52,211,153,0.45);
  padding:3px 10px;
  border-radius:20px;
  margin-top:4px;
}
.header-sub{
  font-size:9.5px;
  color:#a7f3d0;
  font-weight:800;
  letter-spacing:.6px;
  text-transform:uppercase;
  white-space:nowrap;
}

.lang-wrap{
  flex-shrink:0;
}
#langSelect{
  background:rgba(2,44,34,0.85);
  color:#ffffff;
  border:1.5px solid #34d399;
  border-radius:14px;
  padding:8px 12px;
  font-size:13px;
  font-weight:800;
  outline:none;
  cursor:pointer;
  width:auto;
}

/* APK Direct Download Button */
.apk-download-banner {
  display: flex;
  background: linear-gradient(135deg, #059669 0%, #10b981 100%);
  color: white;
  padding: 13px 16px;
  border-radius: 16px;
  margin-bottom: 14px;
  text-align: center;
  box-shadow: 0 8px 20px rgba(16,185,129,.35);
  font-size: 14px;
  font-weight: 800;
  border: 1.5px solid #34d399;
  width: 100%;
  cursor: pointer;
  justify-content: center;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}
.apk-download-banner:active {
  transform: scale(0.98);
}

/* Notification Banner */
.notification-banner{background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%);border:2px solid #f59e0b;border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 8px 25px rgba(217,119,6,.18);}
.notif-title{font-size:13.5px;font-weight:900;color:#b45309;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.notif-list{display:flex;flex-direction:column;gap:8px;}
.notif-item{background:white;border-radius:12px;padding:10px 12px;font-size:12px;color:#78350f;font-weight:700;border:1.5px solid #fde68a;line-height:1.45;border-left:5px solid #d97706;}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.stat{background:white;padding:12px 8px;border-radius:18px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.06);border:2px solid #e2e8f0;}
.stat-number{font-size:20px;font-weight:900;color:#047857;}
.stat-label{font-size:11px;color:#475569;font-weight:800;margin-top:2px;text-transform:uppercase;}

/* Form Card */
.card{background:#ffffff;border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.06);border:2px solid #e2e8f0;}
.card h3{font-size:15.5px;margin-bottom:12px;color:#047857;font-weight:900;display:flex;align-items:center;gap:6px;}

label{display:block;text-align:left;font-size:11.5px;font-weight:800;color:#334155;margin-bottom:5px;margin-left:3px;}
input,select{width:100%;padding:11px 14px;border:2px solid #cbd5e1;border-radius:14px;font-size:14.5px;outline:none;background:#f8fafc;margin-bottom:10px;font-weight:700;}
input:focus,select:focus{border-color:#059669;background:white;}

.split-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}

.animal-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
.animal-btn{border:2px solid #cbd5e1;background:#f8fafc;padding:12px 8px;border-radius:14px;cursor:pointer;font-weight:900;color:#475569;text-align:center;font-size:14px;}
.animal-btn.active{border-color:#059669;background:#d1fae5;color:#064e3b;}

.btn{width:100%;background:linear-gradient(135deg,#059669 0%,#047857 100%);color:white;border:none;padding:14px;border-radius:14px;font-weight:900;font-size:15.5px;cursor:pointer;margin-top:6px;box-shadow:0 8px 22px rgba(5,150,105,.4);}
.btn:active{transform:scale(.97);}

.photo-preview{width:70px;height:70px;border-radius:16px;object-fit:cover;display:none;margin:6px auto 10px;cursor:pointer;border:2px solid #059669;}

/* Records Item */
.item{background:#ffffff;border-radius:20px;padding:14px;border:2px solid #e2e8f0;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 6px 20px rgba(0,0,0,.04);contain:content;}
.cow-img{width:76px;height:76px;border-radius:16px;background:#e2e8f0;display:flex;justify-content:center;align-items:center;font-size:34px;flex-shrink:0;overflow:hidden;border:2px solid #cbd5e1;cursor:pointer;}
.cow-img img{width:100%;height:100%;object-fit:cover;}
.item-info{flex-grow:1;min-width:0;}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:900;font-size:13px;border-bottom:2px solid #f1f5f9;padding-bottom:6px;margin-bottom:6px;}
.duration-badge{background:#eff6ff;color:#1d4ed8;font-weight:900;font-size:11.5px;padding:4px 9px;border-radius:10px;border:1.5px solid #93c5fd;white-space:nowrap;}

.row{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;padding:6px 0;color:#334155;font-weight:700;border-bottom:1px dashed #cbd5e1;}
.date-badge{background:#fefce8;color:#854d0e;padding:3px 8px;border-radius:7px;font-size:11px;font-weight:900;border:1.5px solid #fef08a;text-align:right;width:95px;flex-shrink:0;}

.due{background:#f0fdf4;padding:7px 10px;border-radius:12px;color:#14532d;font-weight:900;margin-top:8px;font-size:12px;border:1.5px solid #86efac;display:flex;justify-content:space-between;align-items:center;}
.due-badge{background:#16a34a;color:white;padding:3px 8px;border-radius:7px;font-size:11.5px;font-weight:900;text-align:right;width:95px;flex-shrink:0;}

.note-box{background:#fffbeb;border:1.5px solid #fcd34d;border-radius:10px;padding:8px 10px;font-size:11.5px;color:#78350f;margin-top:6px;font-weight:700;display:flex;flex-direction:column;gap:3px;}
.small-assumption-note{font-size:11.5px;color:#334155;font-weight:700;margin-top:8px;line-height:1.45;background:#f8fafc;padding:10px 12px;border-radius:12px;border:1.5px solid #cbd5e1;}

/* Action Buttons */
.action-btns{display:flex;gap:8px;margin-top:10px;}
.btn-repeat{flex:1;background:#d1fae5;color:#064e3b;border:1px solid #10b981;padding:11px 6px;border-radius:12px;font-weight:900;font-size:11.5px;cursor:pointer;text-align:center;}
.btn-calved{flex:1;background:#bae6fd;color:#0c4a6e;border:1px solid #0284c7;padding:11px 6px;border-radius:12px;font-weight:900;font-size:11.5px;cursor:pointer;text-align:center;}
.btn-del{flex:0 0 auto;background:#fee2e2;color:#991b1b;border:1px solid #fb7185;padding:11px 12px;border-radius:12px;font-weight:900;font-size:11.5px;cursor:pointer;text-align:center;}

.empty{text-align:center;color:#64748b;font-size:13px;padding:24px;font-weight:800;}

/* Modal */
.date-modal{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.65);z-index:99999;justify-content:center;align-items:center;padding:16px;}
.date-modal-card{background:white;padding:22px;border-radius:24px;width:100%;max-width:330px;box-shadow:0 20px 40px rgba(0,0,0,0.3);text-align:center;border:2px solid #047857;}
.date-modal-card h4{font-size:16px;color:#047857;margin-bottom:14px;font-weight:900;}

/* Zoom */
#imageZoomModal{display:none;position:fixed;z-index:99999;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.94);justify-content:center;align-items:center;flex-direction:column;padding:16px;}
#zoomedImage{max-width:96%;max-height:82%;object-fit:contain;border-radius:16px;}
.modal-close-btn{position:absolute;top:22px;right:22px;color:white;font-size:34px;font-weight:bold;cursor:pointer;}
</style>
</head>

<body>

<div class="wrap">

  <!-- LOCK SCREEN -->
  <div id="lockScreen" style="display:none;">
    <div class="lock-card">
      <div class="lock-title">🔐 The MH Farmer</div>
      <div class="lock-sub" id="lockSubTxt">ॲप वापरण्यासाठी तुमचा मोबाईल नंबर आणि पिन प्रविष्ट करा</div>
      <label id="lblMob">मोबाईल नंबर (१० अंकी)</label>
      <input type="tel" id="loginMob" maxlength="10" inputmode="numeric" placeholder="१० अंकी मोबाईल नंबर">
      <label id="lblPin">सिक्रेट पिन (PIN)</label>
      <input type="password" id="loginPin" maxlength="4" inputmode="numeric" placeholder="४ अंकी पिन">
      <button class="btn" type="button" id="btnLogin" onclick="verifyLogin()">ॲप सुरू करा 🚀</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appScreen" style="display:none;">

    <!-- APP HEADER -->
    <div class="app-header">
      <div class="header-left">
        <span style="font-size:26px;">🌾</span>
        <div>
          <div class="header-title">The MH Farmer</div>
          <div class="tracker-pill">
            <div class="header-sub" id="mainHeaderSub">Cattle Pregnancy Tracker</div>
          </div>
        </div>
      </div>
      <div class="lang-wrap">
        <select id="langSelect" onchange="changeLanguage()">
          <option value="mr">मराठी</option>
          <option value="hi">हिंदी</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <!-- DIRECT APK DOWNLOAD BUTTON -->
    <a href="./MH%20Farmer.apk" download="MH_Farmer.apk" id="apkDownloadBtn" class="apk-download-banner">
      <span>📥 ॲप डाऊनलोड करा (.APK)</span>
    </a>

    <div id="notifBannerBox" class="notification-banner" style="display:none;">
      <div class="notif-title" id="notifTitleText">🔔 महत्त्वाचे अलर्ट्स व सूचना</div>
      <div id="notifListContainer" class="notif-list"></div>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-number" id="totalCount">0</div><div class="stat-label" id="lblTotal">एकूण नोंद</div></div>
      <div class="stat"><div class="stat-number" id="cowCount">0</div><div class="stat-label" id="lblCow">गाय</div></div>
      <div class="stat"><div class="stat-number" id="buffaloCount">0</div><div class="stat-label" id="lblBuf">म्हैस</div></div>
    </div>

    <div class="card">
      <h3 id="formTitle">➕ नवीन पशु नोंद</h3>
      
      <div class="animal-buttons">

        <button class="animal-btn" id="buffaloBtn" type="button" onclick="selectAnimal('buffalo')">🐃 <span id="btnBufTxt">म्हैस</span></button>
      </div>

      <label id="lblNameLbl">पशुचे नाव / टॅग नंबर</label>
      <input type="text" id="cName" placeholder="उदा. कावेरी">

      <label id="lblDate">गाय गाभण राहिल्याची तारीख</label>
      <input type="date" id="cDate">

      <label id="lblNoteLbl">डॉक्टर व सिमेन तपशील (पर्यायी)</label>
      <div class="split-inputs">
        <input type="text" id="cDoc" placeholder="डॉक्टरचे नाव">
        <input type="text" id="cSemen" placeholder="सिमेन ब्रँड/नाव">
      </div>

      <label id="lblPhotoLbl">पशुचा फोटो (पर्यायी)</label>
      <input type="file" id="cPhoto" accept="image/*" onchange="previewPhoto()">
      <img id="photoPreview" class="photo-preview" alt="Preview" onclick="openImageModal(this.src)">

      <button class="btn" id="btnSave" type="button" onclick="saveData()">💾 रेकॉर्ड सेव्ह करा</button>
    </div>

    <div class="card">
      <h3 id="listTitle">📋 पशु रेकॉर्ड यादी</h3>
      <div id="list"></div>
    </div>

  </div>

</div>

<!-- Modal -->
<div id="customDateModal" class="date-modal">
  <div class="date-modal-card">
    <h4 id="modalTitleText">तारीख निवडा</h4>
    
    <label style="text-align:left; font-size:11.5px; font-weight:800; color:#334155; margin-bottom:4px;" id="modalDateLbl">तारीख निवडा</label>
    <input type="date" id="modalDateInput" style="margin-bottom:12px;">

    <div id="modalDoctorSemenContainer" style="display:none;">
      <label style="text-align:left; font-size:11.5px; font-weight:800; color:#334155; margin-bottom:4px;" id="lblDocName">डॉक्टरचे नाव</label>
      <input type="text" id="modalDoctorInput" placeholder="उदा. डाॅ. पाटील" style="margin-bottom:10px;">

      <label style="text-align:left; font-size:11.5px; font-weight:800; color:#334155; margin-bottom:4px;" id="lblSemenName">सिमेन ब्रँड / नाव</label>
      <input type="text" id="modalSemenInput" placeholder="उदा. एचएफ / जर्सी" style="margin-bottom:14px;">
    </div>

    <button class="btn" type="button" onclick="submitModalDate()">✅ ओके</button>
    <button class="btn" type="button" style="background:#64748b; margin-top:8px;" onclick="closeDateModal()">रद्द करा</button>
  </div>
</div>

<!-- Zoom -->
<div id="imageZoomModal" onclick="closeImageModal()">
  <div class="modal-close-btn" onclick="closeImageModal()">&times;</div>
  <img id="zoomedImage" src="" alt="Zoomed Photo" onclick="event.stopPropagation()">
</div>

<script>
'use strict';

/* --- 1. PERSISTENT STORAGE LOCK & OFFLINE CACHE --- */
async function enablePersistentStorageLock() {
  if (navigator.storage && navigator.storage.persist) {
    try {
      await navigator.storage.persist();
    } catch (e) {}
  }
}
enablePersistentStorageLock();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Error:', err));
  });
}

/* --- 2. INDEXEDDB ENGINE --- */
const DB_NAME = 'TheMHFarmer_DB';
const DB_VERSION = 1;
let dbInstance = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (dbInstance) return resolve(dbInstance);
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings');
      if (!db.objectStoreNames.contains('records')) db.createObjectStore('records', { keyPath: 'id' });
    };
    req.onsuccess = (e) => {
      dbInstance = e.target.result;
      resolve(dbInstance);
    };
    req.onerror = (e) => reject(e);
  });
}

async function getSetting(key) {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction('settings', 'readonly');
    const req = tx.objectStore('settings').get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}

async function setSetting(key, val) {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction('settings', 'readwrite');
    tx.objectStore('settings').put(val, key);
    tx.oncomplete = () => resolve(true);
  });
}

async function getAllRecords() {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction('records', 'readonly');
    const req = tx.objectStore('records').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

async function saveRecordToDB(record) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('records', 'readwrite');
    tx.objectStore('records').put(record);
    tx.oncomplete = () => resolve(true);
    tx.onerror = (e) => reject(e);
  });
}

async function deleteRecordFromDB(id) {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction('records', 'readwrite');
    tx.objectStore('records').delete(Number(id));
    tx.oncomplete = () => resolve(true);
  });
}

/* --- 3. UI LOGIC --- */
function openImageModal(src) {
  if (!src) return;
  document.getElementById('zoomedImage').src = src;
  document.getElementById('imageZoomModal').style.display = 'flex';
}

function closeImageModal() {
  document.getElementById('imageZoomModal').style.display = 'none';
}

let cur = 'cow';
let activeActionId = null;
let activeActionType = null;

function selectAnimal(type) {
  cur = type === 'buffalo' ? 'buffalo' : 'cow';
  document.getElementById('cowBtn').classList.toggle('active', cur === 'cow');
  document.getElementById('buffaloBtn').classList.toggle('active', cur === 'buffalo');

  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  document.getElementById('lblDate').innerText = cur === 'buffalo' ? t.dtLblBuf : t.dtLblCow;
}

async function openDateModal(type, id) {
  activeActionType = type;
  activeActionId = id;
  const modal = document.getElementById('customDateModal');
  const input = document.getElementById('modalDateInput');
  const title = document.getElementById('modalTitleText');
  const docSemenContainer = document.getElementById('modalDoctorSemenContainer');
  
  const now = new Date();
  input.value = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  input.max = input.value;

  const db = await getAllRecords();
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  let animalType = t.cow;
  for (let i = 0; i < db.length; i++) {
    if (Number(db[i].id) === Number(id)) {
      animalType = (db[i].type === 'buffalo') ? t.buf : t.cow;
      break;
    }
  }

  if (type === 'repeat' || type === 'newPregnancy') {
    docSemenContainer.style.display = 'block';
    document.getElementById('modalDoctorInput').value = '';
    document.getElementById('modalSemenInput').value = '';
    document.getElementById('lblDocName').innerText = t.lblDocName;
    document.getElementById('lblSemenName').innerText = t.lblSemenName;
  } else {
    docSemenContainer.style.display = 'none';
  }

  if (lang === 'hi') {
    if (type === 'repeat') title.innerText = animalType + ' रिपीट होने के कारण नई तारीख चुनें:';
    else if (type === 'calved') title.innerText = animalType + ' ब्याने की सटीक तारीख दर्ज करें:';
    else if (type === 'newPregnancy') title.innerText = 'नया ' + animalType + ' गर्भधारण दिनांक दर्ज करें:';
    else if (type === 'changeCalve') title.innerText = animalType + ' ब्याने की सटीक तारीख बदलें:';
  } else if (lang === 'en') {
    if (type === 'repeat') title.innerText = 'Select new breeding date for ' + animalType + ':';
    else if (type === 'calved') title.innerText = 'Enter exact calving date for ' + animalType + ':';
    else if (type === 'newPregnancy') title.innerText = 'Enter new breeding date for ' + animalType + ':';
    else if (type === 'changeCalve') title.innerText = 'Change calving date for ' + animalType + ':';
  } else {
    if (type === 'repeat') title.innerText = animalType + ' पुनरावृत्तीमुळे नवीन गर्भधारणा तारीख निवडा:';
    else if (type === 'calved') title.innerText = animalType + ' विण्याची अचूक तारीख नोंदवा:';
    else if (type === 'newPregnancy') title.innerText = 'नवीन ' + animalType + ' गर्भधारणा तारीख नोंदवा:';
    else if (type === 'changeCalve') title.innerText = 'विण्याची अचूक तारीख बदला:';
  }

  modal.style.display = 'flex';
}

function closeDateModal() {
  document.getElementById('customDateModal').style.display = 'none';
  activeActionId = null;
  activeActionType = null;
}

async function submitModalDate() {
  const val = document.getElementById('modalDateInput').value;
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  
  if (!val) { alert(t.dateRequired); return; }
  const parsed = parseISODate(val);
  if (!parsed || parsed > getTodayDate()) { alert(t.futureDateError); return; }

  const docName = document.getElementById('modalDoctorInput').value.trim();
  const semenName = document.getElementById('modalSemenInput').value.trim();

  const db = await getAllRecords();
  for (let i = 0; i < db.length; i++) {
    if (Number(db[i].id) === Number(activeActionId)) {
      if (activeActionType === 'repeat' || activeActionType === 'newPregnancy') {
        db[i].date = val;
        db[i].isCalved = false;
        db[i].isAssumedCalved = false;
        db[i].calvedDate = '';
        if (docName) db[i].doctor = docName;
        if (semenName) db[i].semen = semenName;
      } else if (activeActionType === 'calved' || activeActionType === 'changeCalve') {
        db[i].isCalved = true;
        db[i].isAssumedCalved = false;
        db[i].calvedDate = val;
      }
      await saveRecordToDB(db[i]);
      break;
    }
  }

  closeDateModal();
  draw();
}

function compressImage(file, callback) {
  if (!file || !file.type || file.type.indexOf('image/')!==0) { callback(''); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > 500) { h = h * (500 / w); w = 500; }
      if (h > 500) { w = w * (500 / h); h = 500; }
      canvas.width = Math.round(w); canvas.height = Math.round(h);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => callback('');
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function previewPhoto() {
  const input = document.getElementById('cPhoto');
  const preview = document.getElementById('photoPreview');
  if (input.files && input.files[0]) {
    compressImage(input.files[0], (res) => {
      if (res) { preview.src = res; preview.style.display = 'block'; }
      else { preview.removeAttribute('src'); preview.style.display = 'none'; }
    });
  }
}

function parseISODate(str) {
  if (typeof str!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(str)) return null;
  const p = str.split('-').map(Number);
  const d = new Date(p[0], p[1]-1, p[2]);
  if (d.getFullYear()!==p[0] || d.getMonth()!==p[1]-1 || d.getDate()!==p[2]) return null;
  d.setHours(0,0,0,0);
  return d;
}

function getTodayDate() {
  const d = new Date(); d.setHours(0,0,0,0); return d;
}

function getDayDifference(start, end) {
  return Math.round((end - start)/86400000);
}

function formatDate(d) {
  return String(d.getDate()).padStart(2,'0') + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + d.getFullYear();
}

function addD(str, days) {
  const d = parseISODate(str);
  if (!d) return '---';
  d.setDate(d.getDate() + Number(days||0));
  return formatDate(d);
}

function getFormattedDuration(str, lang) {
  const start = parseISODate(str);
  if (!start) return lang==='en'?'0 days':(lang==='hi'?'0 दिन':'० दिवस');
  const now = getTodayDate();
  if (now < start) return lang==='en'?'0 days':(lang==='hi'?'0 दिन':'० दिवस');
  const yrs = now.getFullYear() - start.getFullYear();
  let m = now.getMonth() - start.getMonth() + (yrs*12);
  let d = now.getDate() - start.getDate();
  if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (m < 0) { m = 0; d = 0; }

  if (lang==='en') return m + ' mos ' + d + ' days';
  if (lang==='hi') return m + ' महीने ' + d + ' दिन';
  return m + ' महिना ' + d + ' दिवस';
}

function escapeHtml(val) {
  return String(val==null ? '' : val).replace(/[&<>'"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c]));
}

async function draw() {
  const box = document.getElementById('list');
  if (!box) return;
  const db = await getAllRecords();
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;

  let cows = 0, buffaloes = 0;
  const today = getTodayDate();

  for (let i = 0; i < db.length; i++) {
    const it = db[i];
    const start = parseISODate(it.date);
    if (start && !it.isCalved) {
      const pDays = getDayDifference(start, today);
      const tot = it.type==='buffalo' ? 310 : 282;
      if (pDays >= tot && !it.calvedDate) {
        it.isCalved = true;
        it.isAssumedCalved = true;
        const assumedCalveDate = new Date(start.getTime());
        assumedCalveDate.setDate(assumedCalveDate.getDate() + tot);
        it.calvedDate = assumedCalveDate.getFullYear() + '-' + String(assumedCalveDate.getMonth()+1).padStart(2,'0') + '-' + String(assumedCalveDate.getDate()).padStart(2,'0');
        await saveRecordToDB(it);
      }
    }

    if (it.type==='cow') cows++;
    if (it.type==='buffalo') buffaloes++;
  }

  document.getElementById('totalCount').innerText = db.length;
  document.getElementById('cowCount').innerText = cows;
  document.getElementById('buffaloCount').innerText = buffaloes;

  if (db.length === 0) {
    box.innerHTML = '<div class="empty">' + escapeHtml(t.empty) + '</div>';
    checkSmartNotifications(db);
    return;
  }

  db.sort((a, b) => Number(b.id) - Number(a.id));

  let html = '';

  for (let i = 0; i < db.length; i++) {
    const it = db[i];
    const isBuffalo = it.type==='buffalo';
    const tot = isBuffalo ? 310 : 282;
    const start = parseISODate(it.date);

    const imgHtml = it.photo ? '<img src="'+escapeHtml(it.photo)+'" onclick="openImageModal(\''+escapeHtml(it.photo)+'\')">' : (isBuffalo ? '🐃' : '🐄');
    const safeName = escapeHtml(it.name);
    const docName = escapeHtml(it.doctor || '').trim();
    const semenName = escapeHtml(it.semen || '').trim();
    const animalLabel = isBuffalo ? '🐃 ' + t.buf : '🐄 ' + t.cow;
    const safeId = Number(it.id);

    html += '<div class="item">';
    html += '<div class="cow-img">'+imgHtml+'</div>';
    html += '<div class="item-info">';

    if (!it.isCalved) {
      const pDays = start ? getDayDifference(start, today) : 0;
      const dry = isBuffalo ? 220 : 210;
      const dewormDay = tot - 30;

      const check21 = addD(it.date, 21);
      const dryDate = addD(it.date, dry);
      const dewormDate = addD(it.date, dewormDay);
      const transDate = addD(it.date, tot-21);
      const deliveryDate = addD(it.date, tot);

      html += '<div class="item-top"><span>'+ animalLabel +' &nbsp; <b>'+safeName+'</b></span>';
      html += '<span class="duration-badge">⏱️ '+escapeHtml(getFormattedDuration(it.date, lang))+'</span></div>';

      html += '<div class="row"><span>📅 '+(isBuffalo?t.dtLblBuf:t.dtLblCow)+'</span><span class="date-badge">'+escapeHtml(start ? formatDate(start) : '---')+'</span></div>';
      html += '<div class="row"><span>'+t.chk21+'</span><span class="date-badge">'+escapeHtml(check21)+'</span></div>';
      html += '<div class="row"><span>'+t.milkDry+'</span><span class="date-badge">'+escapeHtml(dryDate)+'</span></div>';
      html += '<div class="row"><span>'+t.deworm+'</span><span class="date-badge">'+escapeHtml(dewormDate)+'</span></div>';
      html += '<div class="row"><span>'+t.trans+'</span><span class="date-badge">'+escapeHtml(transDate)+'</span></div>';

      html += '<div class="due"><span>'+t.delivery+'</span><span class="due-badge">'+escapeHtml(deliveryDate)+'</span></div>';

      if (docName || semenName) {
        html += '<div class="note-box">';
        if (docName) html += '<div>💉 <b>'+t.lblDocField+':</b> ' + docName + '</div>';
        if (semenName) html += '<div>🧬 <b>'+t.lblSemenField+':</b> ' + semenName + '</div>';
        html += '</div>';
      }

      html += '<div class="action-btns">';
      const calveThreshold = isBuffalo ? 296 : 268;
      if (pDays >= calveThreshold) {
        html += '<button class="btn-calved" type="button" onclick="openDateModal(\'calved\','+safeId+')">'+escapeHtml(t.calvedBtn)+'</button>';
      }
      html += '<button class="btn-repeat" type="button" onclick="openDateModal(\'repeat\','+safeId+')">'+escapeHtml(t.repeatBtn)+'</button>';
      html += '<button class="btn-del" type="button" onclick="delData('+safeId+')">'+escapeHtml(t.delBtn)+'</button>';
      html += '</div>';

    } else {
      const calvedDate = parseISODate(it.calvedDate);
      const cDays = calvedDate ? getDayDifference(calvedDate, today) : 0;
      const restDays = 90;
      
      const heatStart = new Date(calvedDate.getTime());
      heatStart.setDate(heatStart.getDate() + restDays);

      const calvedTitleTxt = lang==='en'?'Calved':(lang==='hi'?'ब्याई है':'वीण झाली');
      const daysCountLbl = lang==='en'?'Days since calving:':(lang==='hi'?'ब्याने के बाद के दिन:':'विण्यापासून झालेले दिवस:');
      const daysUnitTxt = lang==='en'?' days':(lang==='hi'?' दिन':' दिवस');

      html += '<div class="item-top"><span>'+ animalLabel +' &nbsp; <b>'+safeName+'</b></span>';
      html += '<span class="duration-badge" style="background:#dcfce7; color:#15803d; border-color:#86efac;">🐄 '+calvedTitleTxt+'</span></div>';

      html += '<div class="row"><span>📅 '+daysCountLbl+'</span><span class="date-badge" style="background:#dbeafe; color:#1e40af; border-color:#93c5fd;">'+cDays+daysUnitTxt+'</span></div>';
      html += '<div class="row"><span>'+t.calvedDateLbl+'</span><span class="date-badge">'+escapeHtml(calvedDate ? formatDate(calvedDate) : '---')+'</span></div>';
      html += '<div class="row"><span>'+t.heatWindowText+'</span><span class="date-badge">'+formatDate(heatStart)+'</span></div>';

      if (it.isAssumedCalved) {
        html += '<div class="small-assumption-note">'+t.assumedNote+'</div>';
      } else {
        html += '<div class="small-assumption-note">'+t.guidanceNote+'</div>';
      }

      html += '<div class="action-btns" style="flex-wrap:wrap;">';
      html += '<button class="btn-calved" type="button" onclick="openDateModal(\'changeCalve\','+safeId+')">'+escapeHtml(t.changeCalveDateBtn)+'</button>';
      html += '<button class="btn-repeat" type="button" onclick="openDateModal(\'newPregnancy\','+safeId+')">'+escapeHtml(t.setNewDateBtn)+'</button>';
      html += '<button class="btn-del" type="button" onclick="delData('+safeId+')">'+escapeHtml(t.delBtn)+'</button>';
      html += '</div>';
    }

    html += '</div></div>';
  }

  box.innerHTML = html;
  checkSmartNotifications(db);
}

/* --- 5. NOTIFICATIONS LOGIC --- */
function checkSmartNotifications(db) {
  const banner = document.getElementById('notifBannerBox');
  const title = document.getElementById('notifTitleText');
  const list = document.getElementById('notifListContainer');
  if (!banner || !title || !list) return;

  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  title.innerText = t.notifTitle;

  const today = getTodayDate();
  const alerts = [];

  for (let i = 0; i < db.length; i++) {
    const it = db[i];
    const isBuff = it.type === 'buffalo';
    const animalName = (isBuff ? '🐃' : '🐄') + ' ' + escapeHtml(it.name);
    const animalWord = isBuff ? (lang==='en'?'Buffalo':(lang==='hi'?'भैंस':'म्हैस')) : (lang==='en'?'Cow':(lang==='hi'?'गाय':'गाय'));

    if (it.isCalved) {
      const calvedDate = parseISODate(it.calvedDate);
      if (calvedDate) {
        const cDay = getDayDifference(calvedDate, today);
        if (cDay >= 88 && cDay <= 93) {
          let heatMsg = lang==='en' ? ('💡 90 days rest completed ('+cDay+' days). Check '+animalWord+' for next Heat & breed.') : (lang==='hi' ? ('💡 ब्याने के 90 दिन पूर्ण ('+cDay+' दिन)। '+animalWord+' की हीट जाँच कर दोबारा गर्भधारण कराएं।') : ('💡 विण्यापासून ९० दिवस पूर्ण झाले आहेत ('+cDay+' दिवस). '+animalWord+' माजावर आली असल्यास तपासून AI करा.'));
          alerts.push({name: animalName, text: heatMsg});
        }
      }
      continue;
    }

    const start = parseISODate(it.date);
    if (!start || start > today) continue;

    const pDay = getDayDifference(start, today);
    const tot = isBuff ? 310 : 282;

    if (pDay >= 18 && pDay <= 22) {
      const rem = 21 - pDay;
      let msg = '';
      if (lang === 'en') {
        msg = rem > 0 ? `🔴 Heat Check upcoming (${rem} days remaining).` : `🔴 Heat Check Day (Day 21) active.`;
      } else if (lang === 'hi') {
        msg = rem > 0 ? `🔴 उलट जांच के दिन नजदीक हैं (${rem} दिन शेष)।` : `🔴 आज उलट जांच (21वां दिन) का मुख्य दिन है!`;
      } else {
        msg = rem > 0 ? `🔴 उलट तपासणीचे दिवस जवळ आहेत (${rem} दिवस बाकी).` : `🔴 आज उलट तपासणी (२१ वा दिवस) चा मुख्य दिवस आहे!`;
      }
      alerts.push({ name: animalName, text: msg });
    }

    const dryStart = isBuff ? 220 : 210;
    const dryEnd = isBuff ? 228 : 218;
    if (pDay >= dryStart && pDay <= dryEnd) {
      let dryMsg = lang==='en' ? '🥛 Dry period schedule is active. Please arrange to dry off milk production.' : (lang==='hi' ? '🥛 दूध बंद करने का सही समय है।' : '🥛 दूध आटवण्याची योग्य वेळ झाली आहे.');
      alerts.push({ name: animalName, text: dryMsg });
    }

    const dewormStart = tot - 33;
    const dewormEnd = tot - 28;
    if (pDay >= dewormStart && pDay <= dewormEnd) {
      const daysLeft = tot - pDay;
      let dewormMsg = lang==='en' ? `💊 Deworming medicine due (${daysLeft} days before calving).` : (lang==='hi' ? `💊 ब्याने से पहले डिवॉर्मिंग दवा देने का समय (${daysLeft} दिन बाकी)।` : `💊 विण्यापूर्वी जंतनाशक औषध देण्याची वेळ झाली आहे (${daysLeft} दिवस बाकी).`);
      alerts.push({ name: animalName, text: dewormMsg });
    }

    const transStart = tot - 23;
    const transEnd = tot - 19;
    if (pDay >= transStart && pDay <= transEnd) {
      let transMsg = lang==='en' ? '🌾 Start transition feed for healthy calving energy.' : (lang==='hi' ? '🌾 ट्रांजिशन चारा शुरू करें।' : '🌾 ट्रान्झिशन आहार सुरू करा.');
      alerts.push({ name: animalName, text: transMsg });
    }

    const deliveryNotificationStart = tot - 14;
    if (pDay >= deliveryNotificationStart && pDay <= tot + 9) {
      const deliveryDate = new Date(start.getTime()); deliveryDate.setDate(deliveryDate.getDate() + tot);
      const daysToDelivery = Math.round((deliveryDate - today) / 86400000);
      
      let dayCountText = '';
      if (daysToDelivery > 0) {
        dayCountText = lang==='en' ? `(${daysToDelivery} days remaining)` : (lang==='hi' ? `(${daysToDelivery} दिन बाकी)` : `(${daysToDelivery} दिवस बाकी आहेत)`);
      } else if (daysToDelivery === 0) {
        dayCountText = lang==='en' ? '(Est. delivery today)' : (lang==='hi' ? '(आज अनुमानित समय है)' : '(आज विण्याची अंदाजे वेळ आहे)');
      } else {
        dayCountText = lang==='en' ? '(Term completed)' : (lang==='hi' ? '(अवधि पूर्ण हुई)' : '(कालावधी पूर्ण झाला)');
      }

      let delNotifTxt = '';
      if (lang === 'en') {
        delNotifTxt = `🍼 ${animalWord} delivery time near ${dayCountText}. If calved, click "Calved"!`;
      } else if (lang === 'hi') {
        delNotifTxt = `🍼 ${animalWord} ब्याने का समय नजदीक है ${dayCountText}। यदि ब्या गई है, तो "ब्याया है" बटन दबाएं!`;
      } else {
        delNotifTxt = `🍼 ${animalWord} विण्याची वेळ जवळ आली आहे ${dayCountText}. जर पशु विले असेल, तर "वीण झाली आहे" बटण दाबा!`;
      }
      alerts.push({ name: animalName, text: delNotifTxt });
    }
  }

  if (alerts.length === 0) {
    banner.style.display = 'none';
    list.innerHTML = '';
    return;
  }

  let html = '';
  for (let i = 0; i < alerts.length; i++) {
    html += '<div class="notif-item"><div style="font-weight:900; color:#991b1b;">'+alerts[i].name+'</div><div style="color:#c2410c;">'+alerts[i].text+'</div></div>';
  }
  list.innerHTML = html;
  banner.style.display = 'block';
}

async function saveData() {
  const dt = document.getElementById('cDate').value;
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  const inputDate = parseISODate(dt);

  if (!inputDate) { alert(t.dateRequired); return; }
  if (inputDate > getTodayDate()) { alert(t.futureDateError); return; }

  const nm = document.getElementById('cName').value.trim() || (cur==='cow' ? t.bCow : t.bBuf);
  const doc = document.getElementById('cDoc').value.trim();
  const semen = document.getElementById('cSemen').value.trim();
  const previewImg = document.getElementById('photoPreview');
  const photo = previewImg.style.display==='block' ? previewImg.src : '';

  const newRecord = { 
    id: Date.now(), 
    name: nm, 
    type: cur, 
    date: dt, 
    doctor: doc,
    semen: semen,
    photo: photo,
    isCalved: false,
    calvedDate: '',
    isAssumedCalved: false
  };

  try {
    await saveRecordToDB(newRecord);
  } catch (e) {
    alert(t.storageError);
    return;
  }

  document.getElementById('cName').value = '';
  document.getElementById('cDoc').value = '';
  document.getElementById('cSemen').value = '';
  document.getElementById('cPhoto').value = '';
  previewImg.style.display = 'none';
  setTodayMaxDate();
  draw();
}

async function delData(id) {
  const lang = document.getElementById('langSelect').value;
  const t = langData[lang] || langData.mr;
  if (!confirm(t.confirmDel)) return;
  await deleteRecordFromDB(id);
  draw();
}

async function initApp() {
  let unlocked = false;
  try {
    unlocked = (await getSetting('cattle_unlocked')) === 'true';
  } catch (e) {}

  if (!unlocked) {
    document.getElementById('lockScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display = 'none';
    return;
  }
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';

  let savedLang = 'mr';
  try {
    savedLang = (await getSetting('cattle_lang')) || 'mr';
  } catch (e) {}
  document.getElementById('langSelect').value = savedLang;
  setTodayMaxDate();
  changeLanguage();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
