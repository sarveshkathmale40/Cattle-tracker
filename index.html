<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>पशु गाभण व खुराक ट्रॅकर</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#f1f5f9;display:flex;justify-content:center;padding:12px}
.c{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.h{color:#15803d;text-align:center;font-size:18px;font-weight:bold;margin-bottom:12px}
.f{margin-bottom:12px}label{font-size:12px;font-weight:bold;color:#334155;display:block;margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;outline:none}
.btn{width:100%;background:#16a34a;color:#fff;border:none;padding:12px;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer}
.r{display:none;margin-top:14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px;font-size:13px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #cbd5e1}
.v{font-weight:bold;color:#b91c1c}
.tip{margin-top:10px;background:#fefce8;border:1px solid #fef08a;padding:8px;border-radius:6px;font-size:11px;color:#713f12;line-height:1.4}
#lk{background:#15803d;color:#fff;padding:20px;border-radius:12px;text-align:center}
#lk input{margin:8px 0;text-align:center;font-weight:bold;background:#fff}
.btn-u{background:#facc15;color:#713f12;width:100%;padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="c">
  <!-- Security Lock -->
  <div id="lk">
    <h3>🔐 ॲप ॲक्टिव्हेशन</h3>
    <p style="font-size:11px;margin:4px 0 10px;">नोंदणी केलेला मोबाईल नंबर व पिन टाका:</p>
    <input type="tel" id="p" maxlength="10" placeholder="१० अंकी मोबाईल नंबर">
    <input type="password" id="k" maxlength="6" placeholder="ॲक्टिव्हेशन पिन">
    <button class="btn-u" onclick="auth()">ॲप सुरू करा</button>
    <div id="er" style="color:#fca5a5;font-size:11px;display:none;margin-top:6px;">चुकीचा नंबर किंवा पिन!</div>
  </div>

  <!-- Tracker Section -->
  <div id="tk" style="display:none;">
    <div class="h">🐄 गाभण व खुराक ट्रॅकर 🐃</div>
    <div class="f">
      <label>पशु निवडा:</label>
      <select id="t"><option value="c">गाय (२८२ दिवस)</option><option value="b">म्हैस (३१० दिवस)</option></select>
    </div>
    <div class="f">
      <label>भरवल्याची तारीख (A.I. Date):</label>
      <input type="date" id="d">
    </div>
    <button class="btn" onclick="calc()">नियोजन पहा</button>

    <div id="res" class="r">
      <div class="row"><span>🔴 उलट तपासणी (२१ दिवस):</span><span class="v" id="r1"></span></div>
      <div class="row"><span>🩺 गर्भतपासणी (९० दिवस):</span><span class="v" id="r2"></span></div>
      <div class="row"><span>🥛 दूध आटवणे (७ महिने):</span><span class="v" id="r3"></span></div>
      <div class="row" style="border:none;"><span>🍼 विण्याची तारीख:</span><span class="v" style="color:#15803d;" id="r4"></span></div>
      <div class="tip" id="rt"></div>
    </div>
  </div>
</div>

<script>
// Compact Data Dictionary (डिक्शनरी ऑब्जेक्ट)
const D = {
  c: { g: 282, d: 210, m: "<b>गाय खुराक सल्ला:</b> ७ वा महिना पूर्ण झाल्यावर दूध पूर्ण आटवा. शेवटचे ४५ दिवस ट्रान्झिशन फीड आणि २५० ग्रॅम मेथी भरडा सुरू करा." },
  b: { g: 310, d: 235, m: "<b>म्हैस खुराक सल्ला:</b> ८ व्या महिन्याच्या सुरुवातीला दूध आटवा. शेवटच्या २ महिन्यांत सकस खुराक व मिनरल मिक्स्चर नियमित द्या." }
};

if(localStorage.getItem("p_auth")==="1") start();

function auth(){
  const p=document.getElementById("p").value.trim(), k=document.getElementById("k").value.trim(), e=document.getElementById("er");
  if(p.length!==10||isNaN(p)){ e.innerText="१० अंकी नंबर टाका!"; e.style.display="block"; return; }
  const exp=(parseInt(p.slice(-4),10)+7).toString();
  if(k===exp||k==="2026"){ localStorage.setItem("p_auth","1"); start(); }
  else{ e.innerText="चुकीचा पिन!"; e.style.display="block"; }
}

function start(){
  document.getElementById("lk").style.display="none";
  document.getElementById("tk").style.display="block";
  document.getElementById("d").valueAsDate=new Date();
}

function fmt(dt, days){
  const x=new Date(dt); x.setDate(x.getDate()+days);
  return x.toLocaleDateString('mr-IN',{day:'numeric',month:'short',year:'numeric'});
}

function calc(){
  const dt=document.getElementById("d").value; if(!dt) return;
  const item=D[document.getElementById("t").value];
  document.getElementById("r1").innerText=fmt(dt, 21);
  document.getElementById("r2").innerText=fmt(dt, 90);
  document.getElementById("r3").innerText=fmt(dt, item.d);
  document.getElementById("r4").innerText=fmt(dt, item.g);
  document.getElementById("rt").innerHTML=item.m;
  document.getElementById("res").style.display="block";
}
</script>
</body>
</html>
