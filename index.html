<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="पशु ट्रॅकर">
  
  <title>पशु ट्रॅकर</title>

  <!-- PWA Manifest -->
  <link rel="manifest" id="mPlaceholder">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f1f5f9; padding: 12px; display: flex; justify-content: center; }
    .wrap { width: 100%; max-width: 400px; }

    header { background: #16a34a; color: white; padding: 14px; border-radius: 12px; text-align: center; font-weight: bold; font-size: 16px; margin-bottom: 12px; }

    /* INSTALL BANNER */
    .banner { background: #dcfce7; border: 2px dashed #16a34a; border-radius: 12px; padding: 14px; text-align: center; margin-bottom: 12px; }
    .banner b { display: block; color: #166534; font-size: 14px; margin-bottom: 4px; }
    .banner p { font-size: 11px; color: #15803d; margin-bottom: 8px; }
    .btn-inst { width: 100%; background: #16a34a; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }

    /* FORM */
    .card { background: white; border-radius: 12px; padding: 14px; border: 1px solid #cbd5e1; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .tab { background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 8px; padding: 8px; text-align: center; font-size: 12px; font-weight: bold; cursor: pointer; }
    .tab.active { background: #dcfce7; border-color: #16a34a; color: #166534; }

    .fld { margin-bottom: 10px; text-align: left; }
    label { display: block; font-size: 12px; font-weight: bold; color: #334155; margin-bottom: 3px; }
    input { width: 100%; padding: 11px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #fff; }
    input:focus { border-color: #16a34a; }
    .btn-sub { width: 100%; background: #16a34a; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }

    /* RECORD */
    .item { background: white; border-radius: 12px; padding: 12px; border: 1px solid #cbd5e1; margin-bottom: 10px; }
    .item-top { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; margin-bottom: 6px; }
    .row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; color: #475569; }
    .row b { color: #0f172a; }
    .due { background: #ecfdf5; padding: 6px; border-radius: 6px; color: #166534; font-weight: bold; margin-top: 6px; }
    .diet { background: #fffbeb; border: 1px solid #fef3c7; border-radius: 6px; padding: 8px; font-size: 11px; color: #92400e; margin-top: 6px; }
    .btn-del { width: 100%; background: #fee2e2; color: #b91c1c; border: none; padding: 6px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>

<div class="wrap">

  <header>🐄 पशु गाभण ट्रॅकर</header>

  <!-- INSTALL BANNER -->
  <div class="banner" id="pBanner">
    <b>📲 हे ॲप मोबाईल स्क्रीनवर सेव्ह करा</b>
    <p>एका क्लिकवर ॲप उघडण्यासाठी खालील बटण दाबा:</p>
    <button class="btn-inst" onclick="installApp()">⬇️ ॲप डाऊनलोड करा / Install</button>
  </div>

  <!-- FORM -->
  <div class="card">
    <div class="grid">
      <div id="tCow" class="tab active" onclick="setAn('cow')">गाय (२८२)</div>
      <div id="tBuf" class="tab" onclick="setAn('buffalo')">म्हैस (३१०)</div>
      <div id="tGoat" class="tab" onclick="setAn('goat')">शेळी (१५०)</div>
    </div>

    <div class="fld">
      <label>नाव किंवा टॅग नंबर:</label>
      <input type="text" id="cName" placeholder="उदा. कावेरी / 01">
    </div>

    <div class="fld">
      <label>भरवल्याची तारीख (A.I. Date):</label>
      <input type="date" id="cDate">
    </div>

    <button class="btn-sub" onclick="saveData()">नोंद जोडा आणि ट्रॅक करा</button>
  </div>

  <div id="list"></div>

</div>

<script>
  // PWA Manifest Generator
  const mData = {
    name: "पशु ट्रॅकर", short_name: "पशु ट्रॅकर",
    start_url: window.location.href, display: "standalone",
    background_color: "#ffffff", theme_color: "#16a34a",
    icons: [{src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>", sizes: "192x192", type: "image/svg+xml"}]
  };
  document.getElementById('mPlaceholder').setAttribute('href', URL.createObjectURL(new Blob([JSON.stringify(mData)], {type: 'application/json'})));

  var pPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    pPrompt = e;
  });

  function installApp() {
    if (pPrompt) {
      pPrompt.prompt();
      pPrompt.userChoice.then(function(res) {
        if (res.outcome === 'accepted') document.getElementById('pBanner').style.display = 'none';
        pPrompt = null;
      });
    } else {
      alert("मोबाईल स्क्रीनवर सेव्ह करण्यासाठी ब्राऊझरच्या ३ टिंबांवर (⋮) दाबा आणि 'Add to Home screen' निवडा.");
    }
  }

  var cur = 'cow';
  window.onload = function() {
    var d = new Date();
    document.getElementById("cDate").value = d.toISOString().split('T')[0];
    draw();
  };

  function setAn(t) {
    cur = t;
    document.getElementById("tCow").className = (t === 'cow') ? 'tab active' : 'tab';
    document.getElementById("tBuf").className = (t === 'buffalo') ? 'tab active' : 'tab';
    document.getElementById("tGoat").className = (t === 'goat') ? 'tab active' : 'tab';
  }

  function getDB() {
    return JSON.parse(localStorage.getItem("pashu_db_v3") || "[]");
  }

  function saveData() {
    var dt = document.getElementById("cDate").value;
    if (!dt) { alert("त तारीख निवडा!"); return; }
    var nm = document.getElementById("cName").value.trim() || (cur === 'cow' ? 'गाय' : (cur === 'buffalo' ? 'म्हैस' : 'शेळी'));
    
    var db = getDB();
    db.unshift({ id: Date.now(), name: nm, type: cur, date: dt });
    localStorage.setItem("pashu_db_v3", JSON.stringify(db));
    document.getElementById("cName").value = "";
    draw();
  }

  function delData(id) {
    var db = getDB().filter(function(i){ return i.id !== id; });
    localStorage.setItem("pashu_db_v3", JSON.stringify(db));
    draw();
  }

  function addD(str, days) {
    var d = new Date(str);
    d.setDate(d.getDate() + days);
    return d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();
  }

  function getDays(str) {
    var diff = Math.floor((new Date() - new Date(str)) / (1000 * 60 * 60 * 24));
    return diff >= 0 ? diff : 0;
  }

  function draw() {
    var box = document.getElementById("list");
    var db = getDB();
    if (db.length === 0) {
      box.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:12px; padding:16px;">अद्याप नोंद नाही.</div>';
      return;
    }

    var html = "";
    for (var i = 0; i < db.length; i++) {
      var it = db[i];
      var tot = 282, dry = 210, ico = "🐄";
      if (it.type === 'buffalo') { tot = 310; dry = 235; ico = "🐃"; }
      if (it.type === 'goat') { tot = 150; dry = 100; ico = "🐐"; }

      var daysIn = getDays(it.date);
      var tip = "नियमित संतुलित चारा व ५० ग्रॅम खनिज मिश्रण द्या.";
      if (it.type === 'cow' && daysIn >= 210) tip = "<b>७ वा महिना पूर्ण:</b> दूध आटवा व कासेची काळजी घ्या.";
      if (it.type === 'buffalo' && daysIn >= 235) tip = "<b>८ वा महिना:</b> म्हशीचे दूध आटवा.";

      html += '<div class="item">';
      html += '  <div class="item-top"><span>' + ico + ' ' + it.name + '</span><span style="color:#16a34a;">' + daysIn + ' दिवस पूर्ण</span></div>';
      html += '  <div class="row"><span>🔴 उलट तपासणी (२१ वा):</span><b>' + addD(it.date, 21) + '</b></div>';
      if (it.type !== 'goat') {
        html += '  <div class="row"><span>🩺 गर्भतपासणी (९० वा):</span><b>' + addD(it.date, 90) + '</b></div>';
        html += '  <div class="row"><span>🥛 दूध आटवणे:</span><b>' + addD(it.date, dry) + '</b></div>';
      }
      html += '  <div class="row due"><span>🍼 विण्याची तारीख:</span><span>' + addD(it.date, tot) + '</span></div>';
      html += '  <div class="diet">' + tip + '</div>';
      html += '  <button class="btn-del" onclick="delData(' + it.id + ')">🗑️ नोंद हटवा</button>';
      html += '</div>';
    }
    box.innerHTML = html;
  }
</script>

</body>
</html>
